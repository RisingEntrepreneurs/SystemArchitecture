{id:'m6-9',g:'软件设计',t:'面向对象基础与设计原则',f:'高',sub:'对象/类/封装/继承/多态、重载与重写、动态绑定、抽象类与接口、OOA与OOD、七大设计原则',
core:`## 面向对象基本概念
- **对象**：属性（状态）+ 方法（行为）+ 唯一标识；**类**：具有相同属性和方法的对象的抽象，对象是类的实例。
- **封装**：隐藏内部实现，只通过接口访问，实现**信息隐藏**。
- **继承**：子类复用父类的属性与方法并可扩展，是 is-a 关系；单继承与多继承。
- **多态**：同一消息作用于不同对象产生不同行为。
- 多态的类型：**参数多态**（泛型）、**包含多态**（子类型，继承与重写）、**过载多态（重载）**、**强制多态**（类型转换）。
- **重载（Overload）**：同一类中方法名相同、**参数列表不同**，编译时确定。
- **重写（覆盖 Override）**：子类重新定义父类中**签名相同**的方法，运行时确定。
- **动态绑定（晚期绑定）**：运行时根据对象实际类型确定调用哪个方法，是实现多态的基础。
- **抽象类**：不能实例化，可含抽象方法与具体方法；**接口**：只定义规范（行为契约），一个类可实现多个接口。
## 面向对象分析与设计
- **OOA**：认定对象 → 组织对象 → 描述对象间相互作用 → 确定对象的操作 → 定义对象内部信息。
- **OOD**：识别类及对象 → 定义属性 → 定义服务 → 识别关系 → 识别包。
- 分析阶段的类可分为**实体类**（持久数据）、**边界类**（与外部交互，界面、接口）、**控制类**（协调业务流程）。
## 七大设计原则
- **单一职责 SRP**：一个类只有一个引起它变化的原因。
- **开闭原则 OCP**：对**扩展开放**、对**修改关闭**（核心原则，通过抽象与多态实现）。
- **里氏替换 LSP**：子类对象必须能**替换**父类对象而不改变程序正确性。
- **依赖倒置 DIP**：高层模块与低层模块都应**依赖抽象**；面向接口编程。
- **接口隔离 ISP**：使用多个专门的接口，不强迫客户依赖不需要的方法。
- **组合/聚合复用原则 CARP**：优先使用对象组合而不是继承来复用。
- **迪米特法则（最少知识原则）**：一个对象应尽量少地了解其他对象，只与"直接朋友"通信。
!! 重载是编译时多态（参数不同），重写是运行时多态（签名相同）。
!! 边界类负责与外部交互，控制类负责流程协调，实体类负责持久数据。`,
fig:[{k:'tree',t:'面向对象设计原则（动态演示）',anim:true,root:'设计原则',items:['单一职责 SRP|一个类只有一个引起变化的原因','开闭原则 OCP|对扩展开放，对修改关闭','里氏替换 LSP|子类对象可以替换父类对象','依赖倒置 DIP|高层与低层都依赖抽象','接口隔离 ISP|使用多个专门接口而非单一总接口','组合复用 CARP|优先组合，少用继承','迪米特法则|只与直接朋友通信，最少知识'],caps:['例：把"订单计算"和"订单打印"拆成两个类。','例：新增支付方式只需新增实现类，不修改已有代码。','例：正方形继承长方形会破坏"设置宽高互不影响"的约定，违反 LSP。','例：订单服务依赖"支付接口"，而不是直接依赖"支付宝SDK"。','例：把"多功能打印机"大接口拆成打印、扫描、传真小接口。','例：用"拥有一个日志器"代替"继承日志类"。','例：顾客不应直接操作收银员钱包里的钱，而是通过收银员完成付款。']},

{id:'m6-10',g:'软件设计',t:'设计模式',f:'高',sub:'创建型、结构型、行为型模式分类、类模式与对象模式、常考模式的意图与适用场景、易混模式辨析',
core:`## 分类（GoF 23 种）
- **创建型（5 种）**：抽象对象的实例化过程——**工厂方法、抽象工厂、单例、原型、生成器（建造者）**。
- **结构型（7 种）**：组合类或对象形成更大结构——**适配器、桥接、组合、装饰、外观、享元、代理**。
- **行为型（11 种）**：对象之间的职责分配与通信——**责任链、命令、解释器、迭代器、中介者、备忘录、观察者、状态、策略、模板方法、访问者**。
- **类模式**（基于继承，编译时确定）：工厂方法、（类）适配器、解释器、模板方法；其余为对象模式（基于组合）。
## 常考模式意图
- **单例**：保证一个类只有一个实例，并提供全局访问点（配置管理器、连接池）。
- **工厂方法**：定义创建对象的接口，由**子类决定**实例化哪个类；**抽象工厂**：创建**一系列相关或相互依赖的对象**（产品族），无需指定具体类。
- **生成器**：将复杂对象的构建与表示分离，同样的构建过程可创建不同表示。
- **原型**：通过复制现有实例创建新对象。
- **适配器**：把一个类的接口**转换**成客户期望的另一个接口，使不兼容的类可以一起工作。
- **桥接**：将**抽象部分与实现部分分离**，使它们可以独立变化（如形状 × 颜色）。
- **组合**：将对象组合成**树形结构**表示"部分—整体"层次，使客户对单个对象与组合对象处理一致（文件夹与文件）。
- **装饰**：**动态地给对象添加职责**，比继承更灵活（Java I/O 流）。
- **外观**：为子系统提供一个**统一的高层接口**，简化使用。
- **享元**：运用共享技术有效支持**大量细粒度对象**（棋子、字符）。
- **代理**：为其他对象提供代理以**控制对它的访问**（远程代理、虚代理、保护代理、缓存）。
- **观察者**：一对多依赖，对象状态改变时**自动通知**所有依赖者（发布/订阅、事件监听）。
- **策略**：定义一系列算法并分别封装，使它们**可以互相替换**。
- **状态**：对象内部状态改变时改变其行为，看起来像改变了类（订单状态机）。
- **模板方法**：在父类定义算法骨架，把某些步骤**延迟到子类**实现。
- **责任链**：多个对象依次处理请求，直到有对象处理（审批流、过滤器链）。
- **命令**：把请求封装为对象，支持排队、日志、**撤销**。
- **中介者**：用中介对象封装对象间的交互，使对象之间**松耦合**（网状变星型）。
- **备忘录**：在不破坏封装的前提下捕获并保存对象内部状态，以便**恢复**。
- **访问者**：在不改变元素类的前提下定义作用于这些元素的**新操作**。
- **迭代器**：顺序访问聚合对象中的元素而不暴露其内部表示。
- **解释器**：给定语言的文法，定义解释器解释句子。
!! 适配器"转换接口"、装饰"增加职责"、代理"控制访问"、外观"简化接口"——四者结构相似，靠意图区分。

{id:'m6-11',g:'软件设计',t:'UML图与关系',f:'高',sub:'UML结构图与行为图、类之间六种关系、多重度、用例关系、顺序图与通信图、状态图与活动图、构件图与部署图',
core:`## UML 2.x 的图
- **结构图（静态）**：**类图、对象图、包图、构件图、部署图**、组合结构图、制品图。
- **行为图（动态）**：**用例图、活动图、状态图**；交互图：**顺序图、通信图**、交互概览图、定时图。
## 类之间的关系（由弱到强：依赖 < 关联 < 聚合 < 组合）
- **依赖**：一个类使用另一个类（参数、局部变量），**虚线箭头**。
- **关联**：类之间结构上的联系，实线；有**多重度**（1、0..1、*、1..*）。
- **聚合**：整体与部分，**部分可独立存在**，**空心菱形**在整体端（汽车与轮胎、部门与员工）。
- **组合**：整体与部分**生命周期相同**，部分不能脱离整体，**实心菱形**（订单与订单明细、人与心脏）。
- **泛化**：继承关系，**实线 + 空心三角**指向父类。
- **实现**：类实现接口，**虚线 + 空心三角**指向接口。
## 用例之间的关系
- **包含 include**：基用例执行时**必须**执行被包含用例，用于抽取公共行为；箭头指向被包含用例。
- **扩展 extend**：在**特定条件**下才执行扩展用例；箭头从扩展用例指向基用例。
- **泛化**：子用例继承父用例（如"网上支付"泛化为"微信支付""支付宝支付"）。
## 各种行为图的侧重点
- **顺序图**：强调消息的**时间顺序**（对象生命线、激活条）。
- **通信图**：强调对象之间的**链接关系**（结构组织）；顺序图与通信图语义等价、可互相转换。
- **状态图**：描述**单个对象**在生命周期内的状态及事件引起的转换。
- **活动图**：描述**业务流程或操作的控制流**，支持并发（分叉/汇合）与**泳道**。
- **定时图**：强调消息的实际时间约束。
## 实现与部署
- **构件图**：构件及其接口与依赖关系；**部署图**：运行时**硬件节点**及部署在其上的软件制品。
!! include 是"必须执行"，extend 是"有条件执行"；聚合空心菱形、组合实心菱形。`,

{id:'m6-12',g:'软件测试与维护',t:'测试方法：黑盒测试与白盒测试',f:'高',sub:'静态测试与动态测试、等价类划分、边界值分析、因果图与判定表、场景法、六种逻辑覆盖、McCabe环路复杂度',
core:`## 静态测试与动态测试
- **静态测试**：不运行程序，**桌前检查、代码走查、代码审查**（Code Review）、静态分析工具。
- **动态测试**：运行程序，分为黑盒测试与白盒测试。
## 黑盒测试（功能测试，不关心内部结构）
- **等价类划分**：把输入划分为**有效等价类**和**无效等价类**，每类选代表数据；设计用例时一个用例尽可能覆盖多个**有效**等价类，但每个用例只覆盖**一个无效**等价类。
- **边界值分析**：在边界及其两侧取值（如范围 1~100 取 0、1、2、99、100、101），常与等价类结合。
- **因果图与判定表**：处理多个输入条件组合与对应输出的逻辑关系。
- **场景法**：按业务流程的基本流与备选流设计用例。
- **错误推测法**：凭经验推测可能出错之处。
## 白盒测试（结构测试，依据程序内部逻辑）
- 逻辑覆盖（由弱到强）：
- **语句覆盖**：每条语句至少执行一次。
- **判定覆盖（分支覆盖）**：每个判定的真、假分支至少各执行一次。
- **条件覆盖**：每个判定中**每个条件**的真、假至少各取一次。
- **判定/条件覆盖**：同时满足判定覆盖和条件覆盖。
- **条件组合覆盖**：每个判定中各条件**所有可能的组合**至少出现一次。
- **路径覆盖**：覆盖程序中所有可能的执行路径。
- 注意：条件覆盖**不一定**满足判定覆盖；条件组合覆盖一定满足判定/条件覆盖，但不一定满足路径覆盖。
- **基本路径测试**：先计算 **McCabe 环路复杂度** V(G)，再找出 V(G) 条独立路径设计用例。
- V(G) = **边数 − 节点数 + 2** = **判定节点数 + 1** = **闭合区域数 + 1**。
- 其他白盒方法：循环覆盖、数据流测试。
!! 一个测试用例只覆盖一个无效等价类，否则无法定位错误原因。
!! 复合条件 A AND B 在计算 V(G) 时应拆成两个判定节点。`,

{id:'m6-13',g:'软件测试与维护',t:'测试阶段与测试类型',f:'高',sub:'测试原则、单元测试与桩/驱动、集成测试策略、确认测试与α/β测试、系统测试、回归测试、性能/安全/兼容性测试、测试左移与持续测试',
core:`## 测试原则
- 尽早并不断地测试（测试左移）；测试用例包括**输入和预期输出**；**二八原则/群集现象**（发现错误多的模块往往还有更多错误）；程序员应避免测试自己的程序；保留测试用例便于**回归**；测试只能证明有错，不能证明无错。
## 测试阶段
- **单元测试**：依据**详细设计说明书**，测试模块的接口、局部数据结构、重要执行路径、出错处理、边界条件；需要**驱动模块**（调用被测模块）和**桩模块**（被测模块调用的下层模块的替身）。
- **集成测试**：依据**概要设计说明书**，检查模块之间的接口。
- **自顶向下**：先测上层，需要**桩模块**，能尽早验证主控逻辑。
- **自底向上**：先测底层，需要**驱动模块**，底层模块测试充分。
- **三明治式**（混合）、**一次性集成（大爆炸）**。
- **确认测试**：依据**需求规格说明书**，验证功能与性能是否满足需求。
- **α 测试**：用户在**开发环境**下、开发人员在场的受控测试。
- **β 测试**：用户在**实际使用环境**下、开发人员不在场的测试。
- **验收测试**：以用户为主，决定是否接收系统。
- **系统测试**：在真实或模拟运行环境下，把软件与硬件、网络等结合，进行**功能、性能、负载、压力、安全、可靠性、兼容性、易用性、安装**等测试。
- **回归测试**：修改后重新执行部分或全部测试，确保没有引入新缺陷。
## 其他
- **冒烟测试**：新版本构建后快速验证主要功能是否可用。
- 持续测试：在 CI/CD 流水线中自动执行单元、接口、UI 测试；测试金字塔：单元测试最多、接口测试其次、UI 测试最少。
!! 自顶向下需要桩模块，自底向上需要驱动模块；α 测试在开发方场所，β 测试在用户场所。`,

{id:'m6-14',g:'软件测试与维护',t:'软件维护、可维护性与软件质量模型',f:'中',sub:'四种维护类型、维护工作量、可维护性因素、软件文档、ISO/IEC 9126与ISO/IEC 25010质量模型、软件质量保证',
core:`## 软件维护类型
- **改正性维护**：诊断和改正软件运行中发现的**错误**。
- **适应性维护**：使软件适应**运行环境变化**（操作系统、数据库升级，硬件更换，政策法规变化）。
- **完善性维护**：根据用户新需求**扩充功能、改进性能**，**占维护工作量的比例最大**（一般超过 50%）。
- **预防性维护**：为提高**可维护性和可靠性**而主动改进（重构、更新文档），为将来的修改做准备。
## 可维护性
- 影响因素：**可理解性、可测试性、可修改性**（以及可靠性、可移植性、可使用性、效率）。
- 提高方法：模块化、高内聚低耦合、规范的文档与注释、编码标准、自动化测试、配置管理。
- 软件文档：用户文档（用户手册、安装手册）与系统文档（需求、设计、测试文档）；文档要与代码保持一致。
## 软件质量模型
- **ISO/IEC 9126**：六个质量特性——**功能性、可靠性、易用性、效率、可维护性、可移植性**。
- 可维护性子特性：易分析性、易改变性、稳定性、易测试性；可移植性子特性：适应性、易安装性、共存性、易替换性。
- **ISO/IEC 25010**（替代 9126）：八个特性——**功能适合性、性能效率、兼容性、易用性、可靠性、信息安全性、维护性、可移植性**。
## 软件质量保证
- **SQA**：通过审计、评审，确保过程与产品符合标准；**评审**：正式技术评审 FTR、走查、审查。
!! 适应新操作系统是适应性维护；增加新功能是完善性维护；重构代码以便日后修改是预防性维护。`,

{id:'m6-15',g:'软件测试与维护',t:'遗留系统、逆向工程与系统迁移',f:'中',sub:'遗留系统评价与四种演化策略、逆向工程四个层次、重构/设计恢复/再工程、新旧系统转换方式、数据迁移、绞杀者模式',
core:`## 遗留系统评价与演化策略（技术含量 × 业务价值）
- **高业务价值、低技术含量 → 继承**（技术陈旧但业务关键，在新系统中继承其功能、数据）。
- **高业务价值、高技术含量 → 改造**（系统功能增强、数据模型改造）。
- **低业务价值、低技术含量 → 淘汰**（全面重新开发新系统替代）。
- **低业务价值、高技术含量 → 集成**（通过集成方式继续利用）。
## 逆向工程
- 分析程序，力图在比源代码**更高抽象层次**上建立程序的表示，**只分析不修改**原系统。
- 四个层次（抽象程度由低到高）：
- **实现级**：抽象语法树、符号表、过程的设计表示。
- **结构级**：程序构件之间的相互依赖，如**调用图、结构图**、程序和数据结构。
- **功能级**：程序段功能及构件关系，如**数据流和控制流模型**。
- **领域级**：程序构件与应用领域概念的对应，如**E-R 模型**。
- 相关概念：**设计恢复**（从代码中抽取设计信息）、**重构**（在同一抽象层次上改变系统表示，不改变外部行为）、**再工程**（逆向工程 + 考虑新需求 + **正向工程**，重新实现系统）。
## 新旧系统转换
- **直接转换**：新系统直接替换旧系统，**风险最大**、成本最低。
- **并行转换**：新旧系统同时运行一段时间，对比结果后停用旧系统，**最安全**、成本最高。
- **分段转换（逐步转换）**：分模块或分阶段替换，折中。
## 数据迁移与渐进式改造
- 数据迁移：数据清洗、模型映射、全量 + 增量迁移、对账校验、可回滚。
- **绞杀者模式（Strangler Fig）**：在旧系统前增加路由层，逐个功能用新服务替换，直到旧系统被完全"绞杀"。
!! 业务价值高、技术含量低的遗留系统应"继承"而不是淘汰。
!! 逆向工程不改变原系统；再工程才会重新实现。`,

{id:'m6-16',g:'软件设计',t:'基于构件的软件工程CBSE',f:'中',sub:'构件的特征与模型、构件标准、构件检索方法、构件组装方式、组装不兼容问题、构件化开发过程',
core:`## 构件
- **构件**：系统中可独立部署、可替换、通过**明确定义的接口**提供服务的软件单元。
- 特征：**可组装**（通过接口交互）、**可部署**（独立运行于构件平台）、**文档化**、**独立**（无需依赖其他特定构件即可组装部署）、**标准化**（符合某种构件模型）。
- 构件模型要素：接口、使用信息、部署与打包规范、命名与元数据、组装。
- 主要标准：**CORBA**（OMG）、**COM/DCOM/COM+**（微软）、**EJB/JavaBean**（Sun/Oracle）、OSGi、.NET 程序集。
## CBSE 过程
- 系统需求概览 → **识别候选构件** → 根据发现的构件修改需求 → 体系结构设计 → **构件定制与适配** → 组装构件创建系统。
- 与传统开发不同：需求需要根据可获得的构件调整，以复用为中心。
## 构件检索方法
- **关键字分类法**：按树形关键字层次分类检索。
- **刻面分类法**：从多个相互正交的"刻面"（如功能、对象、介质、系统类型）描述构件，检索更灵活。
- **超文本组织方法**：通过超链接浏览相关构件。
- 其他：属性值分类法。
## 构件组装
- **顺序组装**：按顺序调用已有构件，前一构件的输出作为后一构件的输入。
- **层次组装**：被调用构件的"提供"接口与调用构件的"请求"接口匹配。
- **叠加组装**：多个构件合并形成新构件，新构件整合原构件功能，对外提供新接口。
- 组装不兼容问题：**参数不兼容**（类型、个数不同）、**操作不兼容**（操作名不同）、**操作不完备**（一个构件的接口是另一个的子集）；通过编写**适配器**解决。
!! 构件的五个特征中没有"可继承"；组装方式是顺序、层次、叠加三种。`,

{id:'m7-1',g:'软件架构基础与复用',t:'软件架构的概念、组成与作用',f:'高',sub:'架构定义、构件/连接件/配置约束、架构的作用、架构设计在生命周期中的位置、架构设计原则、架构决策',
core:`## 软件架构的定义
- 软件架构为软件系统提供了一个**结构、行为和属性的高级抽象**，由**构件的描述、构件的相互作用（连接件）、指导构件集成的模式以及这些模式的约束**组成。
- ISO/IEC/IEEE 42010：系统在其环境中的**基本概念或属性**，体现在其**元素、关系**以及**设计与演化的原则**中。
- 架构不仅指定了系统的组织结构和拓扑结构，还显示了系统需求与构成系统元素之间的对应关系，提供了设计决策的基本原理。
## 组成要素
- **构件**：具有某种功能的可复用软件单元（模块、服务、进程、数据库）。
- **连接件**：表示构件之间的交互（过程调用、管道、消息、事件、RPC、共享数据）。
- **配置/约束**：构件与连接件的组织方式（拓扑）和必须遵守的规则。
## 架构的作用（重要性）
- 是项目**干系人之间沟通**的手段（共同语言）。
- 是系统**早期设计决策**的体现：决定了开发与部署组织结构、**质量属性**、对实现的约束，并有助于预测系统质量、推断与控制变更。
- 是**可传递、可复用**的模型（同一领域可复用）。
- 有助于**降低成本与风险**；为**增量开发**和原型提供基础；可作为培训的基础。
## 架构设计在生命周期中的位置
- 位于**需求分析之后、详细设计之前**，是从需求向实现过渡的桥梁；同时贯穿整个生命周期（需求阶段的架构视图、设计、实现、构件组装、部署、演化）。
## 架构设计原则与架构决策
- 原则：**关注点分离、抽象、封装与信息隐藏、模块化、高内聚低耦合、接口与实现分离、以质量属性驱动、为变化而设计、避免过度设计（KISS、YAGNI）**。
- 架构决策应被记录下来（**架构决策记录 ADR**：背景、决策、备选方案、理由、后果），便于追溯与演化。
!! 架构不是一成不变的，会随需求与环境演化；架构关注的是"系统级"结构，而不是算法细节。`,

{id:'m7-2',g:'软件架构基础与复用',t:'软件架构复用与特定领域软件架构DSSA',f:'高',sub:'机会复用与系统复用、可复用资产、复用过程、DSSA定义与特征、垂直域与水平域、四类角色、三个基本活动、建立过程、三层次系统模型',
core:`## 架构复用
- **机会复用**：开发过程中临时发现有可复用资产就使用；**系统复用**：开发前就有计划地确定哪些可复用，并建立可复用资产库。
- 可复用资产：**需求、架构设计、元素（构件）、建模与分析、测试、项目规划、过程方法工具、人员、样本系统、缺陷消除**。
- 复用基本过程：**构造/获取可复用资产 → 管理资产（存储、分类、检索）→ 使用可复用资产**。
## DSSA 特定领域软件架构
- 定义：在一个特定应用领域中为一组应用提供组织结构参考的标准软件架构。
- 必备特征：**严格定义的问题域/解决域、普遍性（可用于开发领域中的特定应用）、对整个领域的合适程度的抽象、具备该领域固定的典型的开发过程中可复用元素**。
- **垂直域**：同一领域内（如所有银行系统）的通用架构；**水平域**：跨多个领域的通用部分（如所有系统都需要的权限管理）。
## 四类角色
- **领域专家**：提供领域需求规约、实现、领域知识与经验（有经验的用户、开发人员）。
- **领域分析人员**：控制领域分析过程，获取知识并组织到**领域模型**中。
- **领域设计人员**：控制领域设计过程，根据领域模型和现有系统开发出 **DSSA**。
- **领域实现人员**：根据领域模型和 DSSA 开发**可复用构件**。
## 三个基本活动
- **领域分析**：获得**领域模型**（领域需求，共性与可变性）。
- **领域设计**：获得 **DSSA**（满足领域需求的参考架构）。
- **领域实现**：依据领域模型和 DSSA 开发和组织**可复用信息**（构件）。
## 建立过程（五个阶段，并发、递归、反复）
- **定义领域范围 → 定义领域特定的元素 → 定义领域特定的设计和实现需求约束 → 定义领域模型和架构 → 产生、搜集可复用的产品单元**。
## 三层次系统模型
- **领域开发环境**（领域架构师）→ **领域特定的应用开发环境**（应用工程师）→ **应用执行环境**（操作员）。
!! 领域分析的产物是领域模型，领域设计的产物是 DSSA，领域实现的产物是可复用构件。`,

{id:'m7-3',g:'软件架构基础与复用',t:'软件产品线',f:'中',sub:'产品线定义、核心资产库、双生命周期（领域工程与应用工程）、产品线建立方式（演化/革命）、组织结构、可变性管理',
core:`## 软件产品线
- 一个产品线是一个**产品集合**，这些产品**共享一个公共的、可管理的特性集**，满足选定的市场或任务领域的特定需求，并按预定方式从**公共的核心资产集**开发出来。
- 核心资产：产品线架构、可复用构件、需求、测试用例、文档、工具与过程等；**产品线架构**是最重要的核心资产。
## 双生命周期
- **领域工程**：开发核心资产（为复用而开发）。
- **应用工程**：使用核心资产开发具体产品（使用复用开发），并把新发现的共性反馈给领域工程。
## 产品线建立方式
- 根据是否有现有产品、采用**演化方式**（逐步）还是**革命方式**（一次性），组合为四种：
- **基于现有产品集 + 演化方式**：基于现有产品架构设计产品线架构，逐步把现有构件开发为产品线构件。
- **基于现有产品集 + 革命方式**：核心资产开发基于现有产品集的需求和可预测的未来需求的超集。
- **全新产品线 + 演化方式**：产品线核心资产随产品新成员的需求逐步演化。
- **全新产品线 + 革命方式**：开发满足所有预期产品线成员需要的核心资产。
## 组织结构
- 设计部门、业务部门、**领域工程部门**（专门负责核心资产）、层次组织结构等；组织结构要与"核心资产开发—产品开发"分工匹配。
## 可变性管理
- 识别**共性点与可变点**（变体），通过参数配置、插件、条件编译、特性模型（Feature Model）管理变化。
!! 产品线的本质是"有计划的系统复用"；领域工程为复用而开发，应用工程使用复用开发。`,

/* ---------- 架构风格 ---------- */
{id:'m7-4',g:'软件架构风格',t:'数据流风格与调用/返回风格',f:'高',sub:'架构风格定义、五大类风格、批处理序列、管道-过滤器、主程序/子程序、面向对象、层次结构、各风格优缺点',
core:`## 架构风格
- 架构风格反映领域中众多系统所共有的**结构和语义特性**，定义一个**词汇表（构件和连接件类型）和一组约束**，指导如何把构件和连接件组合起来。
- 经典分类（Garlan & Shaw）：**数据流风格、调用/返回风格、独立构件风格、虚拟机风格、仓库风格**（另有闭环控制等）。
## 数据流风格
- **批处理序列**：构件为一系列固定顺序的计算单元，每一步处理完**整批数据**后才交给下一步。
- **管道-过滤器**：每个构件（过滤器）有输入和输出，**增量地**读入数据、处理后输出；连接件为**管道**。典型：**传统编译器**（词法 → 语法 → 语义 → 代码生成）、Unix shell 管道、数据处理流水线。
- 优点：高内聚低耦合、支持复用、易维护扩展（新增过滤器）、支持并发；缺点：**交互性差**、不适合交互式应用，数据格式转换开销。
## 调用/返回风格
- **主程序/子程序**：单线程控制，把问题分解为若干步骤。
- **面向对象**：构件是对象，通过方法调用交互，封装与继承；缺点：对象需要知道被调用对象的标识。
- **层次结构**：系统组织成层次，**每层为上层服务，同时作为下层的客户**，通常只与相邻层交互。典型：**OSI 网络协议、操作系统、分层业务系统（表示层/业务层/数据层）**。
- 层次风格优点：支持基于抽象程度递增的设计、易于修改和扩展（每层只影响相邻层）、可复用（接口不变即可替换某层）；缺点：并非所有系统都容易分层、层次过多影响性能、很难找到合适的抽象层次。
!! 传统编译器属于数据流风格；现代以语法树为中心的集成开发环境中的编译器更接近仓库风格。`,
fig:[{k:'flow',t:'管道-过滤器风格：传统编译器（动态演示）',anim:true,items:['源程序','词法分析（过滤器）|输出单词流（Token）','语法分析（过滤器）|输出语法树','语义分析（过滤器）|输出带类型信息的中间表示','代码生成（过滤器）|输出目标代码'],caps:['输入数据流。','每个过滤器只关心自己的输入输出，不知道上下游是谁。','管道把上一个过滤器的输出传给下一个。','可以方便地插入新的过滤器（如代码优化）。','整个过程是单向数据流，交互性差，因此不适合交互式应用。']},

{id:'m7-5',g:'软件架构风格',t:'独立构件、虚拟机与仓库风格',f:'高',sub:'进程通信、事件驱动隐式调用、解释器、基于规则的系统、数据库系统、黑板系统、超文本系统、闭环控制风格',
core:`## 独立构件风格
- 构件是独立的过程，通过消息连接。
- **进程通信**：构件是独立进程，连接件是消息传递（点到点、异步/同步、RPC）。
- **事件驱动（隐式调用）**：构件**不直接调用**一个过程，而是**触发或广播事件**；其他构件在事件中**注册**，事件发生时系统自动调用已注册的过程。
- 优点：为软件复用提供强大支持、便于系统演化（增加新构件只需注册事件）；缺点：**构件放弃了对计算的控制**，不知道哪些构件会响应、处理顺序和结果如何，难以推理正确性。
- 典型：**GUI 事件处理、IDE 中工具集成（编辑器与调试器）、数据库触发器**、消息总线。
## 虚拟机风格
- **解释器**：包括**解释引擎、被解释的代码、解释器状态、程序当前状态**；优点是**灵活**、可动态修改、可移植；缺点是**执行效率较低**。典型：脚本语言、JVM、规则配置、自定义 DSL。
- **基于规则的系统**：包括**规则集、规则解释器、规则/数据选择器、工作内存**；典型：**专家系统**、业务规则引擎（Drools）。
## 仓库风格（以数据为中心）
- 两类构件：**中央数据结构**（说明当前状态）和**独立构件**（在中央数据存储上执行）。
- **数据库系统**：由数据库与独立处理单元组成，处理单元按输入事务驱动。
- **黑板系统**：由**知识源**（各自独立的专门知识）、**黑板**（存放问题求解状态数据）、**控制**（由黑板状态驱动知识源）三部分组成；适合**问题求解路径不确定**、需要多种知识协作的领域，如**语音识别、模式识别、信号处理**、军事指挥。
- **超文本系统**：如 Web 浏览器与超链接。
## 闭环控制（过程控制）风格
- 通过**反馈**不断比较实际值与设定值并调整输出，典型如空调温控、定速巡航、工业 PID 控制。
!! 专家系统属于"虚拟机—基于规则的系统"（也有教材归入仓库风格的黑板），考题若给出"知识库+推理机"选基于规则的系统；"多知识源+共享状态"选黑板。
!! 现代集成开发环境（以共享数据为中心）属于仓库风格。`,

{id:'m7-6',g:'软件架构风格',t:'层次架构：C/S、B/S与MVC家族',f:'高',sub:'两层C/S与三层C/S、B/S、C/S与B/S混合、分层架构设计要点、MVC、MVP、MVVM、前后端分离',
core:`## 两层与三层 C/S
- **两层 C/S**：客户端（表示 + 业务逻辑）与数据库服务器；问题：**客户端负担重（"胖客户端"）**、升级维护难、系统伸缩性与安全性差。
- **三层 C/S**：**表示层**（用户界面）、**功能层**（业务逻辑，应用服务器）、**数据层**（数据库服务器）。优点：层次清晰、**客户端变"瘦"**、业务逻辑集中便于维护和复用、可分别扩展、安全性更好（客户端不直接访问数据库）；缺点：层间通信效率降低、设计复杂。
## B/S 浏览器/服务器
- 三层 C/S 的变种，客户端是浏览器，**无需安装客户端软件**、部署与维护方便、跨平台。
- 传统缺点：交互性与响应速度不如 C/S、复杂 UI 实现难、安全依赖服务器（现代 SPA 已大大改善）。
- **C/S 与 B/S 混合**："内外有别"（企业内部用 C/S、外部用 B/S）或"查改有别"（查询用 B/S、维护用 C/S）。
## 分层架构设计要点
- 严格分层（只能调用下一层）与松散分层（可跨层调用）；层与层之间依赖接口；避免循环依赖；横切关注点（日志、安全、事务）可用 AOP 处理。
## MVC 家族
- **MVC**：**Model**（数据与业务逻辑）、**View**（界面显示）、**Controller**（接收输入、调用模型、选择视图）；View 可以直接从 Model 读取数据（观察者）。Java EE 中典型对应：JSP（V）、Servlet（C）、JavaBean/EJB（M）。
- **MVP**：**Presenter** 作为中介，**View 与 Model 完全不直接交互**，便于单元测试 Presenter。
- **MVVM**：**ViewModel** 与 View 之间**双向数据绑定**，View 变化自动同步到 ViewModel，反之亦然（Vue、WPF、Angular）。
- **前后端分离**：前端独立部署（SPA），后端提供 REST/GraphQL API。
!! 三层 C/S 的中间层是"功能层（业务逻辑层）"；MVVM 的关键是"双向数据绑定"；MVP 中 View 与 Model 不直接通信。`,

{id:'m7-7',g:'软件架构风格',t:'其他常用风格与异构架构',f:'中',sub:'微内核（插件）架构、事件驱动架构EDA、REST风格、面向服务风格、异构结构风格的原因与组合方式、风格选择',
core:`## 微内核（插件）架构
- 由**核心系统**（最小可运行功能）与**插件模块**组成，插件通过约定接口注册，可独立开发、动态加载。
- 优点：可扩展、灵活、易于定制；缺点：核心接口设计要求高，插件间依赖复杂时难以管理。典型：**Eclipse、VS Code、浏览器扩展**、规则引擎插件。
## 事件驱动架构 EDA
- 由**事件生产者、事件通道（消息中间件）、事件消费者**组成，系统通过事件进行异步、松耦合的交互。
- 两种拓扑：**中介者拓扑**（事件中介编排多个步骤）与**代理拓扑**（无中心编排，事件链式传递）。
- 优点：高度解耦、易扩展、可伸缩、响应快；缺点：流程难以追踪、一致性复杂（最终一致）、调试测试困难。
## REST 风格
- 以**资源**为中心，**统一接口**（GET/POST/PUT/DELETE）、**无状态**、可缓存、分层系统、客户端—服务器分离、按需代码（可选）。
## 面向服务风格（SOA）与微服务
- 以服务为基本单元、通过标准接口交互，详见分布式与微服务模块。
## 异构结构风格
- 原因：系统需求多样、不同子系统的质量要求不同、遗留系统集成、团队历史技术栈等，**单一风格难以满足**。
- 组合方式：**分层组合**（不同层使用不同风格）、**局部异构**（某构件内部采用另一种风格）、**位置异构**（不同部分采用不同风格）、**连接件异构**（同一系统中使用多种连接件）。
- 例：整体分层，业务层内部用事件驱动，数据处理部分用管道-过滤器，规则部分用解释器。
## 风格选择的依据
- 以**质量属性**为驱动：需要可扩展选插件/事件驱动；需要高吞吐批量处理选管道-过滤器；需要灵活规则选解释器/规则系统；需要清晰职责与可替换选分层。
!! 风格之间没有绝对优劣，异构组合是复杂系统的常态。`,

{id:'m7-8',g:'架构设计方法与描述',t:'基于架构的软件开发方法ABSD',f:'高',sub:'ABSD特点、三个基础、视角与视图、用例与质量场景、六个子过程、标识构件、架构文档化、架构复审、架构实现、架构演化',
core:`## ABSD 的特点
- ABSD（基于架构的软件设计）是**架构驱动**的方法：强调由**商业、质量和功能需求的组合**驱动架构设计。
- 采用**自顶向下、递归细化**的方式：设计元素逐步分解。
- 需求获取中使用**视角与视图**描述架构，用**用例**描述功能需求，用**质量场景**描述质量需求。
- 支持在需求尚未完全确定时就开始架构设计（架构设计可以早于需求全部完成）。
## 三个基础
- **功能的分解**：使用已有的基于模块的内聚与耦合技术。
- **通过选择架构风格来实现质量和商业需求**。
- **软件模板的使用**：利用一些软件系统的结构（如处理故障、通信的模板）。
## 六个子过程
- **架构需求**：需求获取 → **标识构件**（**生成类图 → 对类进行分组 → 把类打包成构件**）→ 需求评审。
- **架构设计**：提出软件架构模型 → 把已标识的构件映射到架构中 → 分析构件之间的相互作用 → 产生软件架构 → 设计评审。
- **架构文档化**：主要输出**架构规格说明书**和**测试架构需求的质量设计说明书**；从使用者角度编写，及时更新、保持版本一致。
- **架构复审**：邀请外部人员（用户代表、领域专家）参与，**标识潜在风险**，及早发现架构设计中的缺陷和错误。
- **架构实现**：分析与设计 → 构件实现 → **构件组装** → 系统测试。
- **架构演化**：需求变化归类 → 制订架构演化计划 → 修改、增加或删除构件 → 更新构件的相互作用 → 构件组装与测试 → 技术评审 → 产生演化后的架构。
!! ABSD 是"架构驱动"，RUP 是"用例驱动"；复审在文档化之后、实现之前。`,
fig:[{k:'flow',t:'ABSD 的六个子过程（动态演示）',anim:true,loop:true,items:['架构需求|需求获取、标识构件、需求评审','架构设计|提出模型、映射构件、分析交互、设计评审','架构文档化|架构规格说明书、质量设计说明书','架构复审|外部人员参与，标识潜在风险','架构实现|构件实现、组装与系统测试','架构演化|应对需求变化，产生新版本架构'],caps:['用用例描述功能需求、用质量场景描述质量需求；通过"类图→分组→打包"标识构件。','选择风格、映射构件、分析交互，形成架构模型。','形成供开发、测试、运维使用的文档。','让外部专家与用户代表参与，在实现前发现风险——越早发现修复成本越低。','分析设计构件、实现并组装、系统测试。','需求变化时有计划地修改构件与交互，经评审后产生新版本架构，再进入下一轮。']},

{id:'m7-9',g:'架构设计方法与描述',t:'架构视图、4+1模型与架构描述语言ADL',f:'高',sub:'4+1视图模型、各视图关注点与使用者、ISO/IEC/IEEE 42010概念模型、视点与视图、ADL三要素、常见ADL特点',
core:`## Kruchten 4+1 视图模型
- **逻辑视图**：描述系统的**功能需求**（系统应为用户提供哪些服务），面向**最终用户**；常用类图、对象图。
- **开发视图（实现视图）**：描述软件在开发环境中的**静态组织**（模块、子系统、库），面向**程序员**，关注复用、开发管理与工具约束；常用构件图、包图。
- **进程视图**：描述系统的**并发与同步**，关注**性能、可用性、容错、分布**等**非功能需求**，面向**系统集成人员**；常用活动图、顺序图。
- **物理视图（部署视图）**：描述**软件到硬件的映射**、网络拓扑、安装与通信，面向**系统工程人员**；常用部署图。
- **场景视图（用例视图，即"+1"）**：用一组重要用例把其他四个视图联系起来，用于**发现架构元素**和**验证架构设计**。
## ISO/IEC/IEEE 42010 概念模型
- **利益相关者（干系人）**有若干**关注点** → **视点**（viewpoint）规定构建与使用某类视图的约定（语言、建模方法、分析技术）→ **视图**（view）是从某视点对系统的表示，由若干**模型**组成 → 一组视图构成**架构描述**。
- 架构描述还应包含架构决策及其理由、对应关系（视图之间的一致性）。
## 架构描述语言 ADL
- 核心三要素：**构件、连接件、架构配置**（也有加上构件接口的说法）。
- 特点：支持架构的形式化描述、分析与验证，可支持代码生成与仿真。
- 常见 ADL：
- **ACME**：架构**交换语言**，作为不同 ADL 之间的公共中间格式。
- **Wright**：重点描述**连接件的交互协议**，基于 CSP 形式化，可检查死锁。
- **C2**：支持基于**消息传递**的层次化风格，适合 GUI 类应用。
- **Rapide**：基于**事件**，支持架构**仿真**。
- **UniCon、Aesop**（支持风格）、**MetaH**（嵌入式实时航空电子）、**Darwin**（分布式动态结构）、xADL（基于 XML，可扩展）。

{id:'m7-10',g:'架构设计方法与描述',t:'软件架构演化与维护',f:'中',sub:'演化的必要性、静态演化与动态演化、演化方式（对象/构件/架构演化）、演化原则、动态演化技术、架构维护与腐化',
core:`## 演化的原因
- 需求变化、技术更新、运行环境变化、规模增长、缺陷修复与质量改进等，使架构必须随之演化，否则会出现**架构腐化**（实现偏离设计、依赖混乱）。
## 静态演化与动态演化
- **静态演化**：在系统**停止运行**期间修改、更新，再重新部署；包括设计时演化（修改架构设计、代码）和装载期演化。
- **动态演化**：在系统**运行期间**修改架构，不中断服务，适用于 7×24 的关键系统。
- 动态演化的类型：**属性改名、行为变化（功能修改）、拓扑结构改变（增删构件或连接件）、风格改变**。
- 实现技术：**动态软件体系结构**（Darwin、C2 支持）、**反射**（运行时自省与修改）、热插拔（OSGi）、蓝绿/灰度发布、配置中心动态刷新。
## 演化的层次
- **对象演化**：类与对象层面的修改（继承、重写）。
- **构件演化**：构件接口或实现的修改、替换、增加。
- **架构演化**：构件与连接件拓扑、风格层面的修改。
## 演化过程
- 需求变化归类 → 制订演化计划 → 修改、增加或删除构件 → 更新构件相互作用 → 构件组装与测试 → 技术评审 → 产生演化后的架构（与 ABSD 演化子过程一致）。
## 演化原则（部分）
- **成本控制**（演化成本不超过重新开发）、**进度可控**、**风险可控**、**主体维持**（核心结构稳定）、**系统总体结构优化**、**平滑演化**（版本之间平滑过渡）、**目标一致**、**模块独立演化**、**影响可控**、**复杂性可控**、**有利于重构与重用**、**适应新技术**、**环境适应性**、**标准依从**、**质量向好**、**适应新需求**。
## 架构维护
- 架构知识管理（文档、ADR）、修改管理（变更评估）、版本管理；通过**适应度函数**（自动化架构约束检查）防止腐化。
!! 系统运行时进行的修改是动态演化；停机修改部署是静态演化。`,

/* ---------- 分布式基础理论 ---------- */
{id:'m8-1',g:'分布式基础理论',t:'分布式系统特征、CAP定理与BASE理论',f:'高',sub:'分布式系统特点与透明性、CAP三要素、CP与AP选择、BASE三要素、ACID与BASE对比、典型系统归类',
core:`## 分布式系统
- 多台计算机通过网络协作，对用户表现为**一个整体**。特征：**分布性、对等性、并发性、缺乏全局时钟、故障总会发生**（节点宕机、网络分区、消息丢失）。
- 透明性：访问透明、位置透明、迁移透明、复制透明、并发透明、故障透明。
## CAP 定理
- **一致性 C（Consistency）**：所有节点在同一时刻看到相同的数据（指多副本的**线性一致性**）。
- **可用性 A（Availability）**：每个请求都能在合理时间内得到**非错误**的响应。
- **分区容错性 P（Partition tolerance）**：网络分区（节点间通信中断）时系统仍能继续运行。
- 分布式系统**最多同时满足两项**；由于网络分区不可避免，**P 必须保证**，实际是在 **CP 与 AP** 之间权衡（只在分区发生时才需取舍）。
- **CP**：分区时拒绝或阻塞部分请求以保证一致，如 **ZooKeeper、etcd、HBase、Consul**、银行账务。
- **AP**：分区时继续服务、允许暂时不一致，如 **Eureka、Cassandra、DNS、CouchDB**、商品浏览、社交动态。
- **CA**：只在不考虑分区的单机或单数据中心场景（传统单机 RDBMS）。
## BASE 理论
- **基本可用（Basically Available）**：故障时允许损失部分可用性（响应变慢、功能降级）。
- **软状态（Soft state）**：允许系统存在中间状态，副本同步存在延迟。
- **最终一致性（Eventually consistent）**：经过一段时间后所有副本最终达到一致。
- BASE 是对 AP 方案的实践总结，与 ACID 的强一致相对。
!! CAP 中的 C 与 ACID 中的 C 含义不同：前者是多副本数据一致，后者是事务前后满足完整性约束。`,

{id:'m8-2',g:'分布式基础理论',t:'一致性模型与共识算法：Paxos、Raft、ZAB',f:'中',sub:'强一致/顺序一致/因果一致/最终一致、读己之写与会话一致、Paxos角色与两阶段、Raft领导者选举与日志复制、ZAB、拜占庭容错',
core:`## 一致性模型（由强到弱）
- **强一致性（线性一致性）**：写入后任何读都能读到最新值，如同只有一个副本。
- **顺序一致性**：所有进程看到的操作顺序一致，但不要求与真实时间一致。
- **因果一致性**：有因果关系的操作被所有进程以相同顺序看到。
- **最终一致性**：不再有新写入时，副本最终会一致；变种有**读己之写**（自己写的自己马上能读到）、**会话一致性**、**单调读**、**单调写**。
## Paxos
- 角色：**提议者 Proposer、接受者 Acceptor、学习者 Learner**。
- 两阶段：**Prepare/Promise**（提议者提出编号 n，接受者承诺不再接受更小编号）→ **Accept/Accepted**（获得多数派承诺后提交值，多数派接受即达成共识）。
- 理论严谨但难以理解和实现；Multi-Paxos 选出稳定 Leader 以提高效率。
## Raft
- 把共识问题分解为：**领导者选举、日志复制、安全性**，比 Paxos 易于理解。
- 角色：**Follower、Candidate、Leader**；时间划分为**任期（Term）**。
- **领导者选举**：Follower 在**随机选举超时**内未收到 Leader 心跳，变为 Candidate、任期加 1、为自己投票并请求投票；获得**多数票**成为 Leader。
- **日志复制**：客户端请求只发给 Leader → Leader 追加日志并通过 AppendEntries 复制给 Follower → **多数节点**写入后提交（commit）并应用到状态机 → 通知 Follower 提交。
- 容错：2f + 1 个节点可容忍 f 个节点宕机（崩溃故障，非恶意）。应用：etcd、Consul、TiKV。
## ZAB
- ZooKeeper 原子广播协议：崩溃恢复（选主）与消息广播（类似两阶段提交、多数派确认）。
## 拜占庭容错
- 节点可能**恶意作恶**；PBFT 需要 **n ≥ 3f + 1** 个节点容忍 f 个拜占庭节点，多用于区块链联盟链。Paxos/Raft 只能容忍**崩溃故障**。
!! Raft/Paxos 依赖"多数派"；5 个节点的 Raft 集群最多容忍 2 个节点故障。`,

{id:'m8-3',g:'分布式基础理论',t:'分布式事务：2PC、3PC、TCC、Saga与可靠消息',f:'高',sub:'XA与两阶段提交、2PC问题、三阶段提交、TCC三个阶段与注意事项、Saga补偿与编排/协同、本地消息表与事务消息、最大努力通知、方案选择',
core:`## 两阶段提交 2PC（强一致，XA 规范）
- 角色：**协调者（事务管理器 TM）**与**参与者（资源管理器 RM）**。
- **准备阶段**：协调者询问各参与者能否提交；参与者执行事务（写 undo/redo 日志、锁定资源），回复 Yes/No。
- **提交阶段**：全部 Yes → 发送 Commit；任一 No 或超时 → 发送 Rollback。
- 问题：**同步阻塞**（资源锁定直到第二阶段完成）、**协调者单点故障**（协调者宕机参与者一直阻塞）、**数据不一致**（部分参与者未收到 Commit）、性能差。
## 三阶段提交 3PC
- **CanCommit → PreCommit → DoCommit**，引入**超时机制**（参与者超时后默认提交），减少阻塞；但网络分区时仍可能不一致。
## TCC（Try-Confirm-Cancel，柔性事务）
- **Try**：检查业务并**预留资源**（如冻结库存、冻结金额）。
- **Confirm**：确认执行，使用预留资源。
- **Cancel**：取消执行，释放预留资源。
- 要求：各操作**幂等**；处理**空回滚**（Try 未执行就收到 Cancel）与**防悬挂**（Cancel 先于 Try 到达后不再执行 Try）。对业务侵入大，但性能好、一致性强。
## Saga（长事务）
- 把长事务拆为一系列本地事务 T1…Tn，每个都有对应的**补偿事务** C1…Cn；失败时**逆序执行补偿**。
- 两种协调方式：**编排（Orchestration）**——由中央协调器驱动；**协同（Choreography）**——各服务通过事件驱动、无中心。
- 不保证隔离性，可能出现中间状态被读取；适合流程长、跨多个服务的业务。
## 基于消息的最终一致性
- **本地消息表**：业务数据与消息记录在**同一个本地事务**中写入，后台任务异步投递消息，消费方**幂等**处理，失败重试并定期对账。
- **事务消息**（RocketMQ）：先发**半消息**，本地事务成功后提交消息，失败则回滚；MQ 通过**事务回查**确认状态。
- **最大努力通知**：多次重试通知，提供查询接口供对方核对（如支付结果通知）。
## 方案选择
- 强一致、短事务、数据库同构 → 2PC/XA；高并发核心资金链路 → TCC；长流程 → Saga；非核心异步链路 → 可靠消息。
!! 2PC 的致命问题是同步阻塞与协调者单点；TCC 的 Try 是"预留"而不是直接扣减。`,

{id:'m8-4',g:'分布式基础理论',t:'分布式通信、负载均衡与一致性哈希',f:'中',sub:'RPC原理与框架、REST、消息队列、同步与异步、负载均衡算法、四层与七层负载均衡、一致性哈希与虚拟节点',
core:`## 分布式通信
- **RPC 远程过程调用**：像调用本地函数一样调用远程服务。过程：客户端存根（Stub）**序列化**参数 → 网络传输 → 服务端存根**反序列化**并调用 → 返回结果。框架：**gRPC**（HTTP/2 + Protobuf）、Dubbo、Thrift。
- **REST/HTTP**：基于资源与 HTTP 方法，通用、易调试，性能略低于二进制 RPC。
- **消息队列**：异步通信，实现**时间与空间解耦**、流量削峰。
- 同步调用简单但耦合高、易级联故障；异步调用解耦但流程复杂。
## 负载均衡算法
- **轮询**、**加权轮询**（按服务器能力分配）、**随机**、**最少连接**（分给当前连接数最少的节点）、**源地址哈希**（同一客户端固定到同一节点，会话保持）、**一致性哈希**、最短响应时间。
## 四层与七层负载均衡
- **四层**（传输层）：根据 IP + 端口转发，性能高，如 **LVS**、F5 四层模式。
- **七层**（应用层）：根据 URL、Header、Cookie 等内容转发，功能丰富（路由、灰度、TLS 卸载），如 **Nginx**、HAProxy、API 网关。
- 部署：DNS 负载均衡 → 四层 → 七层 → 服务实例，多级组合。
## 一致性哈希
- 普通取模哈希 hash(key) mod N：节点数变化时**几乎所有数据**都要重新分布。
- 一致性哈希：把节点和数据都映射到 0 ~ 2³²−1 的**哈希环**上，数据顺时针找到第一个节点；增删节点时**只影响相邻区间**的数据。
- **虚拟节点**：每个物理节点映射多个虚拟节点，解决数据**倾斜**问题，使负载更均衡。
- 应用：分布式缓存（Redis Cluster 用哈希槽，原理相近）、分库分表、负载均衡。
!! 需要会话保持选源地址哈希；节点频繁扩缩容选一致性哈希。`,

{id:'m8-5',g:'分布式基础理论',t:'分布式缓存、分布式锁与分布式ID',f:'中',sub:'缓存读写模式、缓存穿透击穿雪崩、缓存一致性、Redis分布式锁、ZooKeeper分布式锁、数据库锁、UUID、号段、雪花算法',
core:`## 分布式缓存
- 读写模式：**Cache-Aside（旁路缓存，最常用）**——读：先读缓存，未命中读库后回填；写：**先更新数据库，再删除缓存**。**Read/Write-Through**——由缓存层同步读写数据库。**Write-Behind**——先写缓存，异步批量写库，性能高但可能丢数据。
- **缓存穿透**：查询**不存在**的数据，请求直达数据库。对策：**缓存空值、布隆过滤器**、参数校验。
- **缓存击穿**：某个**热点 key 失效**瞬间大量请求打到数据库。对策：**互斥锁重建**、热点数据永不过期（逻辑过期）。
- **缓存雪崩**：**大量 key 同时失效**或缓存服务宕机。对策：**过期时间加随机值**、多级缓存、缓存高可用（集群、哨兵）、限流降级。
- 一致性：延迟双删、订阅 binlog 异步删除、设置合理过期时间作兜底。
## 分布式锁
- 要求：**互斥、防死锁（超时释放）、可重入、高可用、释放者必须是持有者**。
- **Redis**：SET key value **NX PX** 过期时间；释放时用 Lua 脚本**校验 value 再删除**；Redisson 提供看门狗自动续期；Redlock 在多个独立节点上加锁。性能高，但主从切换时可能锁丢失（AP 倾向）。
- **ZooKeeper**：创建**临时顺序节点**，序号最小者获得锁，其他节点 **Watch 前一个节点**；会话断开临时节点自动删除，天然防死锁，可靠性高（CP），性能略低。
- **数据库**：唯一索引插入或 SELECT … FOR UPDATE，简单但性能差。
## 分布式 ID
- **UUID**：本地生成、无中心，但**无序、过长**，作为数据库主键会导致索引分裂。
- **数据库自增/号段模式**：从数据库批量获取一段 ID 缓存在本地（如美团 Leaf-segment），趋势递增。
- **雪花算法 Snowflake**：64 位 = 1 位符号 + **41 位时间戳**（毫秒，约 69 年）+ **10 位机器 ID** + **12 位序列号**（每毫秒 4096 个），**趋势递增**、高性能；需注意**时钟回拨**问题。
- Redis INCR：依赖 Redis 可用性。
!! "先更新数据库再删除缓存"比"先删缓存再更新数据库"出现不一致的概率更低。
!! Redis 锁释放前必须校验 value，否则可能误删别人的锁。`,

{id:'m8-6',g:'微服务架构',t:'微服务架构特征与服务拆分',f:'高',sub:'微服务定义与特征、优缺点、与单体对比、服务拆分原则、DDD限界上下文与聚合、拆分方法、绞杀者模式、康威定律',
core:`## 微服务
- 将单体应用拆分为一组**小型、自治、围绕业务能力**构建的服务；每个服务**独立开发、独立部署、独立运行、拥有私有数据**，通过轻量级机制（HTTP/REST、gRPC、消息）通信。
- 特征：**服务组件化、按业务能力组织团队、产品而非项目、智能端点与哑管道、去中心化治理、去中心化数据管理、基础设施自动化、容错设计、演进式设计**。
## 优缺点
- 优点：**独立部署与扩展**、技术异构、故障隔离、团队自治、易于理解单个服务、支持持续交付。
- 缺点：**分布式系统复杂性**（网络延迟、故障）、**数据一致性**、服务间调用链长、测试与运维复杂、需要完善的基础设施（治理、监控、CI/CD）。
## 服务拆分原则
- **单一职责**、高内聚低耦合、**按业务能力或 DDD 限界上下文拆分**、**数据库私有**（不共享表）、粒度适中（避免"分布式单体"或过细拆分）、考虑团队结构、优先拆分变化频繁或性能瓶颈的部分。
## 领域驱动设计 DDD
- **战略设计**：**领域与子领域**（核心域、支撑域、通用域）、**限界上下文**（模型的语义边界，常对应一个微服务）、上下文映射（共享内核、客户/供应方、防腐层 ACL 等）、**通用语言**。
- **战术设计**：**实体**（有唯一标识）、**值对象**（无标识、不可变）、**聚合与聚合根**（一致性边界，外部只能通过聚合根访问）、**领域服务**、**领域事件**、仓储、工厂。
## 迁移与组织
- **绞杀者模式**：在单体前加路由/网关，逐个把功能迁移到新服务，直到单体被替代。
- **康威定律**：系统架构反映组织的沟通结构，微服务需要跨职能的小团队（"两个披萨团队"）。
!! 微服务拆分依据业务边界而不是技术分层；多个服务共享同一数据库会形成紧耦合的"分布式单体"。`,

{id:'m8-7',g:'微服务架构',t:'服务治理：注册发现、API网关与配置中心',f:'高',sub:'服务注册与发现、客户端发现与服务端发现、健康检查、API网关职责、BFF、配置中心、服务鉴权',
core:`## 服务注册与发现
- 服务实例启动时向**注册中心**注册（地址、端口、元数据），定期发送**心跳**；下线或心跳超时被摘除。
- **客户端发现**：调用方从注册中心拉取服务列表，在本地做负载均衡（如 Eureka + Ribbon/LoadBalancer）。
- **服务端发现**：调用方请求负载均衡器（或 K8s Service），由其查询注册中心并转发。
- 常见注册中心：**Eureka（AP）**、**ZooKeeper/etcd/Consul（CP）**、**Nacos（AP/CP 可切换）**、Kubernetes Service + DNS。
## API 网关
- 微服务的**统一入口**，承担横切关注点：**请求路由、协议转换、认证鉴权、限流熔断、灰度发布、日志监控、请求聚合、跨域处理**。
- 产品：Spring Cloud Gateway、Kong、APISIX、Nginx/OpenResty。
- **BFF（Backend for Frontend）**：为不同前端（App、Web、小程序）提供专门的聚合层，避免通用网关过于臃肿。
- 风险：网关成为单点与瓶颈，需集群部署、无状态化。
## 配置中心
- 集中管理各环境配置，支持**动态刷新、版本管理、灰度发布、权限审计**（Nacos、Apollo、Spring Cloud Config）。
## 服务安全
- 外部：网关统一认证（OAuth2/JWT），内部：服务间 mTLS、服务级授权；敏感配置加密。
!! Eureka 是 AP，ZooKeeper 是 CP；网关处理的是"横切关注点"，业务逻辑不应放在网关中。`,

{id:'m8-8',g:'微服务架构',t:'服务容错：熔断、限流、降级、隔离与超时重试',f:'高',sub:'服务雪崩、超时与重试、熔断器三种状态、限流算法（固定窗口/滑动窗口/漏桶/令牌桶）、服务降级、舱壁隔离、链路追踪与可观测性',
core:`## 服务雪崩
- 某个下游服务故障或变慢，调用方线程被大量阻塞，资源耗尽后自己也不可用，故障沿调用链**级联扩散**。
## 容错手段
- **超时**：为每次远程调用设置合理超时，避免无限等待。
- **重试**：对幂等操作有限次数重试，配合**指数退避**；非幂等操作不能盲目重试。
- **熔断（Circuit Breaker）**：
- **关闭（Closed）**：正常调用，统计失败率。
- **打开（Open）**：失败率或慢调用比例超过阈值后熔断，请求**直接快速失败**（返回降级结果），不再调用下游。
- **半开（Half-Open）**：熔断一段时间后放行少量试探请求，成功则恢复关闭，失败则重新打开。
- 产品：Sentinel、Hystrix（已停止维护）、Resilience4j。
- **限流**：控制单位时间内的请求量，保护系统不被突发流量压垮。
- **固定窗口计数**：实现简单，窗口边界处可能出现两倍突发。
- **滑动窗口**：把窗口细分为多个小格，平滑统计。
- **漏桶**：请求进入桶中，以**恒定速率**流出处理，平滑流量，**不允许突发**。
- **令牌桶**：以恒定速率放入令牌，请求拿到令牌才处理，桶内积累的令牌**允许一定突发**（Guava RateLimiter）。
- **降级**：在资源紧张或依赖故障时**关闭非核心功能**或返回兜底数据，保证核心链路可用（如大促时关闭评论、推荐）。
- **隔离（舱壁 Bulkhead）**：为不同依赖分配独立的**线程池**或信号量，一个依赖故障不会耗尽全部资源。
## 可观测性
- **日志（Logging）、指标（Metrics）、链路追踪（Tracing）**三大支柱；链路追踪通过 **TraceId/SpanId** 串联一次请求经过的所有服务（SkyWalking、Zipkin、Jaeger、OpenTelemetry）。
!! 熔断解决"下游故障引起的雪崩"，限流解决"突发流量"，降级解决"资源不足时保核心"，隔离解决"一个依赖拖垮全部资源"。`,

cs:{bg:'某外卖平台下单服务依赖用户、商家、优惠券、支付、风控等6个下游服务。某晚优惠券服务数据库慢查询导致响应时间从50ms升至5s，下单服务线程池被占满，整个下单功能不可用。',
 qs:[['分析故障扩散的原因。','下单服务同步调用优惠券服务且超时设置过长，线程被长时间阻塞；所有下游共用一个线程池，一个依赖变慢耗尽全部线程；没有熔断与降级，故障沿调用链扩散形成雪崩。'],
  ['给出容错改进方案。','为每个下游设置合理超时（如200ms）；对优惠券等依赖配置熔断规则（慢调用比例/失败率）；舱壁隔离为不同依赖分配独立线程池；优惠券不可用时降级为"不使用优惠券下单"；入口按QPS限流（令牌桶）；幂等接口有限重试。'],

{id:'m8-9',g:'云原生与容器',t:'容器技术与Kubernetes',f:'中',sub:'容器原理Namespace与Cgroups、容器与虚拟机对比、Docker镜像/容器/仓库、K8s架构组件、Pod/Deployment/Service/Ingress、HPA与探针',
core:`## 容器原理
- 基于 Linux **Namespace**（隔离进程、网络、文件系统、主机名、用户等视图）与 **Cgroups**（限制 CPU、内存、I/O 等资源配额），容器**共享宿主机内核**。
- 容器 vs 虚拟机：容器是**操作系统级虚拟化**，秒级启动、资源占用少、部署密度高；虚拟机通过 **Hypervisor** 虚拟硬件，每个 VM 运行独立 Guest OS，**隔离性更强**、启动慢、开销大。
## Docker
- **镜像**（分层、只读，基于 Dockerfile 构建）、**容器**（镜像之上增加可写层的运行实例）、**仓库**（Registry，如 Harbor）。
- 价值：**环境一致**（"一次构建，到处运行"）、快速交付、不可变基础设施。
## Kubernetes 架构
- **控制平面**：**kube-apiserver**（统一入口）、**etcd**（集群状态存储）、**kube-scheduler**（为 Pod 选择节点）、**controller-manager**（副本、节点等控制器，使实际状态趋向期望状态）。
- **工作节点**：**kubelet**（管理本节点 Pod）、**kube-proxy**（Service 网络转发）、容器运行时（containerd）。
## 核心对象
- **Pod**：**最小调度单元**，包含一个或多个共享网络与存储的容器。
- **Deployment**：管理无状态应用的副本与滚动升级；**StatefulSet**：有状态应用（稳定网络标识与存储）；**DaemonSet**：每个节点运行一个（日志、监控代理）；Job/CronJob。
- **Service**：为一组 Pod 提供稳定访问地址与负载均衡；**Ingress**：七层 HTTP 入口路由。
- ConfigMap / Secret：配置与敏感信息；PV/PVC：持久存储。
- **HPA**：根据 CPU、内存或自定义指标**水平自动扩缩容**。
- 探针：**存活探针 liveness**（失败则重启容器）、**就绪探针 readiness**（失败则不接收流量）、启动探针。
- 声明式 API：用户声明期望状态，控制器持续调谐。
!! K8s 最小调度单元是 Pod 而不是容器；就绪探针失败只是摘流量，存活探针失败才重启。`,

{id:'m8-10',g:'云原生与容器',t:'服务网格、Serverless与DevOps发布策略',f:'中',sub:'云原生定义与代表技术、服务网格Sidecar与控制平面、Serverless与FaaS、DevOps与CI/CD、蓝绿发布、金丝雀发布、滚动发布、A/B测试',
core:`## 云原生
- CNCF 定义的代表技术：**容器、服务网格、微服务、不可变基础设施、声明式 API**。
- 云原生架构原则：服务化、弹性、可观测、韧性、所有过程自动化、零信任、架构持续演进。
## 服务网格（Service Mesh）
- 把服务间通信的治理能力（流量路由、负载均衡、熔断重试、mTLS 加密、可观测性）从业务代码中剥离，下沉到基础设施层。
- **数据平面**：每个服务实例旁部署 **Sidecar 代理**（如 Envoy），接管进出流量；**控制平面**（如 Istiod）下发路由与安全策略。
- 优点：对业务**无侵入**、多语言统一治理；缺点：增加时延与资源开销、运维复杂。
## Serverless
- **FaaS（函数即服务）+ BaaS（后端即服务）**；事件触发、**按实际调用计费**、平台**自动伸缩（可缩容到 0）**，开发者无需管理服务器。
- 缺点：**冷启动**延迟、执行时长限制、厂商锁定、调试困难；适合事件驱动、突发、低频任务（图片处理、定时任务、Webhook）。
## DevOps 与 CI/CD
- DevOps：开发与运维协同的文化与实践，强调自动化、持续反馈。
- **持续集成 CI**：频繁合并代码，自动构建与测试；**持续交付 CD**：随时可发布到生产（发布需人工确认）；**持续部署**：自动发布到生产。
- **基础设施即代码 IaC**（Terraform、Ansible）。
## 发布策略
- **蓝绿发布**：准备两套完整环境（蓝为当前、绿为新版本），**一次性切换流量**，回滚快，资源成本高。
- **金丝雀（灰度）发布**：先让**小比例用户**使用新版本，观察指标正常后**逐步放量**，风险可控。
- **滚动发布**：分批替换旧实例，资源占用少，回滚较慢。
- **A/B 测试**：按用户特征分流比较不同版本的业务效果（侧重产品决策）。
!! 金丝雀"按比例逐步放量"，蓝绿"两套环境一次切换"；服务网格的核心是 Sidecar。`,

{id:'m8-11',g:'SOA与系统互操作',t:'SOA与Web Service',f:'中',sub:'SOA定义与服务特征、三种角色与操作、Web Service协议栈、SOAP/WSDL/UDDI、BPEL服务编排、SOA设计原则、SOA与微服务对比',
core:`## SOA 面向服务的架构
- 一种**粗粒度、松耦合**的架构，以**服务**为基本单元组织业务功能，服务之间通过**标准化接口**交互，与实现语言、平台无关。
- 服务特征：**松耦合、粗粒度、标准化接口、位置透明、可组合、可复用、无状态、自治、可发现**。
## 三种角色与三种操作
- 角色：**服务提供者**、**服务请求者（消费者）**、**服务注册中心**。
- 操作：**发布**（提供者把服务描述注册到注册中心）、**查找**（请求者在注册中心查找服务）、**绑定与调用**（请求者按服务描述调用提供者）。
## Web Service 协议栈
- **SOAP**：基于 XML 的消息封装与传输协议（信封 Envelope、头 Header、体 Body），可运行在 HTTP、SMTP 上。
- **WSDL**：用 XML 描述服务**接口、操作、消息格式、绑定协议与访问地址**——"服务是什么、在哪里、怎么调"。
- **UDDI**：统一描述、发现和集成，服务的**注册与发现**。
- **BPEL**（WS-BPEL）：业务流程执行语言，把多个 Web Service **编排**成可执行的业务流程。
- WS-Security、WS-Transaction、WS-ReliableMessaging 等扩展规范。
## SOA 与微服务
- SOA 面向**企业级集成与复用**，服务粒度较粗，常依赖 **ESB 集中集成**（智能管道），可共享数据库；
- 微服务面向**业务能力的独立交付**，粒度较细，**去中心化治理**、"智能端点、哑管道"，每服务私有数据。
!! WSDL 描述服务，UDDI 注册发现，SOAP 传输消息，BPEL 编排流程。`,

{id:'m8-12',g:'SOA与系统互操作',t:'ESB、REST与异构系统互操作',f:'中',sub:'ESB功能与特点、ESB与点对点对比、REST六大约束与成熟度、SOAP与REST对比、API设计、异构数据库与异构系统集成方法',
core:`## ESB 企业服务总线
- 位于服务提供者与请求者之间的中介层，提供：**协议转换**（SOAP/REST/JMS/FTP）、**消息路由**（基于内容的路由）、**数据格式转换**（XML/JSON 映射）、**服务编排**、**服务注册与目录**、**安全**、**监控与审计**。
- 通过**适配器**接入异构系统，屏蔽语言、平台与协议差异；接口数量从点对点的 n(n−1)/2 降为 n。
- 风险：ESB 自身成为中心瓶颈与单点，过度集中治理降低灵活性。
## REST
- 以**资源**为中心，用 **URI** 标识资源，通过 **HTTP 统一接口**操作：**GET 查询（安全、幂等）、POST 新增、PUT 整体更新（幂等）、PATCH 部分更新、DELETE 删除（幂等）**。
- 六大约束：**客户端—服务器、无状态、可缓存、统一接口、分层系统、按需代码（可选）**。
- **Richardson 成熟度模型**：Level 0（单一端点 RPC）→ Level 1（资源）→ Level 2（HTTP 动词与状态码）→ Level 3（**HATEOAS** 超媒体驱动）。
- REST 是**架构风格**而不是协议。
## SOAP 与 REST 对比
- SOAP：协议、XML、WSDL、标准完备（WS-Security、事务、可靠消息），适合企业级可靠集成。
- REST：风格、JSON 等多格式、轻量、易用、可缓存，适合互联网开放 API 与移动端。
## 异构系统互操作
- 手段：**标准协议与数据格式**（HTTP、JSON、XML、统一数据标准）、**中间件与适配器**、ESB/iPaaS、API 网关、消息队列、数据交换平台。
- 异构数据库集成：**联邦数据库**（统一虚拟视图）、数据访问中间件（ODBC/JDBC）、**ETL/CDC 数据同步**、数据中台。
!! GET、PUT、DELETE 是幂等的，POST 不是幂等的。`,

{id:'m9-1',g:'安全基础与密码学',t:'信息安全基本属性、威胁与安全体系结构',f:'中',sub:'CIA三要素与扩展属性、被动攻击与主动攻击、OSI安全体系结构五类安全服务与八类安全机制、安全设计原则',
core:`## 信息安全基本属性
- **机密性（Confidentiality）**：信息不泄露给未授权者。手段：**加密**、访问控制。
- **完整性（Integrity）**：信息不被未授权篡改。手段：**消息摘要、数字签名、MAC**。
- **可用性（Availability）**：授权用户需要时能够使用。手段：**冗余备份、容灾、抗 DDoS**。
- 扩展：**可控性**、**不可否认性（抗抵赖）**——手段为**数字签名**；**真实性（可鉴别性）**——手段为身份认证。
## 安全威胁
- **被动攻击**：不修改数据，只是**窃听、流量分析**；难以检测，重在**预防**（加密）。
- **主动攻击**：**篡改、伪造（假冒）、重放、拒绝服务**；容易检测但难以完全预防，重在**检测与恢复**。
- 对应关系：窃听破坏机密性；篡改破坏完整性；伪造破坏真实性；DoS 破坏可用性；抵赖破坏不可否认性。
## OSI 安全体系结构（ISO 7498-2 / X.800）
- **五类安全服务**：**认证（鉴别）、访问控制、数据机密性、数据完整性、抗抵赖**。
- **八类安全机制**：**加密、数字签名、访问控制、数据完整性、认证交换、业务流填充、路由控制、公证**。
## 安全设计原则
- **最小特权**、**纵深防御**、**默认拒绝（失败安全）**、职责分离、**最弱链路**、经济性（简单机制）、完全仲裁、开放设计（安全不依赖算法保密，即 Kerckhoffs 原则）。
!! 防"抵赖"靠数字签名而不是加密；业务流填充用于对抗流量分析。`,

{id:'m9-2',g:'安全基础与密码学',t:'对称加密：DES、3DES、AES、SM4与分组模式',f:'高',sub:'密码体制组成、对称加密特点、DES/3DES/AES/SM4/IDEA/RC4参数、分组密码与流密码、ECB/CBC/CTR/GCM工作模式、密钥分发问题',
core:`## 密码体制
- 五元组：**明文 M、密文 C、密钥 K、加密算法 E、解密算法 D**。安全性取决于**密钥**而非算法保密。
- 分类：**对称（私钥）密码**——加解密用**同一密钥**；**非对称（公钥）密码**——公钥加密、私钥解密。
## 对称加密特点
- **加解密速度快**、效率高，适合**大量数据加密**；缺点：**密钥分发与管理困难**（n 个用户两两通信需要 **n(n−1)/2** 个密钥），**无法实现数字签名与抗抵赖**。
## 常见算法
- **DES**：分组 **64 位**，密钥 **56 位**（另 8 位校验），16 轮 Feistel；已不安全。
- **3DES**：用 2 个或 3 个密钥执行"**加密—解密—加密（EDE）**"，有效密钥长度 **112 或 168 位**；兼容 DES，速度慢。
- **AES**：分组 **128 位**，密钥 **128/192/256 位**（对应 10/12/14 轮），代替 DES 的国际标准。
- **SM4**：国密分组算法，分组 **128 位**、密钥 **128 位**，32 轮。
- **IDEA**：分组 64 位，密钥 128 位（PGP 曾使用）。
- **RC4**：**流密码**，密钥长度可变，已不推荐。
## 分组密码与流密码
- 分组密码把明文分成固定长度的块逐块加密；流密码逐位/逐字节与密钥流异或。
## 分组密码工作模式
- **ECB**：每块独立加密，**相同明文块产生相同密文块**，暴露数据模式，不推荐。
- **CBC**：每块先与**前一块密文异或**再加密，需要**初始向量 IV**；不能并行加密。
- **CTR**：对计数器加密生成密钥流，可**并行**。
- **GCM**：CTR + 认证，同时提供**机密性与完整性**（TLS 1.3 常用 AES-GCM）。
!! DES 密钥 56 位、分组 64 位；AES 分组固定 128 位；对称加密不能用于数字签名。`,

{id:'m9-3',g:'安全基础与密码学',t:'非对称加密：RSA、ECC、SM2、DH与数字信封',f:'高',sub:'公钥密码原理、RSA密钥生成与计算、ECC与SM2、DH密钥交换与中间人攻击、数字信封、对称与非对称比较',
core:`## 公钥密码
- 每个用户拥有**公钥（公开）**与**私钥（自己保管）**。
- **加密**：发送方用**接收方的公钥**加密，只有接收方**私钥**能解密（保密性）。
- **签名**：发送方用**自己的私钥**签名，任何人用其**公钥**验证（真实性、不可否认）。
- n 个用户只需要 **n 对密钥**（2n 个），解决了密钥分发问题；缺点是**速度慢**（比对称慢 100~1000 倍），不适合加密大量数据。
## RSA
- 基于**大整数因数分解**难题。
- 密钥生成：选两个大素数 p、q → **n = p × q** → **φ(n) = (p−1)(q−1)** → 选 e 与 φ(n) 互素 → 求 d 使 **e × d ≡ 1 (mod φ(n))**。公钥 (e, n)，私钥 (d, n)。
- 加密 **C = Mᵉ mod n**，解密 **M = Cᵈ mod n**。
- 推荐密钥长度 ≥ 2048 位。
## ECC 与 SM2
- **ECC**：基于**椭圆曲线离散对数**难题，**相同安全强度下密钥更短**（256 位 ECC ≈ 3072 位 RSA），适合移动与物联网设备。
- **SM2**：国密椭圆曲线公钥算法（签名、密钥交换、加密）。
## DH 密钥交换
- 基于**离散对数**难题，双方在不安全信道上协商出**共享密钥**；本身**不提供身份认证**，易受**中间人攻击**，需配合证书或签名。
## 数字信封
- 用**随机生成的对称会话密钥**加密数据（快）→ 用**接收方公钥**加密会话密钥（解决分发）→ 一并发送；接收方用私钥解开会话密钥再解密数据。这就是 TLS、PGP 的混合加密思想。
!! 加密用"对方公钥"，签名用"自己私钥"——这是最常考的易错点。`,

{id:'m9-4',g:'安全基础与密码学',t:'消息摘要、MAC与数字签名',f:'高',sub:'哈希函数特性、MD5/SHA系列/SM3长度、MAC与HMAC、数字签名过程、签名与加密结合、口令加盐存储',
core:`## 哈希函数（消息摘要）
- 把任意长度消息映射为**固定长度**摘要；特性：**单向性**（不可逆）、**抗弱碰撞**（给定消息难以找到另一消息有相同摘要）、**抗强碰撞**（难以找到任意两个摘要相同的消息）、**雪崩效应**。
- 用途：**完整性校验**、数字签名、口令存储、区块链。
- 长度：**MD5 128 位**（已被攻破）、**SHA-1 160 位**（不安全）、**SHA-256 256 位**、SHA-512、**SM3 256 位**（国密）。
## MAC 与 HMAC
- 普通哈希无法防止攻击者"改消息 + 重算摘要"。**MAC（消息认证码）**引入**共享密钥**：MAC = f(K, M)，同时保证**完整性与消息来源认证**。
- **HMAC** = 基于哈希的 MAC（如 HMAC-SHA256），常用于 API 签名、JWT HS256。
- MAC 基于共享密钥，**不能提供不可否认性**。
## 数字签名
- 签名：发送方对消息计算摘要 → 用**自己的私钥**加密摘要得到签名 → 发送"消息 + 签名"。
- 验证：接收方用**发送方公钥**解密签名得到摘要 1 → 对收到的消息重新计算摘要 2 → 两者相等则验证通过。
- 提供：**完整性、真实性（身份认证）、不可否认性**；**不提供机密性**（消息本身是明文）。
- 签名 + 保密：先签名，再用接收方公钥（数字信封）加密。
- 算法：RSA 签名、**DSA**、ECDSA、**SM2** 签名。
## 口令存储
- 不存明文，存储**加盐哈希**；使用 bcrypt、PBKDF2、scrypt 等**慢哈希**抵抗彩虹表与暴力破解。
!! 数字签名不保证机密性；摘要算法不是加密算法，无法"解密"。`,

{id:'m9-5',g:'安全基础与密码学',t:'PKI体系与数字证书',f:'中',sub:'PKI组成、CA/RA职责、X.509证书内容、证书链与信任锚、证书吊销CRL与OCSP、证书申请与验证流程',
core:`## PKI 公钥基础设施
- 解决"**公钥属于谁**"的问题：通过可信第三方 **CA** 签发数字证书，把**公钥与身份绑定**。
- 组成：**CA（证书颁发机构）**——签发、更新、吊销证书；**RA（注册机构）**——审核申请者身份；**证书库/目录服务**（LDAP）；**证书吊销列表 CRL**；密钥备份与恢复；客户端软件。
## X.509 数字证书
- 内容：**版本、序列号、签名算法、颁发者、有效期、主体（持有者）、主体公钥、扩展项**，以及 **CA 对上述内容的数字签名**。
- 证书中**没有私钥**；证书本身是公开的。
## 证书验证
- 用 **CA 的公钥**验证证书上的 CA 签名 → 检查**有效期** → 检查**吊销状态**（CRL 或 **OCSP 在线查询**）→ 检查主体名称/用途。
- **证书链**：终端证书 ← 中间 CA ← **根 CA**（自签名，预置于操作系统/浏览器，即**信任锚**）。
- 不同 CA 体系间可交叉认证。
!! 验证证书用的是"颁发该证书的 CA 的公钥"；用户 A 和 B 证书由不同 CA 签发时，需要沿证书链追溯到共同信任的根 CA。`,

{id:'m9-6',g:'网络安全',t:'安全协议：SSL/TLS、IPSec、SSH、Kerberos与邮件安全',f:'高',sub:'各协议所在层次、TLS握手过程、HTTPS、IPSec AH与ESP、传输模式与隧道模式、IKE、SSH、Kerberos、PGP与S/MIME、VPN类型',
core:`## 各层安全协议
- **应用层**：HTTPS、**SSH**、**PGP / S/MIME**（安全邮件）、SET（安全电子交易）、**Kerberos**。
- **传输层**：**SSL/TLS**（位于 TCP 与应用层之间）。
- **网络层**：**IPSec**。
- **数据链路层**：PPTP、**L2TP**、L2F。
## SSL/TLS
- 提供**机密性（对称加密）、完整性（MAC/AEAD）、身份认证（证书）**；HTTPS = HTTP + TLS，默认端口 **443**。
- 握手：ClientHello（版本、随机数、密码套件）→ ServerHello + **服务器证书** → 客户端**验证证书** → **密钥交换**（ECDHE 或 RSA 加密预主密钥）→ 双方生成**会话密钥** → Finished → 用对称密钥加密通信。
- TLS 1.3：握手减为 **1-RTT**，只保留前向安全的 (EC)DHE，删除 RSA 密钥交换与弱算法。
## IPSec
- **AH（认证头）**：提供**数据源认证、完整性、抗重放**，**不提供加密**。
- **ESP（封装安全载荷）**：提供**加密**（机密性）+ 完整性 + 认证。
- **传输模式**：只保护 IP 载荷，用于主机到主机；**隧道模式**：**封装整个原 IP 包**并加新 IP 头，用于网关到网关（**站点到站点 VPN**）。
- **IKE**：协商安全关联 SA 与密钥。
## 其他
- **SSH**：替代 Telnet/FTP 的安全远程登录，端口 22。
- **Kerberos**：基于**对称密钥**与**可信第三方 KDC**（认证服务器 AS + 票据授予服务器 TGS）的认证协议，使用**票据与时间戳**防重放，要求**时钟同步**。
- **PGP**：邮件加密与签名（IDEA/RSA/MD5 等混合）；**S/MIME** 基于 X.509 证书。
- VPN：IPSec VPN（网络层，站点到站点）、**SSL VPN**（应用层，客户端免安装、远程办公）、L2TP。
!! AH 不加密、ESP 加密；隧道模式封装整个 IP 包。TLS 在传输层，IPSec 在网络层。`,

{id:'m9-7',g:'网络安全',t:'网络攻击与防御：注入、XSS、CSRF、DDoS、防火墙与IDS',f:'高',sub:'SQL注入、XSS、CSRF、DDoS、ARP欺骗、DNS劫持、重放攻击、APT与社会工程；防火墙类型、DMZ、IDS与IPS、WAF、蜜罐、漏洞扫描',
core:`## 常见攻击与防御
- **SQL 注入**：把恶意 SQL 拼接进查询语句。防御：**参数化查询（预编译）**、输入校验、最小权限数据库账号、WAF。
- **XSS 跨站脚本**：向页面注入恶意脚本，在受害者浏览器执行，窃取 Cookie。分为**存储型、反射型、DOM 型**。防御：**输出编码/转义**、内容安全策略 **CSP**、Cookie 设置 **HttpOnly**。
- **CSRF 跨站请求伪造**：诱导已登录用户的浏览器发起非本意的请求（利用浏览器自动携带 Cookie）。防御：**CSRF Token**、校验 Referer/Origin、**SameSite Cookie**、关键操作二次验证。
- **DoS/DDoS**：SYN Flood、UDP Flood、HTTP CC 攻击、反射放大。防御：**流量清洗、高防 IP、CDN**、SYN Cookie、限流。
- **ARP 欺骗**：伪造 ARP 应答实施中间人攻击。防御：静态 ARP 绑定、动态 ARP 检测。
- **DNS 劫持/欺骗**：篡改解析结果。防御：DNSSEC、HTTPS。
- **重放攻击**：防御：**时间戳、序列号、Nonce**。
- **APT 高级持续性威胁**、**社会工程/钓鱼**：安全意识培训、邮件网关、多因素认证。
## 防御设备
- **防火墙**：
- **包过滤**（网络层，依据 IP/端口/协议，速度快但不检查内容）；
- **状态检测**（跟踪连接状态，当前主流）；
- **应用代理网关**（应用层，检查内容，安全性高、速度慢）；
- **下一代防火墙 NGFW**（应用识别、IPS、用户识别）。
- 局限：**防不了内部攻击**、不能防绕过防火墙的连接、对病毒和应用层攻击能力有限。
- **DMZ（隔离区）**：放置对外服务器（Web、邮件），内外网都不能直接互通。
- **IDS 入侵检测**：**旁路**监听、发现并告警，**不阻断**；基于**特征（误用）检测**（误报低、无法发现新攻击）与**异常检测**（可发现未知攻击、误报高）。
- **IPS 入侵防御**：**串联**部署，实时**阻断**。
- **WAF**：针对 Web 应用层攻击（注入、XSS）。
- **蜜罐**：诱骗攻击者，收集攻击手法。
- 漏洞扫描、渗透测试、安全审计、SIEM/SOC。
!! IDS 旁路只告警，IPS 串联能阻断；防 SQL 注入首选参数化查询；CSRF 利用的是"浏览器自动带 Cookie"。`,

/* ---------- 访问控制与安全模型 ---------- */
{id:'m9-8',g:'访问控制与安全模型',t:'访问控制与安全模型：DAC、MAC、RBAC、BLP、Biba',f:'高',sub:'访问控制三要素、访问控制矩阵/ACL/能力表、DAC/MAC/RBAC/ABAC、BLP模型、Biba模型、Chinese Wall、Clark-Wilson、可信计算基与安全等级',
core:`## 访问控制
- 三要素：**主体**（用户、进程）、**客体**（文件、数据）、**控制策略**。
- 实现：**访问控制矩阵**；按列存储为**访问控制列表 ACL**（客体附带"谁能访问"）；按行存储为**能力表**（主体持有"能访问什么"）。
## 访问控制模型
- **DAC 自主访问控制**：客体**所有者自主决定**授权给谁（如 Linux 文件权限、Windows ACL）；灵活但权限易扩散，防不住木马。
- **MAC 强制访问控制**：系统为主体和客体分配**安全标签（密级）**，由系统强制按规则判定，用户无法更改；用于军事、涉密系统。
- **RBAC 基于角色的访问控制**：**用户 → 角色 → 权限**，权限分配给角色，用户通过担任角色获得权限；支持**最小特权、职责分离**，便于管理，企业系统最常用。
- **ABAC 基于属性**：根据主体、客体、环境属性动态决策（如"工作时间、内网、部门经理"）。
## 安全模型
- **BLP 模型（保密性）**：
- **简单安全特性：不上读**（主体不能读高于自己密级的客体）；
- ***-特性：不下写**（主体不能写低于自己密级的客体，防止泄密）。
- **Biba 模型（完整性）**：
- **不下读**（不能读低完整性数据，以免被污染）；
- **不上写**（不能写高完整性数据）。
- **Chinese Wall 模型**：防止**利益冲突**，访问了一家公司的数据后不能再访问其竞争对手的数据（金融、咨询行业）。
- **Clark-Wilson 模型**：商业完整性，通过**良构事务**与**职责分离**保证完整性。
## 可信计算机系统评估准则（TCSEC）
- D、C1、C2、B1、B2、B3、A1，由低到高；**B1 级开始引入强制访问控制**。
!! BLP 保机密：不上读、不下写；Biba 保完整：不下读、不上写——两者方向正好相反。`,

{id:'m9-9',g:'访问控制与安全模型',t:'身份认证与单点登录：多因素认证、OAuth2、JWT、SSO',f:'中',sub:'认证因素（所知/所有/所是）、口令与一次性口令、多因素认证、生物识别指标、SSO实现方式、OAuth2角色与授权码模式、OpenID Connect、JWT结构与特点、零信任',
core:`## 认证因素
- **所知**（口令、PIN）、**所有**（智能卡、U 盾、手机令牌）、**所是**（指纹、人脸、虹膜等生物特征）。
- **多因素认证 MFA**：组合两种及以上**不同类别**的因素（如口令 + 短信/TOTP 动态码）。"口令 + 安全问题"仍属于单一类别。
- **一次性口令 OTP**：基于时间（TOTP）或计数器（HOTP），防重放。
- 生物识别指标：**错误接受率 FAR**（冒充者被接受）与**错误拒绝率 FRR**（合法用户被拒），二者此消彼长；相等点为 EER。
## 单点登录 SSO
- 一次登录访问多个互信系统。实现：**CAS**（票据）、**SAML**（企业，XML 断言）、**OAuth2 + OpenID Connect**（互联网）、Kerberos（内网）。
## OAuth 2.0（授权协议）
- 角色：**资源所有者**（用户）、**客户端**（第三方应用）、**授权服务器**、**资源服务器**。
- **授权码模式**（最安全、最常用）：用户在授权服务器登录并同意授权 → 返回**授权码**给客户端 → 客户端在**后端**用授权码 + 客户端密钥换取**访问令牌 Access Token** → 携带令牌访问资源。公共客户端（App、SPA）配合 **PKCE**。
- 其他：客户端凭证模式（服务间）、隐式模式与密码模式（已不推荐）。
- OAuth2 是**授权**协议；**OpenID Connect** 在其上增加 ID Token，用于**认证**。
## JWT
- 结构：**Header.Payload.Signature**（Base64URL 编码），签名保证**不被篡改**，Payload **未加密**不能放敏感信息。
- 特点：**无状态**，服务端无需保存会话，适合分布式与微服务；缺点：**签发后难以主动吊销**，需短有效期 + 刷新令牌或黑名单。
## 零信任
- "**永不信任，始终验证**"：不再以网络边界划分信任，每次访问都基于身份、设备、上下文进行**持续认证与动态授权**，最小权限访问。
!! OAuth2 授权码是在后端换令牌的，令牌不经过浏览器地址栏；JWT 签名≠加密。`,

{id:'m9-10',g:'安全管理与安全架构',t:'安全风险评估与网络安全等级保护2.0',f:'高',sub:'风险要素（资产/威胁/脆弱性/安全措施）、风险计算与处置方式、等保五个级别、定级要素、等保工作流程、一个中心三重防护、扩展要求、网络安全法与数据安全法',
core:`## 风险评估
- 要素：**资产**（价值）、**威胁**（可能造成损害的潜在原因）、**脆弱性**（可被威胁利用的弱点）、**安全措施**、**风险**。
- **风险 = f（资产价值，威胁可能性，脆弱性严重程度）**；威胁利用脆弱性作用于资产产生风险。
- 流程：评估准备 → **资产识别 → 威胁识别 → 脆弱性识别 → 已有安全措施确认** → 风险分析与计算 → 风险处置建议。
- 风险处置：**规避**（不做该业务）、**降低（缓解）**（采取控制措施）、**转移**（购买保险、外包）、**接受**（残余风险在可接受范围内）。
## 网络安全等级保护 2.0
- 定级要素：**受侵害的客体**（公民法人权益、社会秩序公共利益、国家安全）与**对客体的侵害程度**（一般、严重、特别严重）。
- 五个级别：
- **第一级**：损害公民、法人合法权益；
- **第二级**：严重损害公民法人权益，或损害社会秩序和公共利益；
- **第三级**：**严重损害社会秩序和公共利益，或损害国家安全**（大多数重要信息系统）；
- **第四级**：特别严重损害社会秩序公共利益，或严重损害国家安全；
- **第五级**：特别严重损害国家安全。
- 工作流程：**定级 → 备案 → 建设整改 → 等级测评 → 监督检查**。二级及以上需要备案；**三级系统每年至少测评一次**。
- 技术框架"**一个中心、三重防护**"：**安全管理中心**；**安全通信网络、安全区域边界、安全计算环境**。
- 要求分为**安全通用要求**与**扩展要求**（**云计算、移动互联、物联网、工业控制、大数据**）。
## 法律法规
- 《**网络安全法**》（等级保护、关键信息基础设施保护、个人信息保护）、《**数据安全法**》（数据分类分级）、《**个人信息保护法**》、《**密码法**》（核心密码、普通密码、商用密码）。
!! 等保 2.0 的"三重防护"是通信网络、区域边界、计算环境；"一个中心"是安全管理中心。`,

{id:'m9-11',g:'安全管理与安全架构',t:'系统安全架构设计：纵深防御、零信任、SDL与威胁建模',f:'中',sub:'安全架构设计原则、纵深防御、零信任架构组成、安全开发生命周期SDL、STRIDE威胁建模、数据全生命周期安全、数据脱敏与分类分级、安全审计与应急响应',
core:`## 安全架构设计
- 原则：**纵深防御**（多层防护互为补充）、**最小特权**、**默认安全**、**职责分离**、安全与业务同步规划（"三同步"：同步规划、同步建设、同步使用）。
- 分层：物理安全 → 网络安全 → 主机/系统安全 → 应用安全 → 数据安全 → 安全管理。
## 零信任架构
- 核心组件：**策略决策点 PDP**（策略引擎）、**策略执行点 PEP**（访问代理/网关）、身份管理、设备可信评估、持续监测。
- 特点：以**身份为中心**、**持续验证**、**动态最小授权**、**微隔离**；适合远程办公、多云混合环境。
## 安全开发生命周期 SDL
- 安全培训 → **需求阶段安全需求** → **设计阶段威胁建模** → 编码阶段安全编码与**静态代码扫描 SAST** → 测试阶段**动态测试 DAST**、渗透测试、模糊测试 → 发布阶段安全审核 → 响应阶段应急响应。
- **安全左移**：越早发现漏洞，修复成本越低。DevSecOps 把安全融入 CI/CD。
## STRIDE 威胁建模（微软）
- **S 假冒（Spoofing）**→ 破坏认证；**T 篡改（Tampering）**→ 完整性；**R 抵赖（Repudiation）**→ 不可否认性；**I 信息泄露（Information Disclosure）**→ 机密性；**D 拒绝服务（DoS）**→ 可用性；**E 权限提升（Elevation of Privilege）**→ 授权。
## 数据安全
- 数据全生命周期：**采集 → 传输 → 存储 → 处理 → 交换 → 销毁**，每个阶段都需要防护。
- **数据分类分级**、**数据脱敏**（静态脱敏用于测试环境，动态脱敏用于查询展示）、加密存储、数据防泄漏 DLP、数据库审计、备份与恢复。
## 安全运营
- 安全审计（日志集中、不可篡改）、SIEM/SOC 安全态势感知、**应急响应**（准备、检测、遏制、根除、恢复、总结）。
!! STRIDE 六类威胁分别对应认证、完整性、不可否认、机密性、可用性、授权六个安全属性。`,

{id:'m10-1',g:'质量属性',t:'软件质量属性体系与六大质量属性',f:'高',sub:'ISO/IEC 25010质量模型、开发期与运行期质量属性、业务质量属性、性能/可用性/可修改性/安全性/可测试性/易用性定义与度量、质量属性之间的冲突',
core:`## 质量模型
- **ISO/IEC 9126 → 25010**：功能适合性、性能效率、兼容性、易用性、可靠性、信息安全性、**可维护性**、**可移植性**。
- 按阶段分：**开发期质量属性**——易理解性、**可扩展性**、**可重用性**、**可测试性**、**可维护性**、**可移植性**；**运行期质量属性**——**性能、安全性、可伸缩性、互操作性、可靠性、可用性、鲁棒性**。
- 业务质量属性：上市时间、成本收益、预期生命周期、目标市场。
## 软考六大质量属性（必须熟记）
- **性能**：系统的响应能力，用**响应时间、吞吐量（TPS/QPS）、并发数、资源利用率**度量。
- **可用性**：系统能够正常运行的时间比例，**A = MTTF / (MTTF + MTTR)**，常用"几个 9"表示；关注**故障检测与快速恢复**。
- **可修改性**：以较高性价比修改系统的能力，包括**可维护性、可扩展性、结构重组、可移植性**；用"修改所需的工作量/时间、影响范围"度量。
- **安全性**：阻止非授权使用、同时向合法用户提供服务的能力，包括**机密性、完整性、不可否认性、可控性**。
- **可测试性**：软件发现错误的能力，**可控性与可观测性**。
- **易用性**：用户使用软件、学习、出错恢复的难易程度。
## 质量属性之间的冲突（权衡）
- 安全性 ↔ 性能（加密、校验增加开销）；可用性（冗余）↔ 成本；可修改性（多层抽象、间接）↔ 性能；性能（缓存）↔ 一致性。
- 架构设计的本质就是在质量属性之间**做出有依据的权衡**。
!! "可修改性"包含可维护性、可扩展性、结构重组、可移植性；"可用性"关注的是故障间隔与恢复时间，而不是"好不好用"——"好不好用"是易用性。`,

{id:'m10-2',g:'质量属性',t:'质量属性场景：六要素描述',f:'高',sub:'质量属性场景六要素、可用性/性能/可修改性/安全性/可测试性/易用性场景示例、一般场景与具体场景、场景在架构设计与评估中的作用',
core:`## 质量属性场景
- 用**具体、可测量**的方式描述质量属性需求，避免"系统要高性能"这类模糊表述。
- **六要素**：
- **刺激源**：产生刺激的实体（用户、外部系统、攻击者、开发人员）。
- **刺激**：到达系统的事件（请求、故障、修改需求、攻击）。
- **环境**：刺激发生时系统所处的状态（正常运行、峰值、降级、开发期）。
- **制品**：受刺激的部分（整个系统、某个构件、数据）。
- **响应**：系统对刺激采取的行动。
- **响应度量**：对响应的**量化衡量**（时间、百分比、工作量）。
## 各属性场景要点
- **性能**：刺激源为用户/外部系统，刺激是**事件到达**（周期、随机），响应度量是**响应时间、吞吐量、抖动、丢失率**。
- **可用性**：刺激是**故障**（崩溃、遗漏、时序错误、错误响应），响应是**检测、记录、通知、恢复、降级**，度量是**可用时间比例、修复时间（MTTR）**。
- **可修改性**：刺激源是**开发人员/维护人员**，刺激是**修改请求**（增加功能、修改、删除），环境是**设计期/编译期/运行期**，度量是**工作量、时间、影响构件数量**。
- **安全性**：刺激是**攻击**（非授权访问、篡改、拒绝服务），响应是**认证、授权、审计、阻止**，度量是**阻止攻击的比例、检测时间、恢复时间**。
- **可测试性**：刺激是**完成某个开发阶段需要测试**，度量是**覆盖率、发现缺陷所需时间**。
- **易用性**：刺激是**用户学习、高效使用、减少错误**，度量是**任务完成时间、出错数、满意度**。
!! 考题常给一段场景描述要求填空：分清"刺激"（发生了什么）与"响应"（系统做了什么），"响应度量"一定是可量化的数字。`,

{id:'m10-3',g:'质量属性',t:'质量属性设计战术',f:'高',sub:'可用性战术（错误检测/恢复/预防）、性能战术（资源需求/资源管理/资源仲裁）、可修改性战术（局部化修改/防止连锁反应/推迟绑定时间）、安全性战术（抵抗/检测/恢复攻击）、可测试性与易用性战术',
core:`## 可用性战术
- **错误检测**：**命令/响应（Ping/Echo）**、**心跳**、**异常检测**、投票。
- **错误恢复**：**主动冗余（热备份）**——所有冗余组件同时响应事件，切换最快；**被动冗余（暖/冷备份）**——主组件响应，定期同步给备份；**备件**；**检查点/回滚**；**重新同步、影子操作**。
- **错误预防**：**从服务中删除**（进程监视器重启）、**事务**、进程监视器。
## 性能战术
- **资源需求**（减少需求）：**提高计算效率**、减少计算开销、**控制事件到达率/采样频率**、限制执行时间、限制队列大小。
- **资源管理**：**引入并发**、**维持数据或计算的多个副本**（缓存、负载均衡）、**增加可用资源**。
- **资源仲裁**（调度策略）：**FIFO、固定优先级**（语义重要性、时限单调、速率单调）、**动态优先级**（轮转、时限时间最早优先 EDF）、静态调度。
## 可修改性战术
- **局部化修改**：维持**语义一致性**（高内聚）、预期期望的变更、泛化模块、限制可能的选择。
- **防止连锁反应**：**信息隐藏**、维持现有接口、限制通信路径、**使用仲裁者（中介）**。
- **推迟绑定时间**：**运行时注册（插件）**、**配置文件**、多态、组件更换、遵守已定义的协议。
## 安全性战术
- **抵抗攻击**：**认证用户、授权用户**、维护数据机密性、维护完整性、**限制暴露**、限制访问。
- **检测攻击**：**入侵检测**。
- **从攻击中恢复**：**恢复状态**（同可用性战术）、**识别攻击者（审计追踪）**。
## 可测试性与易用性
- 可测试性：**记录/回放**、**分离接口与实现**、**特化访问路线/接口**（测试桩）、**内置监视器**。
- 易用性：运行时战术（**撤销、取消**、显示系统状态）、设计时战术（UI 与其余部分分离，如 MVC）、支持用户主动性。
!! "心跳"属于可用性的错误检测；"缓存/多副本"属于性能的资源管理；"信息隐藏"属于可修改性的防止连锁反应；"配置文件/插件"属于推迟绑定时间。`,

{id:'m10-4',g:'架构评估',t:'架构评估基础：敏感点、权衡点、风险点与评估方式',f:'高',sub:'架构评估目的与时机、敏感点、权衡点、风险点与非风险点、基于调查问卷或检查表/基于场景/基于度量三类评估方式、评估参与者',
core:`## 评估目的
- 在架构确定后、实现之前，**尽早发现架构是否满足质量需求**，识别风险，降低返工成本。评估的是**架构对质量属性的支持**，不是代码缺陷。
## 关键概念
- **敏感点**：**一个或多个构件（及其关系）的特性**，对实现**某一个**质量属性至关重要。例如"加密强度"是安全性的敏感点。
- **权衡点**：影响**多个质量属性**、并且对它们都是敏感点的特性。例如"加密强度"同时影响安全性与性能，就是**权衡点**。
- **风险点**：可能引起问题的架构决策（**不是缺陷，而是隐患**），如"所有服务共用一个数据库"。
- **非风险点**：经过分析认为是**良好**的架构决策，如"响应时间 1 秒能满足要求，因为只需 3 次数据库访问"。
## 三类评估方式
- **基于调查问卷或检查表**：通用、可复用，较依赖评估者经验，较主观。
- **基于场景**（最常用）：用**质量属性场景**评估架构对需求的满足程度，如 **SAAM、ATAM、CBAM**。
- **基于度量**：对架构文档或代码进行量化度量（如耦合度、复杂度），客观但需要较完整的制品。
## 参与者
- 评估小组、项目决策者（项目经理、客户）、**架构利益相关者**（开发、测试、运维、用户）。
!! 敏感点影响一个属性，权衡点影响多个属性；判断题常给一句"××增加安全性但降低性能"——这就是权衡点。`,

{id:'m10-5',g:'架构评估',t:'ATAM架构权衡分析方法与效用树',f:'高',sub:'ATAM四个阶段九个步骤、效用树结构与优先级（重要性/难度）、场景头脑风暴与优先级、ATAM输出、参与者',
core:`## ATAM（Architecture Tradeoff Analysis Method）
- SEI 提出，关注**多个质量属性之间的权衡**，在评估中识别**敏感点、权衡点、风险点、非风险点**；不仅揭示架构满足特定质量目标的程度，还说明**质量目标之间如何交互**。
## 四个阶段、九个步骤
- **阶段0：活动（评估）准备**——组建评估小组、确定范围。
- **阶段1：描述与初始评估（场景和需求收集分析）**：
- ① **描述 ATAM 方法**；② **描述业务动机（商业目标）**；③ **描述架构**；④ **确定架构方法**；⑤ **生成质量属性效用树**；⑥ **分析架构方法**。
- **阶段2：测试与评估（全体利益相关者参与）**：
- ⑦ **头脑风暴并确定场景优先级**（集思广益）；⑧ **再次分析架构方法**。
- **阶段3：报告 ATAM 结果**：⑨ 提交结果（架构方法、场景及优先级、效用树、风险点、非风险点、敏感点、权衡点、风险主题）。
## 质量属性效用树
- 根节点"**效用**" → 第二层**质量属性**（性能、可用性……）→ 第三层**属性细化**（如"数据延迟""事务吞吐量"）→ 叶子为**具体质量属性场景**。
- 每个场景用两个维度标注优先级：**（重要性，实现难度）**，取 H/M/L，如 (H, H) 表示对系统成功非常重要且实现难度大，应优先分析。
## SAAM 与 ATAM 的区别
- SAAM 最初用于评估**可修改性**，基于场景，侧重**功能与结构**；ATAM 在 SAAM 基础上发展，关注**多质量属性权衡**。
!! 效用树在第⑤步生成（阶段1），场景头脑风暴在第⑦步（阶段2，更多利益相关者参与）；优先级二元组是（重要性，难度）。`,

{id:'m10-6',g:'架构评估',t:'SAAM、CBAM及其他评估方法',f:'中',sub:'SAAM五个步骤与场景交互、CBAM成本收益分析与ROI、ARID/SAEM/FAAM等方法、各方法对比',
core:`## SAAM（基于场景的架构分析方法）
- 最早的架构评估方法之一，最初用于评估**可修改性**，后扩展到其他属性。
- 步骤：**场景开发**（收集利益相关者场景）→ **体系结构描述** → **单个场景评估**（直接场景与间接场景）→ **场景交互评估** → **总体评估**。
- **直接场景**：架构无需修改即可支持；**间接场景**：需要修改架构才能支持。
- **场景交互**：多个不同的间接场景需要修改**同一个构件**，说明该构件**职责过多、耦合高**（语义上不相关的场景交互越多，架构越差）。
## CBAM（成本收益分析方法）
- 在 ATAM 之后，从**经济角度**评估架构决策：对每个架构策略估算**收益（质量属性改进带来的效用）**与**成本**，计算**投资回报率 ROI = 收益 / 成本**，按 ROI 排序选择策略。
- 步骤：整理场景 → 确定场景优先级 → 确定效用 → 确定架构策略及其对质量属性的影响 → 计算总收益 → 根据 ROI 选择策略 → 直觉检验。
## 其他方法
- **ARID**：适用于**架构设计早期、部分设计**的评审（结合 ATAM 与积极设计评审）。
- **SAEM**：架构评估模型，基于 GQM。**FAAM**：家族体系结构评估（产品线）。**SACAM**：比较多个候选架构。**SAAMCS**、**ESAAMI**：SAAM 扩展。
## 方法对比
- SAAM：单一属性（可修改性）、场景交互；ATAM：多属性权衡、效用树；CBAM：成本收益与 ROI。
!! SAAM 的"场景交互"高说明构件职责不清；CBAM 关注的是"经济性"，核心指标 ROI。`,

{id:'m10-7',g:'系统可靠性',t:'可靠性指标与串并联系统计算',f:'高',sub:'可靠性与可用性区别、失效率λ、MTTF/MTTR/MTBF关系、可用性计算与"几个9"、串联系统、并联系统、混联系统、N模冗余',
core:`## 基本指标
- **可靠性 R(t)**：系统在规定条件下、规定时间内**无故障运行**的概率。
- **失效率 λ**：单位时间内失效的比例；当 λ 为常数时 **R(t) = e^(−λt)**，**MTTF = 1/λ**。
- **MTTF**：平均无故障时间；**MTTR**：平均修复时间；**MTBF = MTTF + MTTR**：平均故障间隔时间（MTTR 很小时 MTBF ≈ MTTF）。
- **可用性 A = MTTF / (MTTF + MTTR) = MTTF / MTBF**。
- "几个 9"：**99.9% 年停机约 8.76 小时**；**99.99% 约 52.56 分钟**；99.999% 约 5.26 分钟。
- 可靠性 ≠ 可用性：可用性还考虑修复速度，可靠性只看不出故障的能力。
## 串联系统
- 所有部件都正常系统才正常：**R = R₁ × R₂ × … × Rₙ**；失效率 **λ = λ₁ + λ₂ + … + λₙ**。串联部件越多可靠性越低。
## 并联系统
- 只要有一个部件正常系统就正常：**R = 1 − (1−R₁)(1−R₂)…(1−Rₙ)**。
## 混联系统
- 先把并联部分算成等效可靠度，再与串联部分相乘。
## N 模冗余（NMR）
- 如三模冗余 TMR：3 个相同模块 + **表决器**，多数结果为准，可容忍 1 个模块故障。
!! 串联相乘可靠度、相加失效率；并联用"1 减去全部失效概率的乘积"。`,

{id:'m10-8',g:'系统可靠性',t:'容错技术与软件可靠性设计',f:'中',sub:'故障/错误/失效概念、软件容错技术（N版本程序设计、恢复块、防卫式程序设计）、硬件冗余（双机热备/冷备/双机互备、集群）、软件可靠性模型、FMEA与FTA、可靠性测试',
core:`## 基本概念
- **故障（Fault）**：缺陷本身（如代码 bug）；**错误（Error）**：故障被触发后导致的不正确状态；**失效（Failure）**：系统对外表现出的不能完成规定功能。故障 → 错误 → 失效。
- 提高可靠性的途径：**避错**（避免引入故障：规范开发、评审）、**查错**、**纠错**、**容错**（故障发生时仍能正常工作）。
## 软件容错技术
- **N 版本程序设计**：由**不同团队**独立开发 N 个功能相同的版本**并行运行**，通过**表决**输出结果，属于**静态冗余**；要求版本之间**设计多样性**，成本高。
- **恢复块方法**：一个**主块**和若干**后备块**，**顺序执行**；主块执行后通过**验收测试**，不通过则**恢复到检查点**并执行后备块，属于**动态冗余**。
- **防卫式程序设计**：在程序中加入**错误检测代码**（断言、参数检查、异常处理），发现错误后进行处理，不依赖冗余版本。
## 硬件/系统冗余
- **双机热备**（主备，备机实时同步、自动切换）、**双机互备**（两机各运行业务并互为备份）、**冷备**（备机平时不运行）、**集群**（多节点负载分担与故障转移）。
- 冗余类型：**结构冗余**（硬件、软件）、**信息冗余**（校验码）、**时间冗余**（重复执行）、冗余附加技术。
## 可靠性分析方法
- **FMEA 故障模式与影响分析**：**自下而上**，从部件的失效模式出发分析对系统的影响。
- **FTA 故障树分析**：**自上而下**，从不期望的顶事件出发，用**与门/或门**逐层分析导致它的原因。
## 软件可靠性模型与测试
- 模型：种子法模型、失效率类模型（J-M 模型）、曲线拟合类、可靠性增长模型、贝叶斯模型。
- 可靠性测试：按**运行剖面**（实际使用的输入分布）测试，估计可靠性指标。
!! N 版本是并行 + 表决；恢复块是顺序 + 验收测试 + 回退。FMEA 自下而上，FTA 自上而下。`,

{id:'m11-1',g:'中间件基础',t:'中间件的定义、作用与分类',f:'中',sub:'中间件定义与位置、中间件的作用、通信处理/事务处理/数据存取/分布式对象/面向消息/集成/安全中间件、事务处理监控器、国产中间件',
core:`## 定义与位置
- 中间件位于**操作系统、网络、数据库之上**，**应用软件之下**，为分布式应用提供**通用服务**的系统软件；屏蔽底层异构性（硬件、操作系统、网络协议、数据库），提供标准化的编程接口与协议。
## 作用
- **屏蔽异构性**，实现**互操作**；提供**通信、事务、安全、负载均衡、容错**等公共服务，使开发者**专注业务逻辑**；提高可移植性与可复用性；简化分布式系统开发。
## 分类
- **通信处理（消息）中间件**：可靠、高效的消息传递，**异步通信、解耦、削峰**，如 RabbitMQ、Kafka、RocketMQ、IBM MQ。
- **事务处理中间件（事务处理监控器 TP Monitor）**：在大量并发客户与数据库之间进行**事务管理、进程管理、负载均衡、故障恢复**，如 Tuxedo、CICS。
- **数据存取中间件**：屏蔽数据库差异，如 **ODBC、JDBC**、数据库连接池、分库分表中间件。
- **分布式对象中间件**：支持远程对象调用，如 **CORBA、RMI、COM/DCOM、EJB**。
- **应用服务器**：为 Web 应用与企业应用提供运行环境，如 Tomcat、WebLogic、TongWeb。
- **集成中间件**：ESB、API 网关、iPaaS。
- **安全中间件**：统一认证、加解密服务。
- **嵌入式中间件**：如 DDS（数据分发服务）、AUTOSAR RTE。
## 国产中间件（信创）
- 东方通 **TongWeb**、金蝶 **Apusic**、中创 **InforSuite**、宝兰德 BES 等应用服务器；东方通 TongLINK/Q 消息中间件。
!! 中间件在"操作系统之上、应用之下"；TP 监控器解决的是"大量客户端并发访问数据库时的事务与资源管理"。`,

{id:'m11-2',g:'中间件基础',t:'分布式对象中间件：CORBA、RMI、COM/DCOM',f:'低',sub:'CORBA体系结构（ORB、IDL、Stub、Skeleton、对象适配器POA）、IIOP、Java RMI、COM/DCOM、EJB、远程调用过程',
core:`## CORBA（公共对象请求代理体系结构，OMG 制定）
- 目标：不同语言、不同平台的对象透明地互相调用。
- **ORB（对象请求代理）**：核心，负责**定位对象、传递请求、返回结果**，是分布式对象的"软总线"。
- **IDL（接口定义语言）**：与语言无关地定义接口，由 IDL 编译器生成客户端 **Stub（存根）** 与服务端 **Skeleton（框架）**。
- **对象适配器（POA，可移植对象适配器）**：位于 ORB 与服务对象实现之间，负责**对象激活、对象引用生成、把请求分派给服务对象（伺服对象 Servant）**。
- **IIOP**：基于 TCP/IP 的 ORB 间互操作协议。
- 服务：命名服务、事件服务、事务服务、安全服务等。
## Java RMI
- 仅限 **Java** 之间的远程方法调用，客户端 Stub 与服务端 Skeleton，注册表 rmiregistry；对象**序列化**传参。
## COM/DCOM
- 微软组件对象模型，DCOM 支持跨网络调用；主要用于 Windows 平台。
## EJB
- Java EE 服务器端组件：**会话 Bean**（有状态/无状态）、**消息驱动 Bean**（异步处理 JMS 消息）、（早期）实体 Bean；容器提供事务、安全、生命周期管理。
## 远程调用的共同模式
- 客户端调用本地**存根（代理）** → 参数**编组（序列化）** → 网络传输 → 服务端**骨架**解组并调用实际对象 → 结果原路返回。这一模式在 gRPC、Dubbo 中依然存在。

{id:'m11-3',g:'消息中间件',t:'消息中间件模型：点对点、发布订阅、JMS、AMQP与MQTT',f:'高',sub:'消息中间件作用（解耦/异步/削峰）、点对点与发布订阅、JMS消息模型、AMQP交换机类型、MQTT主题与QoS等级、消息投递语义',
core:`## 消息中间件的作用
- **解耦**：生产者不需要知道消费者是谁；**异步**：发送后立即返回，缩短响应时间；**削峰填谷**：突发流量先进入队列，消费者按能力处理；**广播**；**最终一致性**。
- 代价：系统复杂度增加、**消息丢失/重复/乱序**等问题需要处理、一致性变为最终一致。
## 两种消息模型
- **点对点（P2P，队列 Queue）**：一条消息**只能被一个消费者**消费；多个消费者竞争消费，实现负载分担。
- **发布/订阅（Pub/Sub，主题 Topic）**：一条消息被**所有订阅者**各自收到一份；实现一对多广播。
## JMS（Java Message Service）
- Java 消息服务 **API 规范**（不是协议），支持 Queue 与 Topic；ActiveMQ 实现。
## AMQP
- **高级消息队列协议**（线级协议，跨语言），RabbitMQ 实现。
- 生产者发送到**交换机 Exchange**，通过**绑定（Binding）**与**路由键**路由到**队列**：
- **direct**：路由键**完全匹配**；**fanout**：**广播**到所有绑定队列；**topic**：路由键**通配符匹配**（* 匹配一个词，# 匹配零个或多个词）；headers：按消息头匹配。
## MQTT
- 轻量级**发布/订阅**协议，基于 TCP，报文头最小 2 字节，适合**物联网**低带宽、不稳定网络；通过 **Broker** 转发。
- **QoS 0：最多一次**（可能丢失）；**QoS 1：至少一次**（可能重复）；**QoS 2：恰好一次**（四次握手，开销最大）。
- 支持遗嘱消息、保留消息、持久会话。
## 投递语义
- **At most once**（可能丢）、**At least once**（可能重复，最常用，消费端**幂等**）、**Exactly once**（代价高）。
!! 点对点：一条消息一个消费者；发布订阅：一条消息所有订阅者。MQTT QoS 1 可能重复，QoS 2 恰好一次。`,

{id:'m11-4',g:'消息中间件',t:'Kafka、RocketMQ、RabbitMQ与消息可靠性设计',f:'高',sub:'Kafka架构（Broker/Topic/Partition/副本/消费组/Offset）、三种MQ对比、消息不丢失三环节、重复消费与幂等、顺序消息、消息积压、延迟消息与死信队列',
core:`## Kafka 架构
- **Broker**（服务节点）、**Topic**（主题）、**Partition（分区）**——Topic 分为多个分区实现**并行与水平扩展**，分区内**顺序追加写**（磁盘顺序写 + 零拷贝 + 批量压缩，吞吐极高）。
- **副本**：每个分区有 Leader 与 Follower 副本，**ISR**（同步副本集合）保证高可用。
- **消费组**：同一消费组内**一个分区只能被一个消费者**消费（组内点对点）；不同消费组各自完整消费（组间发布订阅）。消费者数量超过分区数时多余消费者空闲。
- **Offset**：消费者记录消费位置，可回溯重放消息。
## 三种常见 MQ
- **Kafka**：吞吐量最高（百万级/秒），适合**日志采集、流处理、大数据管道**；功能相对简单。
- **RocketMQ**（阿里，Java）：高吞吐、低延迟，支持**事务消息、延时消息、顺序消息、消息回溯**，适合**电商交易**。
- **RabbitMQ**（Erlang，AMQP）：**路由灵活**、延迟低（微秒级）、管理界面好，吞吐相对较低，适合中小规模业务。
## 消息不丢失（三个环节）
- **生产端**：同步发送 + **确认机制**（Kafka **acks=all**，RabbitMQ publisher confirm），失败重试。
- **Broker 端**：**持久化**到磁盘、**多副本**同步（Kafka min.insync.replicas ≥ 2），同步刷盘。
- **消费端**：业务**处理成功后再提交 Offset / 手动 ACK**，避免"先确认后处理"。
## 重复消费与幂等
- 重试、再均衡等都会导致重复消费；消费端保证**幂等**：**唯一业务 ID + 去重表/唯一索引**、状态机判断、Redis SETNX。
## 顺序消息
- 把需要有序的消息（如同一订单的创建→支付→发货）按**业务键哈希到同一分区/队列**，由**单线程**顺序消费。全局有序需单分区，牺牲吞吐。
## 消息积压
- 原因：消费能力不足或消费者故障。处理：**增加分区与消费者**、优化消费逻辑（批量、异步）、临时把积压消息转储到新 Topic 用更多消费者处理、监控堆积告警。
## 延迟消息与死信队列
- **延迟消息**：订单 30 分钟未支付自动取消。**死信队列 DLQ**：多次重试仍失败的消息转入，人工或补偿处理，避免阻塞正常消费。
!! Kafka 同一消费组内一个分区只能被一个消费者消费；保证不丢消息要"生产确认 + Broker 持久化多副本 + 消费成功后提交"。`,

  ['如何处理消息积压？','临时扩容分区与消费者；优化消费逻辑（批量处理、异步IO）；紧急时把积压消息转储到分区更多的临时Topic并行消费；非核心消息降级延后处理；完善积压监控告警与压测容量规划。']],
 key:'丢失三环节；幂等与顺序方案；积压处理措施。'},

{id:'m11-5',g:'应用服务器与数据中间件',t:'应用服务器、Web容器与事务处理',f:'中',sub:'Web服务器与应用服务器区别、Servlet容器与Java EE（Jakarta EE）容器、主流与国产应用服务器、连接池、分布式事务支持（JTA/XA）、应用服务器集群与会话共享',
core:`## Web 服务器与应用服务器
- **Web 服务器**：处理 HTTP 请求、提供**静态资源**、反向代理与负载均衡，如 **Nginx、Apache HTTP Server**。
- **应用服务器**：为**动态业务逻辑**提供运行环境与企业级服务（事务、安全、连接池、消息、命名服务 JNDI），如 **Tomcat**（Servlet 容器，轻量）、**WebLogic、WebSphere、JBoss/WildFly**（完整 Java EE），国产 **TongWeb、Apusic、BES、InforSuite**。
- 常见部署：Nginx（静态、负载均衡、TLS）→ 多个应用服务器实例。
## 容器提供的服务
- **生命周期管理**、**事务管理**（声明式事务、**JTA** 支持 XA 分布式事务）、**安全**（认证授权）、**数据库连接池**、线程池、JNDI、JMS。
## 连接池
- 预先创建并复用数据库连接，避免频繁建立/释放的开销；参数：**最小/最大连接数、获取超时、空闲回收、连接有效性检测**。连接数并非越大越好，受数据库承载能力限制。
## 集群与会话
- 应用服务器集群通过负载均衡实现高可用与扩展；会话处理：**会话粘滞**（源地址哈希）、**会话复制**、**集中式会话存储**（Redis，推荐）、**无状态 Token（JWT）**。
## 事务处理监控器
- **Tuxedo、CICS**：在大型机/金融系统中管理海量并发事务，提供**进程管理、事务管理（XA 协调）、负载均衡、故障恢复**；遵循 X/Open DTP 模型（AP 应用程序、RM 资源管理器、TM 事务管理器）。
!! Nginx 是 Web 服务器（静态、反向代理），Tomcat 是 Servlet 容器（应用服务器）；集群会话推荐集中存储或无状态。`,

{id:'m11-6',g:'应用服务器与数据中间件',t:'数据访问中间件：读写分离、分库分表与Redis高可用',f:'中',sub:'读写分离与主从延迟、垂直拆分与水平拆分、分片键与分片策略、分库分表中间件（ShardingSphere/MyCat）、分布式查询问题、Redis数据结构/持久化RDB与AOF/主从/哨兵/Cluster',
core:`## 读写分离
- 主库处理写、从库处理读，通过**主从复制**同步；中间件或框架按 SQL 类型路由。
- 问题：**主从延迟**导致刚写入读不到。对策：**写后读强制走主库**、关键业务读主库、延迟监控。
## 分库分表
- **垂直拆分**：按**业务**拆库（订单库、用户库），按**列**拆表（冷热字段分离）。
- **水平拆分**：按**行**把同一张表的数据分布到多个库表，解决**单表数据量过大**（如单表超过千万行）。
- **分片键**选择：查询最频繁、分布均匀的字段（如用户 ID）；**策略**：**取模哈希**（分布均匀，扩容难）、**范围**（按时间/ID 区间，易扩容但可能热点）、一致性哈希、按基因法（订单号嵌入用户 ID 基因）。
- 带来的问题：**跨库 JOIN**、**分布式事务**、**全局主键**、**跨分片排序分页**、扩容数据迁移。
- 中间件：**ShardingSphere**（JDBC 客户端模式与 Proxy 代理模式）、**MyCat**（代理模式）。
## Redis
- 数据结构：**String、Hash、List、Set、ZSet（有序集合，排行榜）**，以及 Bitmap、HyperLogLog、Stream。
- 持久化：**RDB**（定时**快照**，恢复快、文件小，但可能**丢失最后一次快照后的数据**）；**AOF**（**追加写命令日志**，数据更完整，文件大、恢复慢，可配置 everysec）；生产常用**混合持久化**。
- 高可用：**主从复制**（读扩展）→ **哨兵 Sentinel**（监控主节点，**自动故障转移**选举新主）→ **Cluster 集群**（**16384 个哈希槽**分片，多主多从，水平扩展容量与吞吐）。
!! 水平拆分解决数据量，垂直拆分解决业务耦合；RDB 是快照、AOF 是命令日志；哨兵负责自动故障转移，Cluster 负责分片。`,

{id:'m12-1',g:'项目管理',t:'进度管理：网络图、关键路径与时差计算',f:'高',sub:'单代号网络图PDM与双代号网络图ADM、四种依赖关系、正推法与逆推法、ES/EF/LS/LF、总时差与自由时差、关键路径特性',
core:`## 网络图
- **单代号网络图（PDM，前导图法）**：节点表示活动，箭线表示依赖；有四种依赖关系：**完成—开始 FS**（最常用）、完成—完成 FF、开始—开始 SS、开始—完成 SF。
- **双代号网络图（ADM，箭线图法）**：箭线表示活动，节点表示事件；只用 FS，需要**虚活动**（不耗时间与资源）表示逻辑关系。
## 时间参数
- **正推法**求最早时间：**ES** = 所有紧前活动 EF 的**最大值**，**EF = ES + 工期**。
- **逆推法**求最晚时间：**LF** = 所有紧后活动 LS 的**最小值**，**LS = LF − 工期**。
- **总时差 TF = LS − ES = LF − EF**：在**不推迟项目总工期**前提下活动可推迟的时间。
- **自由时差 FF = 紧后活动 ES 的最小值 − 本活动 EF**：在**不影响紧后活动最早开始**前提下可推迟的时间。自由时差 ≤ 总时差。
## 关键路径
- 网络图中**最长的路径**，决定**项目最短工期**；关键路径上活动的**总时差为 0**（无强制约束时）。
- 关键路径可能**不止一条**；关键路径会随项目进展而变化；压缩工期只能压缩关键路径上的活动。
!! 关键路径是"最长"路径而不是最短；总时差看项目，自由时差看紧后活动。`,

{id:'m12-2',g:'项目管理',t:'进度估算与控制：PERT三点估算、甘特图与进度压缩',f:'中',sub:'PERT三点估算公式与标准差、概率计算、甘特图优缺点、进度压缩（赶工与快速跟进）、资源平衡、里程碑',
core:`## PERT 三点估算
- 乐观时间 O、最可能时间 M、悲观时间 P。
- **期望工期 E = (O + 4M + P) / 6**；**标准差 σ = (P − O) / 6**。
- 概率（正态分布）：落在 **E ± 1σ** 内约 **68.3%**，**E ± 2σ** 约 **95.5%**，**E ± 3σ** 约 **99.7%**。例如在 E 之前完成的概率是 50%，在 E + σ 之前完成约 84.1%。
## 甘特图
- 横道图：横轴时间、纵轴活动，**直观显示进度与时间安排**，便于检查进度；缺点是**不能清晰表达活动之间的依赖关系**，难以确定关键路径。
## 进度压缩
- **赶工**：增加资源（人员、加班）缩短关键活动工期，**增加成本**，只对增加资源能缩短工期的活动有效。
- **快速跟进**：把原本**顺序进行的活动改为部分并行**，**增加返工风险**。
## 其他
- **资源平衡**：根据资源约束调整开始与结束日期，**可能导致关键路径改变、工期延长**。
- **里程碑**：重要时间节点，**持续时间为 0**。
!! PERT 标准差是 (P−O)/6，不是 (P−O)/2；赶工加资源加成本，快速跟进加并行加风险。`,

{id:'m12-3',g:'项目管理',t:'范围、成本（挣值）、风险与质量管理',f:'中',sub:'WBS与范围基准、挣值管理PV/EV/AC/SV/CV/SPI/CPI、风险识别与定性定量分析、风险应对策略、质量规划/保证/控制、质量成本',
core:`## 范围管理
- **WBS（工作分解结构）**：把项目可交付成果分解为更小、更易管理的**工作包**；**100% 原则**；工作包是 WBS 最底层。
- **范围基准** = 范围说明书 + WBS + WBS 词典。范围蔓延需通过变更控制管理。
## 挣值管理
- **PV（计划价值）**：计划完成工作的预算；**EV（挣值）**：**实际完成工作**的预算价值；**AC（实际成本）**。
- **进度偏差 SV = EV − PV**（< 0 进度落后）；**成本偏差 CV = EV − AC**（< 0 超支）。
- **进度绩效指数 SPI = EV / PV**；**成本绩效指数 CPI = EV / AC**（< 1 表示落后/超支）。
- 完工估算：典型偏差 **EAC = BAC / CPI**；非典型偏差 EAC = AC + (BAC − EV)。
## 风险管理
- 过程：规划 → **识别**（头脑风暴、德尔菲、检查表、SWOT）→ **定性分析**（概率—影响矩阵）→ **定量分析**（**预期货币价值 EMV**、决策树、蒙特卡洛模拟、敏感性分析）→ 规划应对 → 实施应对 → 监督。
- 消极风险（威胁）应对：**规避、转移、减轻、接受**（主动接受设应急储备）；积极风险（机会）：开拓、分享、提高、接受。
## 质量管理
- **规划质量**（质量标准、成本效益分析、**质量成本**）、**管理质量（质量保证 QA，关注过程）**、**控制质量（QC，检查可交付成果）**。
- **质量成本**：**一致性成本**（预防成本——培训、流程；评估成本——测试、检查）+ **非一致性成本**（内部失败——返工；外部失败——召回、投诉）。
- 工具：因果图（鱼骨图）、**帕累托图（80/20，找主要问题）**、控制图、直方图、散点图、核对单。
!! EV 是"已完成工作的预算价值"；CV、SV 都用 EV 去减；CPI < 1 代表超支。`,

{id:'m12-4',g:'项目管理',t:'软件配置管理与文档管理',f:'中',sub:'配置项、基线、配置库（开发库/受控库/产品库）、配置管理活动、版本号规则、变更控制流程与CCB、配置审计（功能/物理）、软件文档分类',
core:`## 基本概念
- **配置项（CI）**：纳入配置管理的工作产品，如需求文档、设计文档、源代码、测试用例、可执行程序、用户手册。
- **基线**：经过**正式评审与批准**的一组配置项的版本，是后续工作的基础，**只能通过正式的变更控制改变**；如需求基线、设计基线、产品基线。
- **配置库**：**开发库（动态库）**——开发人员日常工作，自由修改；**受控库（主库）**——存放基线，修改需审批；**产品库（静态库）**——存放最终发布产品，不再修改。
## 配置管理活动
- **制定配置管理计划 → 配置标识 → 版本管理 → 变更控制 → 配置状态报告（记录）→ 配置审计 → 发布管理与交付**。
- 版本号：草稿期 0.YZ（0.10、0.11…），正式发布 X.Y（1.0），小改 Y+1，大改 X+1。
## 变更控制
- 流程：**提出变更申请 → 变更影响分析 → CCB 审批 → 实施变更 → 验证 → 更新基线并通知相关方**。
- **CCB（变更控制委员会）**：**决策机构**（不一定是常设机构，可以是一个人），批准或拒绝变更。
## 配置审计
- **功能配置审计**：验证配置项的**实际功能与性能**是否与需求一致；**物理配置审计**：验证配置项**是否完整**、与文档描述一致（版本、文件齐全）。
## 软件文档
- **开发文档**（需求、设计、测试计划）、**产品文档**（用户手册、安装手册）、**管理文档**（项目计划、进度报告、变更记录）。
!! 基线变更必须走正式变更控制；开发库自由改、受控库审批改、产品库不改。`,

{id:'m12-5',g:'知识产权与标准化',t:'著作权与计算机软件保护',f:'高',sub:'著作权人身权与财产权、保护期限、软件著作权产生与登记、职务作品、委托开发、合作开发、计算机软件保护条例、合理使用与侵权',
core:`## 著作权
- **自作品创作完成之日起自动产生**，无需登记（登记只是证明）；保护的是**表达形式**，**不保护思想、算法、操作方法、数学概念**。
- **人身权**：**署名权、修改权、保护作品完整权**——**保护期不受限制**；**发表权**——与财产权保护期相同。
- **财产权**：复制权、发行权、出租权、信息网络传播权、翻译权、改编权等。
## 保护期
- 自然人作品：**作者终生及其死亡后 50 年**（截至死亡后第 50 年 12 月 31 日）。
- 法人或非法人组织作品、职务作品（单位享有）：**首次发表后 50 年**；创作完成后 50 年内未发表的不再保护。
## 软件著作权（《计算机软件保护条例》）
- 保护**计算机程序及其文档**；**软件开发者**享有著作权。
- **职务作品**：针对本职工作明确规定的开发目标、从事本职工作的结果、**主要利用单位物质技术条件**并由单位承担责任 → 著作权**归单位**，开发者享有署名权（视情况）。离职后 **1 年内**与原工作相关的作品也属职务作品。
- **委托开发**：**有书面合同约定的按约定**；**无约定或约定不明的，归受托人（开发方）**。
- **合作开发**：有约定按约定；无约定、**可分割使用**的各自享有，不可分割的共同享有、协商行使。
- **国家机关下达任务**开发的软件，按项目任务书或合同约定；未约定的归接受任务的单位。
- 软件合法复制品所有人：可以**安装、为备份制作复制品**、为适应应用环境必要修改，**不得向他人提供**修改后的软件。
- 为学习研究软件设计思想而安装、显示、运行软件的，不构成侵权。
!! 署名权、修改权、保护作品完整权永久保护；委托开发无约定归受托方；著作权自动产生，无需登记。`,

{id:'m12-6',g:'知识产权与标准化',t:'专利权、商标权与商业秘密',f:'高',sub:'专利类型与保护期、授予条件、先申请原则、职务发明、商标保护期与续展、商标注册原则、商业秘密构成要件、反不正当竞争、知识产权地域性与时间性',
core:`## 专利权
- 类型与保护期（**自申请日起**计算）：**发明专利 20 年**、**实用新型 10 年**、**外观设计 15 年**（2021 年新专利法）。
- 授予条件：**新颖性、创造性、实用性**。不授予专利：科学发现、智力活动规则和方法、疾病诊断治疗方法等；**纯软件/算法本身不能申请专利**，但与硬件或技术方案结合解决技术问题的可以申请发明专利。
- **先申请原则**：两人分别就同样发明申请，授予**最先申请的人**；**同日申请**的，**协商**确定申请人，协商不成均驳回。
- 职务发明：申请专利的权利属于单位。
- 专利需**申请、审查、授权**才受保护；需缴年费，未缴年费提前终止。
## 商标权
- **注册商标有效期 10 年**，自**核准注册之日**起计算；期满前 12 个月内可**续展**，每次续展 **10 年**，**可无限续展**（宽展期 6 个月）。
- 原则：**申请在先**；同日申请的，**使用在先**者获得；都未使用或无法证明的，协商或抽签。
## 商业秘密
- 构成要件：**不为公众所知悉（秘密性）、具有商业价值、权利人采取了相应保密措施**。
- 保护期**不限**，只要保持秘密状态；通过《反不正当竞争法》保护。软件源代码、技术方案、客户名单都可作为商业秘密。
## 知识产权特点
- **无形性、专有性（独占性）、地域性、时间性**。
!! 专利"先申请"，商标"先申请，同日看先使用"；专利期限从申请日算，商标从核准注册日算。`,

{id:'m12-7',g:'知识产权与标准化',t:'标准化：标准分类、代号与软件工程标准',f:'中',sub:'标准层级（国家/行业/地方/团体/企业）、强制性与推荐性、标准代号、国际标准组织、标准复审周期、常用软件工程与信息技术标准',
core:`## 标准层级（我国）
- **国家标准**：代号 **GB（强制性）**、**GB/T（推荐性）**、GB/Z（国家标准化指导性技术文件）。
- **行业标准**：如 **SJ（电子）**、**JR（金融）**、**YD（通信）**、**JT（交通）**，推荐性加 /T。
- **地方标准**：**DB** + 行政区划代码，如 DB11（北京）。
- **团体标准**：**T/** + 团体代号。
- **企业标准**：**Q/** + 企业代号。
- 关系：**强制性标准必须执行**；国家标准优先；**没有国家标准时可制定行业标准**，行业标准在相应国家标准实施后**自行废止**；企业标准一般应**严于**国家或行业标准。
## 标准复审
- 标准实施后**复审周期一般不超过 5 年**，确定继续有效、修订或废止。
## 国际与国外标准
- **ISO**（国际标准化组织）、**IEC**（国际电工委员会）、**ITU**（国际电信联盟）、IEEE（行业协会）、ANSI（美国国家标准）、BS（英国）、DIN（德国）、JIS（日本）。
## 常用标准
- 软件生存周期过程 **GB/T 8566**（ISO/IEC 12207）；软件质量 **GB/T 25000**（ISO/IEC 25010 系列）；计算机软件文档编制规范 **GB/T 8567**；信息安全等级保护基本要求 **GB/T 22239**；数据管理能力成熟度 DCMM GB/T 36073。
!! 带 /T 是推荐性；企业标准代号以 Q 开头；标准复审周期一般不超过 5 年。`,

{id:'m12-8',g:'专业英语',t:'系统架构专业英语',f:'中',sub:'架构核心术语、质量属性英文、架构风格与模式英文、云原生与分布式术语、完形填空解题方法',
core:`## 核心术语
- **software architecture**（软件架构）、**component**（构件）、**connector**（连接件）、**configuration**（配置/拓扑）、**stakeholder**（利益相关者）、**view / viewpoint**（视图/视点）、**architecture description language, ADL**。
- **quality attribute**（质量属性）：**performance**（性能）、**availability**（可用性）、**modifiability**（可修改性）、**security**（安全性）、**testability**（可测试性）、**usability**（易用性）、**scalability**（可伸缩性）、**interoperability**（互操作性）、**reliability**（可靠性）。
- **trade-off**（权衡）、**sensitivity point**（敏感点）、**tradeoff point**（权衡点）、**risk**（风险）、**utility tree**（效用树）、**scenario**（场景）、**tactic**（战术）。
- 风格：**pipe-and-filter**（管道过滤器）、**layered**（分层）、**client-server**、**event-driven / implicit invocation**（事件驱动/隐式调用）、**repository / blackboard**（仓库/黑板）、**interpreter**（解释器）、**microkernel**（微内核）、**MVC**。
- 分布式与云：**microservice**、**service mesh**、**container**、**orchestration**（编排）、**serverless**、**eventual consistency**（最终一致性）、**fault tolerance**（容错）、**load balancing**、**circuit breaker**（熔断器）、**idempotent**（幂等）、**latency**（延迟）、**throughput**（吞吐量）。
- 其他：**requirement**、**legacy system**（遗留系统）、**refactoring**（重构）、**coupling / cohesion**（耦合/内聚）、**abstraction**、**encapsulation**、**middleware**、**deployment**。
## 完形填空解题方法
- 先通读全文把握主题（通常是架构风格、质量属性、云原生等）；根据**上下文搭配**与**专业概念**选择，而不是凭单词表面意思；注意 not、but、however 等转折。
!! 软考英语题是 5 空完形填空，考的是"专业概念 + 词汇"，懂概念往往比懂英语更重要。`,

core:`## 信创（信息技术应用创新）
- 目标：在关键领域实现 IT 基础设施、基础软件、应用软件的**自主可控、安全可靠**。
- 产业链：**基础硬件**（CPU、存储、服务器）→ **基础软件**（操作系统、数据库、中间件）→ **应用软件**（OA、ERP、行业应用）→ **信息安全**（密码、安全产品）。
## 国产 CPU 与指令集
- **x86 授权**：海光、兆芯——兼容 x86 生态，迁移成本最低。
- **ARM 授权**：华为鲲鹏、飞腾——生态较成熟，需重新编译。
- **自主指令集**：龙芯 **LoongArch**（由 MIPS 演进）、申威 **SW64**（源于 Alpha）。
## 基础软件
- 操作系统：**银河麒麟、统信 UOS、openEuler（欧拉）、OpenHarmony**。
- 数据库：**达梦 DM、人大金仓 KingbaseES、OceanBase、GaussDB、TiDB、PolarDB**。
- 中间件：东方通 TongWeb、金蝶 Apusic、宝兰德 BES。
## 迁移策略
- 评估（软硬件清单、依赖、兼容性）→ 选型与 POC → **适配改造**（重新编译、替换专有 API、SQL 方言与存储过程改写、字符集 GB 18030）→ 数据迁移（全量 + 增量 CDC，数据校验）→ **并行运行与灰度切换** → 回退预案 → 性能调优。
- 典型问题：**指令集差异**（需重新编译、第三方组件无对应版本）、**Oracle 专有特性**（PL/SQL、序列、分区语法）、**性能差距**、生态工具缺失、驱动与外设兼容。
!! x86 授权路线迁移最容易；数据库迁移的重难点是 SQL 与存储过程兼容性以及数据一致性校验。`,

{id:'m13-2',g:'信创与云计算',t:'云计算服务模式、部署模式与多租户架构',f:'高',sub:'云计算五大特征、IaaS/PaaS/SaaS责任划分、公有/私有/混合/社区云、虚拟化类型（全虚拟化/半虚拟化/硬件辅助/容器）、SaaS多租户数据隔离三种方案、云原生弹性',
core:`## 云计算特征（NIST）
- **按需自助服务、广泛的网络访问、资源池化、快速弹性伸缩、可度量的服务（按量计费）**。
## 服务模式
- **IaaS（基础设施即服务）**：提供虚拟机、存储、网络；用户管理**操作系统及以上**。例：云服务器 ECS、对象存储。
- **PaaS（平台即服务）**：提供运行环境、数据库、中间件、开发平台；用户只管理**应用与数据**。例：云数据库、容器平台、Serverless。
- **SaaS（软件即服务）**：直接提供应用；用户只使用与配置。例：在线办公、CRM、钉钉。
- 用户控制力 IaaS > PaaS > SaaS，运维负担同样递减。
## 部署模式
- **公有云**（第三方提供、多租户共享、成本低）、**私有云**（单一组织专用、安全可控、成本高）、**混合云**（私有 + 公有，敏感数据放私有云，弹性业务放公有云，"**云爆发**"）、**社区云**（若干有共同需求的组织共享，如政务云）。
## 虚拟化
- **全虚拟化**（Guest OS 无需修改，Hypervisor 二进制翻译）、**半虚拟化**（修改 Guest OS 配合 Hypervisor，性能好）、**硬件辅助虚拟化**（Intel VT-x、AMD-V）、**操作系统级虚拟化**（容器）。
- Hypervisor：**Type 1 裸金属型**（直接运行在硬件上，如 KVM、ESXi、Xen）、**Type 2 宿主型**（运行在宿主 OS 上，如 VirtualBox、VMware Workstation）。
## SaaS 多租户数据隔离
- **独立数据库**：隔离性最好、安全性最高，成本最高，适合大客户。
- **共享数据库、独立 Schema**：折中。
- **共享数据库、共享 Schema（表中加租户 ID 字段）**：成本最低、租户数量最多，隔离性最差，需在每次访问中强制过滤租户 ID。
!! IaaS 用户管理 OS，PaaS 用户只管应用，SaaS 用户只用；多租户"共享表 + TenantID"成本最低、隔离最弱。`,

{id:'m13-3',g:'大数据与人工智能',t:'大数据架构：Lambda、Kappa与湖仓一体',f:'高',sub:'大数据4V特征、Hadoop生态（HDFS/MapReduce/YARN/Hive/HBase）、Spark与Flink、批处理与流处理、Lambda三层架构、Kappa架构、数据仓库/数据湖/湖仓一体、数据中台',
core:`## 大数据特征
- **4V**：**Volume（大量）、Velocity（高速）、Variety（多样）、Value（价值密度低）**；有时加 Veracity（真实性）。
## Hadoop 生态
- **HDFS**：分布式文件系统，**NameNode**（元数据）+ **DataNode**（数据块，默认 3 副本），适合**大文件、一次写入多次读取**，不适合大量小文件与低延迟访问。
- **MapReduce**：批处理编程模型（Map → Shuffle → Reduce），中间结果落盘，速度较慢。
- **YARN**：资源管理与调度。**Hive**：基于 SQL 的数据仓库工具。**HBase**：列族数据库，海量数据随机实时读写。
- **Spark**：基于**内存**计算的批处理引擎（RDD/DataFrame），比 MapReduce 快；Spark Streaming 为**微批**。
- **Flink**：**真正的流处理**引擎，逐条处理、**事件时间**与窗口、**Exactly-once 状态一致性**，也支持批处理（流批一体）。
## Lambda 架构
- **批处理层（Batch Layer）**：对全量历史数据进行批处理，结果准确，但延迟高。
- **加速层（Speed Layer）**：对实时增量数据流处理，低延迟，结果近似。
- **服务层（Serving Layer）**：合并批视图与实时视图，对外提供查询。
- 优点：兼顾准确与实时、容错（批处理可重算）；缺点：**两套代码、两套系统维护**，逻辑需在批流两处实现并保持一致，复杂度高。
## Kappa 架构
- **去掉批处理层，只保留流处理**；所有数据进入可重放的消息日志（Kafka）；需要重新计算时**从日志重放**并启动新的流作业。
- 优点：一套代码、架构简单；缺点：依赖消息系统长期保存数据、重放大量历史数据耗时。
## 数据仓库、数据湖与湖仓一体
- **数据仓库**：结构化、**写时模式（Schema-on-Write）**、面向分析、主题化（ODS→DWD→DWS→ADS 分层）。
- **数据湖**：存储原始格式的结构化与非结构化数据，**读时模式（Schema-on-Read）**，低成本，但易成为"数据沼泽"。
- **湖仓一体（Lakehouse）**：在数据湖上提供事务、Schema 管理与高性能分析（Delta Lake、Iceberg、Hudi）。
- **数据中台**：沉淀统一的数据资产与数据服务，供各业务复用（OneData、OneService）。
!! Lambda 三层：批处理层、加速层、服务层；Kappa 只有流处理，靠日志重放替代批处理。`,

{id:'m13-4',g:'大数据与人工智能',t:'人工智能与大模型应用架构',f:'中',sub:'机器学习类型、模型生命周期与MLOps、大模型应用架构、提示工程、检索增强生成RAG流程、智能体Agent、向量数据库、大模型应用的质量属性与风险',
core:`## 机器学习基础
- **监督学习**（有标签：分类、回归）、**无监督学习**（无标签：聚类、降维）、**强化学习**（与环境交互获得奖励）；深度学习基于神经网络，Transformer 是大模型的基础结构。
## MLOps
- 把 DevOps 思想用于机器学习：**数据准备 → 特征工程 → 训练 → 评估 → 部署 → 监控（数据漂移、模型退化）→ 再训练**，强调**数据与模型版本管理、自动化流水线、可复现**。
## 大模型应用架构
- 分层：**基础设施层**（GPU 算力、推理加速）→ **模型层**（通用/行业大模型，可微调）→ **能力层**（提示工程、RAG、工具调用、Agent 编排）→ **应用层**（智能客服、代码助手、知识问答）。
- 定制方式：**提示工程**（成本最低）→ **RAG**（注入外部知识，知识可实时更新）→ **微调**（调整模型行为与领域风格，成本高）。
## 检索增强生成 RAG
- **离线**：文档**切分**（chunk）→ **向量化（Embedding）** → 存入**向量数据库**（Milvus、pgvector 等）。
- **在线**：用户问题向量化 → **相似度检索** Top-K 片段（可结合关键词检索与**重排序**）→ 把片段与问题拼入提示词 → 大模型生成答案并**给出引用**。
- 作用：**减少幻觉**、让模型使用**私有与最新知识**、答案可溯源，无需重新训练。
## 智能体 Agent
- 大模型作为"大脑"，具备**规划**（任务分解）、**记忆**（短期上下文、长期记忆）、**工具调用**（API、搜索、代码执行）、**反思**能力，循环"思考—行动—观察"完成复杂任务。
## 架构关注点
- 性能（首字延迟、吞吐，缓存与流式输出）、成本（Token 消耗、模型路由）、**安全**（提示注入、数据泄露、内容合规）、**可靠性**（幻觉、输出校验、人工兜底）、可观测性与评测。
!! RAG 不修改模型参数，通过检索外部知识增强生成；微调修改模型参数。`,

{id:'m13-5',g:'物联网、边缘计算与区块链',t:'物联网架构与边缘计算',f:'中',sub:'物联网三层/四层架构、感知层技术、网络层通信技术（NB-IoT/LoRa/ZigBee/5G）、物联网平台功能、设备影子、边缘计算定义与价值、云边协同、雾计算',
core:`## 物联网架构
- 三层：**感知层**（传感器、RFID、摄像头、执行器，负责**数据采集与控制**）→ **网络层**（负责**数据传输**：有线、Wi-Fi、蜂窝、LPWAN）→ **应用层**（行业应用）。
- 四层：在网络层与应用层之间增加**平台层**（设备接入与管理、数据存储分析、规则引擎、开放 API）。
## 通信技术
- 短距离：**ZigBee**（低功耗自组网）、**蓝牙 BLE**、Wi-Fi、RFID/NFC。
- 低功耗广域网 **LPWAN**：**NB-IoT**（运营商授权频段、深覆盖、低功耗，适合抄表）、**LoRa**（非授权频段、可自建网络）。
- **5G**：eMBB 大带宽、**URLLC 低时延高可靠**（车联网、工业控制）、**mMTC 海量连接**。
- 应用层协议：**MQTT**、CoAP（基于 UDP 的轻量 REST）、LwM2M。
## 物联网平台
- 设备接入与认证、**设备管理**（注册、OTA 升级、远程配置）、**设备影子**（在云端缓存设备最新状态，设备离线时应用仍可读取或下发期望状态，上线后同步）、规则引擎、数据存储（时序数据库）、可视化与开放 API。
## 边缘计算
- 在**靠近数据源的网络边缘**就近提供计算、存储与网络能力。
- 价值：**低时延**（实时控制）、**节省带宽**（本地预处理只上传结果）、**数据隐私**（敏感数据不出现场）、**离线自治**（断网继续运行）。
- **云边协同**：云端负责**模型训练、全局调度、大数据分析与集中管理**；边缘负责**实时推理、数据预处理、本地控制**；包括资源协同、数据协同、智能协同、应用管理协同。
- **雾计算**：介于云与端之间的分布式计算层，与边缘计算概念相近。
!! 感知层采集、网络层传输、应用层服务；边缘计算核心价值是低时延、省带宽、保隐私、离线自治。`,

{id:'m13-6',g:'物联网、边缘计算与区块链',t:'区块链技术与架构',f:'中',sub:'区块链特征、区块结构与哈希链、默克尔树、公有链/联盟链/私有链、共识机制（PoW/PoS/DPoS/PBFT/Raft）、智能合约、区块链架构分层与典型应用',
core:`## 区块链特征
- **去中心化（多中心）、不可篡改、可追溯、公开透明、集体维护**；本质是**分布式共享账本**。
## 数据结构
- 区块 = **区块头**（**前一区块哈希**、时间戳、**默克尔树根**、随机数 Nonce 等）+ **区块体**（交易列表）。
- 每个区块包含前一区块的哈希，形成**哈希链**：修改任一历史区块会使其后所有区块哈希失效，因此**难以篡改**。
- **默克尔树**：交易两两哈希逐层向上得到根哈希，可快速验证某笔交易是否包含在区块中（SPV 轻节点验证）。
## 类型
- **公有链**：任何人可参与（比特币、以太坊），完全去中心化，性能低。
- **联盟链**：由若干机构共同维护，**节点准入**，性能较高、可监管（**Hyperledger Fabric**、FISCO BCOS），**国内政务与金融应用主流**。
- **私有链**：单一机构内部使用。
## 共识机制
- **PoW 工作量证明**：算力竞争计算哈希，安全但**耗能大、确认慢**（比特币）。
- **PoS 权益证明**：按持有权益选择记账者，节能。**DPoS 委托权益证明**：选出代表节点记账，效率高。
- **PBFT 实用拜占庭容错**：可容忍 **f 个恶意节点，需要 n ≥ 3f + 1** 个节点，通信复杂度高，适合联盟链。
- **Raft**：只容忍崩溃故障（不防恶意），用于联盟链内部可信场景。
## 智能合约
- 部署在链上、满足条件**自动执行**的程序（以太坊 Solidity、Fabric 链码）；一旦部署难以修改，需重视安全审计。
## 架构分层
- **数据层**（区块、哈希、签名）→ **网络层**（P2P、传播、验证）→ **共识层** → **激励层**（公有链）→ **合约层** → **应用层**。
## 应用
- 供应链溯源、跨机构对账与清算、电子存证、数字身份、政务数据共享。
!! PBFT 需要 3f+1 个节点容忍 f 个拜占庭节点；联盟链有准入机制，是国内主流。`,

{id:'m13-7',g:'嵌入式系统',t:'嵌入式系统架构与实时操作系统',f:'高',sub:'嵌入式系统特点、硬实时与软实时、嵌入式软件分层（硬件/BSP/RTOS/中间件/应用）、RTOS特征与任务状态、抢占式调度、RMS与EDF可调度性判定、优先级反转与优先级继承/天花板协议、中断处理',
core:`## 嵌入式系统
- 以应用为中心、软硬件**可裁剪**，对**功能、可靠性、成本、体积、功耗**有严格要求的专用计算机系统。
- 特点：**专用性、实时性、资源受限、高可靠、软硬件协同、长生命周期**。
- 软件分层：**硬件层 → 硬件抽象层/板级支持包 BSP（驱动、启动代码）→ 操作系统层（RTOS）→ 中间件层（协议栈、文件系统、GUI）→ 应用层**。
## 实时系统
- 正确性不仅取决于结果，还取决于**结果产生的时间**。
- **硬实时**：错过截止时间会造成**严重后果**（安全气囊、飞控、刹车）；**软实时**：偶尔错过可容忍，性能下降（视频播放）。
## RTOS
- 特征：**基于优先级的抢占式调度**、**任务切换与中断响应时间确定（可预测）**、小内核、可裁剪。代表：**FreeRTOS、μC/OS、VxWorks、RT-Thread、QNX**、SylixOS。
- 任务状态：**就绪、运行、阻塞（等待）、挂起**。
- 任务间通信与同步：信号量、互斥量、消息队列、事件标志。
## 实时调度
- **单调速率调度 RMS**（静态优先级）：**周期越短优先级越高**；可调度充分条件 **U = ΣCᵢ/Tᵢ ≤ n(2^(1/n) − 1)**（n=2 时约 0.828，n=3 约 0.780，n→∞ 趋近 **ln2 ≈ 0.693**）。
- **最早截止时间优先 EDF**（动态优先级）：截止时间越早优先级越高；可调度充要条件 **U ≤ 1**。
## 优先级反转
- 高优先级任务 H 等待低优先级任务 L 持有的资源，而中优先级任务 M 抢占了 L，使 H 被 M 间接阻塞（火星探路者事件）。
- 解决：**优先级继承**（L 持有 H 需要的资源时，临时继承 H 的优先级）；**优先级天花板**（获得资源的任务优先级提升到可能使用该资源的最高任务优先级）。
## 中断
- 中断服务程序 ISR 应**短小**，不能调用可能阻塞的函数；耗时处理放到任务中（**中断下半部**/延迟处理）。
!! RMS 周期短优先级高，判定界 n(2^(1/n)−1)；EDF 判定界 1；优先级反转用优先级继承或天花板解决。`,
fig:[{k:'seq',t:'优先级反转与优先级继承（动态演示）',a:['低优先级 L','中优先级 M','高优先级 H','共享资源'],anim:true,dur:2400,m:[[0,3,'① L 获得互斥锁'],[2,3,'② H 就绪，请求锁被阻塞'],[1,0,'③ M 就绪，抢占 L 运行'],[2,2,'④ H 被 M 间接阻塞'],[0,0,'⑤ L 继承 H 的优先级'],[0,3,'⑥ L 快速用完资源并释放锁'],[3,2,'⑦ H 立即获得锁运行']],

 {k:'table',t:'RMS 可调度性判定演示',h:['任务','执行时间C','周期T','利用率C/T'],r:[['T1','1','4',''],['T2','2','6',''],['T3','1','10',''],['合计','','','']],dur:2400,

{id:'m13-8',g:'嵌入式系统',t:'汽车电子软件架构：AUTOSAR与功能安全',f:'中',sub:'AUTOSAR目标、Classic平台分层（应用层SWC/RTE/BSW/MCAL）、BSW服务层/ECU抽象层/微控制器抽象层/复杂驱动、VFB虚拟功能总线、Adaptive平台与SOA、ISO 26262功能安全与ASIL等级、航空DO-178C',
core:`## AUTOSAR（汽车开放系统架构）
- 目标：**软硬件解耦**、标准化接口、提高软件**复用与可移植性**，支持多供应商协作；"在标准上合作，在实现上竞争"。
## Classic Platform（CP，经典平台）
- 面向**传统 ECU**（MCU，硬实时、静态配置，基于 OSEK/VDX 操作系统）。
- 分层：
- **应用层**：**软件构件 SWC**（含端口与 Runnable）。
- **RTE（运行时环境）**：SWC 之间以及 SWC 与 BSW 之间通信的**中间层**，是 **VFB（虚拟功能总线）** 的具体实现，使 SWC 与 ECU 分配无关。
- **BSW（基础软件）**：**服务层**（OS、通信服务 COM、诊断 DCM/DEM、存储 NvM）、**ECU 抽象层**、**微控制器抽象层 MCAL**（直接访问 MCU 寄存器的驱动，如 ADC、PWM、CAN 驱动）、**复杂驱动 CDD**（时间要求严格、不符合标准分层的驱动，如电机 FOC、喷油控制）。
- 开发方法：**静态配置**，基于 ARXML 描述文件生成代码。
## Adaptive Platform（AP，自适应平台）
- 面向**高性能计算**（自动驾驶域控制器、智能座舱），运行在 **POSIX 操作系统**上，使用 C++，**面向服务架构（SOA）**，通信采用 **SOME/IP**、DDS，支持**动态部署与 OTA 升级**。
## 功能安全 ISO 26262
- 道路车辆功能安全标准；通过危害分析与风险评估（HARA）确定 **ASIL 等级：A、B、C、D（D 最高）**，QM 表示无安全要求。
- 由**严重度 S、暴露概率 E、可控性 C**三个因素确定。
- 相关：**ISO 21434** 汽车网络安全、SOTIF（预期功能安全 ISO 21448）。
## 其他行业
- 航空机载软件 **DO-178C**（软件等级 A~E，A 最高）；航空电子 ARINC 653 分区操作系统（时间与空间分区隔离）；工业 IEC 61508（SIL 1~4）；铁路 EN 50128。
!! RTE 实现 VFB，是 SWC 之间的"桥梁"；MCAL 直接操作 MCU 寄存器；CP 静态配置面向 MCU，AP 基于 POSIX 与 SOA 面向高性能计算。ASIL D 最高。`,

core:`## 中台架构
- **业务中台**：把多个业务线**共性的业务能力**（用户、商品、订单、支付、营销）沉淀为**可复用的共享服务**，前台业务快速组装创新——"**大中台、小前台**"。
- **数据中台**：统一采集、治理、建模数据，形成**数据资产**并以**数据服务（API）**方式提供给业务——OneData（统一数据标准）、OneID（统一实体识别）、OneService（统一数据服务）。
- 技术中台：微服务框架、DevOps、容器平台等通用技术能力。
- 价值：**能力复用、快速响应前台变化、数据打通**；风险：建设周期长、过度抽象、组织协同难、中台成为瓶颈。中台建设常基于 **DDD** 识别能力边界。
## 数字孪生
- 在虚拟空间中构建物理实体的**数字化镜像**，通过实时数据**双向映射、同步演化**，实现监测、仿真、预测与优化。
- 组成：**物理实体、虚拟模型、孪生数据、服务（应用）、连接**（五维模型）。
- 关键技术：物联网感知、建模与仿真（机理模型 + 数据模型）、三维可视化、大数据与 AI。
- 应用：智能制造（产线仿真、预测性维护）、智慧城市、智慧水务、能源电网。
## 工业互联网平台
- 架构：**边缘层**（设备接入、协议解析、边缘计算）→ **IaaS 层** → **工业 PaaS 层**（工业大数据、**工业机理模型**、微服务组件、低代码开发）→ **工业 SaaS 层（工业 APP）**。
- 三大体系：**网络是基础、平台是核心、安全是保障**；标识解析体系为物品赋予唯一身份。
## 智慧城市
- 感知层（城市物联网）→ 网络层 → 数据层（城市数据中台）→ 平台层（城市运营中心 IOC、"城市大脑"）→ 应用层（交通、政务、应急）；标准规范体系与安全保障体系贯穿。
!! 业务中台复用"业务能力"，数据中台复用"数据资产"；工业互联网的核心是平台，平台的核心是工业机理模型与 PaaS。`,

/* 答案位置均衡：解析中未按字母引用选项、且非升序数值选项的题目，将正确选项确定性地移到目标位置（干扰项相对顺序不变），
   避免正确答案集中在某一字母。题目数据本身不改动，新增题目同样适用。 */
(function(){var LET=/(^|[^A-Za-z0-9])[ABCD](?=[^A-Za-z0-9]|$)/,cnt=[0,0,0,0],free=[];
  function numAsc(o){var v=o.map(function(x){return parseFloat(String(x).replace(/[^\d.\-]/g,''))});return v.every(function(x){return !isNaN(x)})&&v.every(function(x,i){return !i||x>=v[i-1]})}
  ALLQ.forEach(function(k){var q=Q[k];if(LET.test(q.e)||LET.test(q.q)||numAsc(q.o))cnt[q.a]++;else free.push(k)});
  var tgt=Math.ceil(ALLQ.length/4),slots=[];for(var i=0;i<4;i++)for(var j=cnt[i];j<tgt;j++)slots.push(i);
  var seed=20261104;function rnd(){seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff}
  for(i=slots.length-1;i>0;i--){j=Math.floor(rnd()*(i+1));var t=slots[i];slots[i]=slots[j];slots[j]=t}
  free.forEach(function(k,n){var q=Q[k],to=slots[n%slots.length];if(to==null||to===q.a)return;var c=q.o[q.a],rest=q.o.filter(function(_,x){return x!==q.a});rest.splice(to,0,c);q.o=rest;q.a=to});
})();

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function il(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/==(.+?)==/g,'<mark>$1</mark>')}
function md(src){
  var L2=String(src||'').split('\n'),h='',ul=false;
  L2.forEach(function(l){l=l.trim();if(!l)return;
    if(l.indexOf('- ')===0){if(!ul){h+='<ul>';ul=true}h+='<li>'+il(l.slice(2))+'</li>';return}
    if(ul){h+='</ul>';ul=false}
    if(l.indexOf('## ')===0)h+='<h4>'+il(l.slice(3))+'</h4>';
    else if(l.indexOf('!! ')===0)h+='<div class="pit"><b>易错点</b>'+il(l.slice(3))+'</div>';
    else h+='<p>'+il(l)+'</p>';});
  if(ul)h+='</ul>';return h;}

  hub:function(f,id){var n=f.items.length,cx=170,cy=150,R=112,b='',nd='';f.items.forEach(function(it,i){var ang=-Math.PI/2+i*2*Math.PI/n,x=cx+R*Math.cos(ang),y=cy+R*0.92*Math.sin(ang);

  tree:function(f,id){var y=4,b='',rows=[],boxes='';f.items.forEach(function(it,i){var pr=String(it).split('|');var ls=wrap(pr[0],14).map(function(s){return[s,'s-t s-b']}).concat(pr[1]?wrap(pr[1],17).map(function(s){return[s,'s-ts']}):[]);

    rows.forEach(function(r2,i){b+='<g data-k="l'+i+'"><path d="M100 '+ry+' H114 V'+r2+' H128" class="s-ln"/></g>'});
    b+=boxes+'<rect x="4" y="'+(ry-rh)+'" width="96" height="'+(2*rh)+'" rx="9" class="s-f0 s-bx2"/>'+tl(52,ry,rt,'s-t s-b');return svgw(340,H+2,b,id)},
  quad:function(f,id){var b='',X=36,Y=6,W=298,H=250,w=W/2,h=H/2;f.cells.forEach(function(c,i){var cx=X+(i%2)*w,cy=Y+((i/2)|0)*h,pr=String(c).split('|');
    var ls=wrap(pr[0],9).map(function(s){return[s,'s-t s-b']}).concat(pr[1]?wrap(pr[1],11.5).map(function(s){return[s,'s-ts']}):[]);var tot=ls.reduce(function(s,l){return s+(l[1].indexOf('ts')>=0?15:17)},0);
    b+='<g data-k="i'+i+'"><rect x="'+(cx+3)+'" y="'+(cy+3)+'" width="'+(w-6)+'" height="'+(h-6)+'" rx="9" class="s-f'+(i+1)+' s-bx"/>'+stack(cx+w/2,cy+h/2-tot/2,ls)[0]+'</g>'});
    b+='<text x="'+(X+W/2)+'" y="'+(Y+H+18)+'" class="s-ts" text-anchor="middle">'+esc(f.x)+'</text><text x="14" y="'+(Y+H/2)+'" class="s-ts" text-anchor="middle" transform="rotate(-90 14 '+(Y+H/2)+')">'+esc(f.y)+'</text>';
    return svgw(340,Y+H+26,b,id)},
  graph:function(f,id){var b='',nd='',bw=f.bw||84,bh=f.bh||34;
    function clip(x,y,dx,dy){var sx=Math.abs(dx)>0.01?(bw/2+2)/Math.abs(dx):1e9,sy=Math.abs(dy)>0.01?(bh/2+2)/Math.abs(dy):1e9,s=Math.min(sx,sy);return[x+dx*s,y+dy*s]}
    f.e.forEach(function(e,ei){var a=f.n[e[0]],c=f.n[e[1]],dx=c[1]-a[1],dy=c[2]-a[2],len=Math.hypot(dx,dy)||1,off=e[3]||0,px=-dy/len,py=dx/len,ox=px*off,oy=py*off;
      var p1=clip(a[1]+ox,a[2]+oy,dx,dy),p2=clip(c[1]+ox,c[2]+oy,-dx,-dy);b+='<g data-k="e'+ei+'">'+line(p1[0],p1[1],p2[0],p2[1],f.noarrow?null:id);
      if(e[2]){var sg=off>0?1:-1,lx=(p1[0]+p2[0])/2+px*sg*12+(e[4]||0),ly=(p1[1]+p2[1])/2+py*sg*12+4+(e[5]||0);
        b+='<text x="'+lx.toFixed(1)+'" y="'+ly.toFixed(1)+'" class="s-ts s-lb" text-anchor="middle">'+esc(e[2])+'</text>'}b+='</g>'});
