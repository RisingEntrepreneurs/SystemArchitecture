  '<div class="shr"><span class="sub">筛选结果 '+f.length+' 题 / 错题本共 '+ids.length+' 题</span><button class="btn p sm" id="wr"'+(f.length?'':' disabled')+'>重做筛选结果</button></div><p class="sub" style="margin:8px 0 0">错题重做时答对即自动移出错题本。</p></div>'+
  (f.length?f.map(function(k){var q=Q[k],p=P[q.pid],a=S.ans[k]||{n:0,c:0};return '<div class="card wi"><div class="wq">'+il(q.q)+'</div><div class="wm"><span class="chip">'+TY[q.t]+'</span><a href="#/p/'+p.id+'">'+esc(p.no+' '+p.t)+'</a><span>作答 '+a.n+' 次 · 答对 '+a.c+' 次</span></div><div class="wb"><button class="btn sm" data-redo="'+k+'">重做</button><button class="btn sm" data-rmw="'+k+'">移出</button><button class="btn sm" data-fq="'+k+'">'+(S.favQ[k]?'★ 已收藏':'☆ 收藏')+'</button></div></div>'}).join(''):emptyH(ids.length?'当前筛选下没有错题':'暂无错题，继续保持！'))+
  (ids.length?'<button class="btn bad wide" id="wc">清空错题本</button>':'');
  $('#wm').onchange=function(){WF.m=this.value;V.wrong()};$('#wt').onchange=function(){WF.t=this.value;V.wrong()};
  if($('#wr'))$('#wr').onclick=function(){startRun(shuffle(f),'错题重做','wrong')};
  if($('#wc'))$('#wc').onclick=function(){ask('确定清空全部错题？',function(){S.wrong={};save();V.wrong()})}};

/* 收藏夹 */
V.fav=function(){setT('收藏夹');var ps=Object.keys(S.favP).filter(function(k){return P[k]}),qs=Object.keys(S.favQ).filter(function(k){return Q[k]});
  var h='<div class="seg"><a href="javascript:void 0" data-ft="p" class="'+(FT==='p'?'on':'')+'">知识点（'+ps.length+'）</a><a href="javascript:void 0" data-ft="q" class="'+(FT==='q'?'on':'')+'">题目（'+qs.length+'）</a></div>';
  if(FT==='p')h+=ps.length?'<div class="card">'+ps.map(function(id){var p=P[id];return '<a class="row" href="#/p/'+id+'"><div class="rt"><span class="no">'+p.no+'</span>'+esc(p.t)+'</div><div class="rc">'+fqChip(p.f)+stChip(id)+'</div></a>'}).join('')+'</div>':emptyH('还没有收藏知识点，在知识点页底部点击"加入收藏"');
  else h+=qs.length?'<button class="btn p wide" id="fr" style="margin:0 0 12px">练习全部收藏题（'+qs.length+'）</button>'+qs.map(function(k){var q=Q[k],p=P[q.pid];return '<div class="card wi"><div class="wq">'+il(q.q)+'</div><div class="wm"><span class="chip">'+TY[q.t]+'</span><a href="#/p/'+p.id+'">'+esc(p.no+' '+p.t)+'</a></div><div class="wb"><button class="btn sm" data-redo="'+k+'">练习</button><button class="btn sm" data-unfq="'+k+'">取消收藏</button></div></div>'}).join(''):emptyH('还没有收藏题目，在题目右上角点击"收藏"');
  app.innerHTML=h;app.querySelectorAll('[data-ft]').forEach(function(a){a.onclick=function(){FT=a.dataset.ft;V.fav()}});
  if($('#fr'))$('#fr').onclick=function(){startRun(qs.slice(),'收藏题练习')}};

/* 学习统计 */
V.stat=function(){setT('学习统计');var tot=ORDER.length,learn=0,mast=0;ORDER.forEach(function(id){if(stOf(id)>=1)learn++;if(stOf(id)===2)mast++});
  var att=0,cor=0;Object.keys(S.ans).forEach(function(k){att+=S.ans[k].n;cor+=S.ans[k].c});var done=Object.keys(S.ans).filter(function(k){return Q[k]}).length;
  var h='<div class="card"><div class="kpi"><div><b>'+learn+'/'+tot+'</b><span>已学习知识点</span></div><div><b>'+mast+'</b><span>已掌握</span></div><div><b>'+done+'/'+ALLQ.length+'</b><span>已做题目</span></div><div><b>'+(att?Math.round(cor/att*100)+'%':'—')+'</b><span>总正确率（'+att+'题次）</span></div></div></div>';
  h+='<div class="card bars"><h3 class="sh">模块进度与正确率</h3>'+M.map(function(m){var ids=[],ms=0;m.points.forEach(function(p){ids=ids.concat(p.qids);if(stOf(p.id)===2)ms++});var a=accOf(ids),dn=ids.filter(function(k){return S.ans[k]}).length;
    return '<div class="br"><div class="bl"><span>'+m.no+' '+esc(m.t)+'</span><span>掌握 '+ms+'/'+m.points.length+' · 做题 '+dn+'/'+ids.length+' · 正确率 '+(a==null?'—':a+'%')+'</span></div><div class="pb"><i style="width:'+(ms/m.points.length*100)+'%"></i></div><div class="pb a"><i style="width:'+(a||0)+'%"></i></div></div>'}).join('')+'<p class="sub">上条：知识点掌握度；下条：答题正确率</p></div>';
  h+='<div class="card bars"><h3 class="sh">题型正确率</h3>'+Object.keys(TY).map(function(t){var ids=ALLQ.filter(function(k){return Q[k].t===t}),a=accOf(ids);return '<div class="br"><div class="bl"><span>'+TY[t]+'（'+ids.length+'题）</span><span>'+(a==null?'未作答':a+'%')+'</span></div><div class="pb a"><i style="width:'+(a||0)+'%"></i></div></div>'}).join('')+'</div>';
  h+='<div class="card"><h3 class="sh">进度备份与迁移</h3><p class="sub">导出后复制文本保存；在另一台设备粘贴并导入即可恢复进度。</p><textarea class="ta" id="bk" placeholder="导出的进度数据会显示在这里"></textarea>'+
    '<div class="acts"><button class="btn" id="bx">导出进度</button><button class="btn" id="bi">导入进度</button><button class="btn bad" id="br">重置全部</button></div></div>';
  app.innerHTML=h;
  $('#bx').onclick=function(){var t=$('#bk');t.value=JSON.stringify(S);t.focus();t.select();try{document.execCommand('copy');toast('已导出并尝试复制到剪贴板')}catch(e){toast('已导出，请手动复制')}};
  $('#bi').onclick=function(){try{var o=JSON.parse($('#bk').value);if(!o||typeof o!=='object'||!o.st)throw 0;Object.keys(S).forEach(function(k){if(o[k]!=null)S[k]=o[k]});saveNow();applyPrefs();toast('导入成功');V.stat()}catch(e){toast('数据格式不正确')}};
  $('#br').onclick=function(){ask('将清空全部学习进度、错题、收藏与考试记录，确定吗？',function(){var th=S.theme,fs=S.fs;S={st:{},ans:{},wrong:{},favP:{},favQ:{},cases:{},exams:[],last:null,theme:th,fs:fs,auto:true};saveNow();V.stat();toast('已重置')})}};

/* 搜索 */
V.search=function(q){setT('搜索知识点与题目');app.innerHTML='<div class="card"><input id="sq" type="search" placeholder="输入关键词，如 PV操作、ATAM、范式、RAID" value="'+esc(q||'')+'"></div><div id="sr"></div>';
  var inp=$('#sq'),t=null;inp.addEventListener('input',function(){clearTimeout(t);t=setTimeout(function(){doSearch(inp.value)},180)});if(q)doSearch(q);else setTimeout(function(){inp.focus()},60)};
function doSearch(k){k=String(k||'').trim().toLowerCase();var sr=$('#sr');if(!k){sr.innerHTML='';return}
  var ps=ORDER.map(function(id){return P[id]}).filter(function(p){return(p.t+(p.sub||'')+(p.core||'')).toLowerCase().indexOf(k)>=0});
  var qs=ALLQ.filter(function(id){var q=Q[id];return(q.q+q.o.join(' ')+q.e).toLowerCase().indexOf(k)>=0});
  sr.innerHTML='<div class="card"><h3 class="sh">知识点（'+ps.length+'）</h3>'+(ps.length?ps.map(function(p){return '<a class="row" href="#/p/'+p.id+'"><div class="rt"><span class="no">'+p.no+'</span>'+esc(p.t)+'</div><div class="rs">'+esc(p.sub||'')+'</div></a>'}).join(''):'<p class="sub">无匹配知识点</p>')+'</div>'+
  '<div class="card"><div class="shr"><h3 class="sh">题目（'+qs.length+'）</h3>'+(qs.length?'<button class="btn sm" id="srun">练习这些题</button>':'')+'</div>'+qs.slice(0,40).map(function(id){var q=Q[id],p=P[q.pid];return '<div class="row"><div class="wq">'+il(q.q)+'</div><div class="rs"><a href="#/p/'+p.id+'">'+esc(p.no+' '+p.t)+'</a> · '+TY[q.t]+'</div></div>'}).join('')+(qs.length>40?'<p class="sub">仅显示前 40 题，可点击"练习这些题"全部练习</p>':'')+'</div>';
  if($('#srun'))$('#srun').onclick=function(){startRun(qs,'搜索结果练习：'+k)}}

/* ---------- 4.6 全局事件委托 ---------- */
document.addEventListener('click',function(e){var t=e.target;
  var op=t.closest('.op');if(op){var card=op.closest('.q');if(card.classList.contains('exam'))examPick(card,+op.dataset.i);else answer(card,+op.dataset.i);return}
  var fq=t.closest('[data-fq]');if(fq){var id=fq.dataset.fq;if(S.favQ[id])delete S.favQ[id];else S.favQ[id]=Date.now();save();fq.textContent=S.favQ[id]?'★ 已收藏':'☆ 收藏';return}
  var uf=t.closest('[data-unfq]');if(uf){delete S.favQ[uf.dataset.unfq];save();V.fav();return}
  var rm=t.closest('[data-run-m]');if(rm){var m=SA.mmap[rm.dataset.runM],l=[];m.points.forEach(function(p){l=l.concat(p.qids)});startRun(shuffle(l),'模块'+m.no+' '+m.t);return}
  var rp=t.closest('[data-run-p]');if(rp){var p=P[rp.dataset.runP];startRun(p.qids.slice(),p.no+' '+p.t);return}
  var rd=t.closest('[data-redo]');if(rd){var k=rd.dataset.redo;startRun([k],'单题重做',S.wrong[k]?'wrong':'prac');return}
  var rw=t.closest('[data-rmw]');if(rw){delete S.wrong[rw.dataset.rmw];save();V.wrong();toast('已移出错题本');return}
  var sa=t.closest('[data-showans]');if(sa){var a=sa.nextElementSibling;a.hidden=!a.hidden;sa.textContent=a.hidden?'查看参考答案':'收起参考答案';return}
});
document.addEventListener('input',function(e){var t=e.target;if(t.dataset&&t.dataset.case){S.cases[t.dataset.case]=t.value;save()}});

/* ---------- 4.7 路由、导航与偏好 ---------- */
var IC={home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',ch:'<path d="M4 5h6a2 2 0 0 1 2 2v13a2 2 0 0 0-2-2H4zM20 5h-6a2 2 0 0 0-2 2v13a2 2 0 0 1 2-2h6z"/>',
  prac:'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/>',wrong:'<circle cx="12" cy="12" r="8.5"/><path d="M9 9l6 6M15 9l-6 6"/>',stat:'<path d="M5 20V11M12 20V5M19 20v-7"/>'};
var NAV=[['home','首页'],['ch','目录'],['prac','刷题'],['wrong','错题'],['stat','统计']];
var PARENT={p:'ch',run:'prac',exam:'prac',fav:'home',search:'home'};
$('#bn').innerHTML=NAV.map(function(n){return '<a href="#/'+n[0]+'" data-nav="'+n[0]+'"><svg viewBox="0 0 24 24">'+IC[n[0]]+'</svg>'+n[1]+'</a>'}).join('');
$('#tabs').innerHTML=NAV.map(function(n){return '<a href="#/'+n[0]+'" data-nav="'+n[0]+'">'+n[1]+'</a>'}).join('');
var navCount=0;
function setNav(v){var k=NAV.some(function(n){return n[0]===v})?v:(PARENT[v]||'home');document.querySelectorAll('[data-nav]').forEach(function(a){a.classList.toggle('on',a.dataset.nav===k)});$('#back').style.visibility=v==='home'?'hidden':'visible'}
function route(){var h=location.hash.replace(/^#\/?/,'')||'home',parts=h.split('/'),v=parts[0],arg=decodeURIComponent(parts.slice(1).join('/'));
  if(!V[v])v='home';clearTimeout(runTimer);try{V[v](arg)}catch(err){app.innerHTML=emptyH('页面出错：'+esc(err.message));console.error(err)}setNav(v);if(v!=='run')window.scrollTo(0,0)}
window.addEventListener('hashchange',function(){navCount++;route()});
$('#back').onclick=function(){if(navCount>0)history.back();else{var v=(location.hash.replace(/^#\/?/,'').split('/')[0])||'home';go('/'+(PARENT[v]||'home'))}};
$('#bsearch').onclick=function(){go('/search')};
function isDark(){return S.theme==='dark'||(S.theme==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)}
function applyPrefs(){var r=document.documentElement;if(S.theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',S.theme);r.style.setProperty('--fs',S.fs)}
$('#btheme').onclick=function(){S.theme=isDark()?'light':'dark';applyPrefs();save();toast(S.theme==='dark'?'已切换夜间模式':'已切换日间模式')};
var FSS=[0.9,1,1.1,1.2,1.32];
$('#bfont').onclick=function(){var i=FSS.indexOf(S.fs);S.fs=FSS[(i+1)%FSS.length];applyPrefs();save();toast('字号 '+Math.round(S.fs*100)+'%')};
applyPrefs();route();
})();
</script>
<script>if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}</script>
