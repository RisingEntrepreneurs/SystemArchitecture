<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>系统架构设计师全考点学习刷题系统</title>
<!--
  ================================================================
  系统架构设计师 · 全考点学习刷题系统（单文件离线版）
  结构：
    1) <style>         全局样式（日/夜间主题 token、移动端优先、PC 自适应）
    2) <script#core>   SA 核心：数据注册与扩展接口（SA.register / addPoint / addQuestions）
    3) <script#data>   13 个模块的知识点与题库数据（可在此追加）
    4) <script#ui>     界面：路由、存储、图解渲染、学习/刷题/模考/错题/收藏/统计/搜索
  所有数据保存在浏览器 localStorage（键名 sa_study_v1），无任何外部资源。
  ================================================================
-->
<style>
/* ===================== 1. 主题与基础样式 ===================== */
:root{--fs:1;
 --bg:#f3f1eb;--card:#fffdf8;--tx:#2a2e32;--sub:#6c7177;--line:#e2ded3;
 --pri:#3d6b74;--pri2:#e2ebea;--on:#ffffff;--ok:#4c7a57;--ok2:#e4eee2;--bad:#a2544c;--bad2:#f4e3df;
 --warn:#94742f;--warn2:#f7efd9;--mk:#f5e8bd;
 --f0:#e2ebea;--f1:#efe8d8;--f2:#e5e9f1;--f3:#f1e5e2;--f4:#e3ecdf;--dl:#7b8a8c;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
 --bg:#181b1e;--card:#212529;--tx:#dbd7cf;--sub:#979ca2;--line:#343a3f;
 --pri:#86adb4;--pri2:#29363a;--on:#14191b;--ok:#8db694;--ok2:#22322a;--bad:#d4938a;--bad2:#3b2826;
 --warn:#cdb06c;--warn2:#373122;--mk:#4a4127;
 --f0:#29363a;--f1:#38332a;--f2:#2a303a;--f3:#3a2e2d;--f4:#2b3529;--dl:#82918f;color-scheme:dark}}
:root[data-theme=dark]{
 --bg:#181b1e;--card:#212529;--tx:#dbd7cf;--sub:#979ca2;--line:#343a3f;
 --pri:#86adb4;--pri2:#29363a;--on:#14191b;--ok:#8db694;--ok2:#22322a;--bad:#d4938a;--bad2:#3b2826;
 --warn:#cdb06c;--warn2:#373122;--mk:#4a4127;
 --f0:#29363a;--f1:#38332a;--f2:#2a303a;--f3:#3a2e2d;--f4:#2b3529;--dl:#82918f;color-scheme:dark}
*{box-sizing:border-box}
html{font-size:calc(16px * var(--fs));-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);line-height:1.72;
 font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
 -webkit-tap-highlight-color:transparent}
a{color:var(--pri)}
button,select,input,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{line-height:1.35;margin:0}
/* 顶栏 */
header.top{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.bar{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:6px;padding:6px 12px;min-height:52px}
.bar .ttl{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:1rem}
.ib{min-width:40px;height:40px;border:1px solid var(--line);background:var(--bg);border-radius:10px;display:inline-flex;align-items:center;justify-content:center;padding:0 8px;cursor:pointer;font-size:.9rem}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs{display:none;gap:4px;margin-right:8px}
.tabs a{padding:8px 12px;border-radius:9px;text-decoration:none;color:var(--sub);font-size:.92rem}
.tabs a.on{background:var(--pri2);color:var(--pri);font-weight:600}
/* 底部导航（移动端） */
nav.bn{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.bn a{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 0 5px;text-decoration:none;color:var(--sub);font-size:.72rem}
nav.bn a svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.bn a.on{color:var(--pri);font-weight:600}
main{max-width:960px;margin:0 auto;padding:14px 14px calc(86px + env(safe-area-inset-bottom))}
@media (min-width:900px){nav.bn{display:none}.tabs{display:flex}main{padding:20px 20px 60px}}
/* 卡片与按钮 */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 12px}
.btn{min-height:44px;padding:0 16px;border-radius:11px;border:1px solid var(--line);background:var(--card);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:4px;text-decoration:none;color:var(--tx);font-size:.95rem}
.btn.p{background:var(--pri);border-color:var(--pri);color:var(--on);font-weight:600}
.btn.ok{background:var(--ok2);border-color:var(--ok);color:var(--ok);font-weight:600}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:36px;padding:0 12px;font-size:.85rem}
.btn.wide{width:100%;margin-top:10px}
.btn[disabled]{opacity:.45;pointer-events:none}
.sub{color:var(--sub);font-size:.85rem}
.tip{color:var(--sub);font-size:.85rem;margin:0 2px 10px}
.empty{text-align:center;color:var(--sub);padding:36px 10px}
.chip{display:inline-block;font-size:.72rem;line-height:1.6;padding:0 8px;border-radius:99px;border:1px solid var(--line);color:var(--sub);white-space:nowrap}
.fq-高{color:var(--bad);border-color:var(--bad);background:var(--bad2)}
.fq-中{color:var(--warn);border-color:var(--warn);background:var(--warn2)}
.fq-低{color:var(--ok);border-color:var(--ok);background:var(--ok2)}
.st0{}.st1{color:var(--pri);border-color:var(--pri);background:var(--pri2)}.st2{color:var(--ok);border-color:var(--ok);background:var(--ok2)}
.pb{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin:10px 0 4px}
.pb i{display:block;height:100%;background:var(--pri);border-radius:9px}
.shr{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.sh{font-size:1.02rem;margin:2px 0 10px;padding-left:9px;border-left:4px solid var(--pri)}
/* 首页 */
.hero h1{font-size:1.32rem;margin:2px 0 0}
.hk{color:var(--pri);font-size:.82rem;font-weight:600;letter-spacing:.5px}
.kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.kpi div{background:var(--bg);border-radius:11px;padding:9px 10px;text-align:center}
.kpi b{display:block;font-size:1.25rem}.kpi b.red{color:var(--bad)}
.kpi span{font-size:.75rem;color:var(--sub)}
@media (min-width:640px){.kpi{grid-template-columns:repeat(4,1fr)}}
.entry{display:grid;gap:10px;grid-template-columns:1fr;margin-bottom:12px}
@media (min-width:640px){.entry{grid-template-columns:repeat(3,1fr)}}
.en{display:flex;gap:12px;align-items:center;text-decoration:none;color:var(--tx);margin:0}
.en h3{font-size:1.02rem}.en p{margin:2px 0 0;font-size:.8rem;color:var(--sub)}
.ei{flex:0 0 46px;height:46px;border-radius:12px;background:var(--pri2);color:var(--pri);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.1rem}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini a{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center;text-decoration:none;color:var(--tx);font-size:.86rem}
.mini a b{display:block;font-size:1.05rem;color:var(--pri)}
/* 目录 */
details.mod>summary{list-style:none;display:flex;align-items:center;gap:8px;cursor:pointer;min-height:40px}
details.mod>summary::-webkit-details-marker{display:none}
details.mod>summary::after{content:"›";color:var(--sub);font-size:1.3rem;transition:transform .15s}
details.mod[open]>summary::after{transform:rotate(90deg)}
.mn{font-size:.75rem;color:var(--pri);background:var(--pri2);border-radius:7px;padding:1px 7px;white-space:nowrap}
.mt{flex:1;font-weight:600}.mp{font-size:.8rem;color:var(--sub)}
.grp{font-size:.8rem;font-weight:700;color:var(--pri);padding:12px 2px 4px;border-top:1px solid var(--line);letter-spacing:.5px}
.grp+.row{border-top:0}
.row{display:block;text-decoration:none;color:var(--tx);border-top:1px solid var(--line);padding:10px 2px}
.row:first-child{border-top:0}
.rt{font-weight:600;font-size:.95rem}.rt .no{color:var(--pri);margin-right:6px}
.rs{font-size:.78rem;color:var(--sub);margin:1px 0 4px}
.rc{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.qc{font-size:.75rem;color:var(--sub)}
.pl{margin-top:6px}
.mb{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
/* 知识点详情 */
.bc{font-size:.8rem;color:var(--sub)}.ph h2{font-size:1.2rem;margin:4px 0 8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.subk{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.subk span{font-size:.76rem;background:var(--bg);border-radius:7px;padding:2px 8px;color:var(--sub)}
.core p{margin:6px 0}.core ul{margin:4px 0 8px;padding-left:1.25em}.core li{margin:4px 0}
.core h4{font-size:.95rem;margin:12px 0 4px;color:var(--pri)}
.core b,.ex b,.ans b{color:var(--tx);font-weight:650}
mark{background:var(--mk);color:inherit;padding:0 2px;border-radius:3px}
.pit{background:var(--bad2);border-left:4px solid var(--bad);border-radius:8px;padding:8px 12px;margin:10px 0;font-size:.92rem}
.pit>b:first-child{color:var(--bad);margin-right:6px}
.fig{margin:10px 0 14px;background:var(--bg);border-radius:12px;padding:10px}
.fig figcaption{font-size:.82rem;color:var(--sub);margin-bottom:6px;font-weight:600}
.fig svg{display:block;width:100%;height:auto;max-width:560px;margin:0 auto}
.tbw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tb{width:100%;border-collapse:collapse;font-size:.84rem;background:var(--card)}
.tb th,.tb td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
.tb th{background:var(--pri2);color:var(--pri);white-space:nowrap}
/* SVG 图解统一配色 */
.s-f0{fill:var(--f0)}.s-f1{fill:var(--f1)}.s-f2{fill:var(--f2)}.s-f3{fill:var(--f3)}.s-f4{fill:var(--f4)}
.s-bx{stroke:var(--dl);stroke-width:1}.s-bx2{stroke:var(--pri);stroke-width:1.6}
.s-ln{stroke:var(--dl);stroke-width:1.3;fill:none}.s-da{stroke-dasharray:4 4}
.s-ar{fill:var(--dl)}
.s-t{fill:var(--tx);font-size:13px}.s-b{font-weight:600}.s-sm{font-size:11.5px}
.s-ts{fill:var(--sub);font-size:11px}
.s-lb{paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
/* 选择题 */
.q{border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 12px;background:var(--card)}
.qh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.qh .sp{flex:1}.qno{font-size:.8rem;color:var(--sub)}
.lk{border:0;background:none;color:var(--sub);font-size:.8rem;cursor:pointer;padding:4px 2px;min-height:32px}
.qt{font-weight:600;margin-bottom:6px}
.op{display:block;width:100%;text-align:left;padding:10px 12px;margin:7px 0;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer;line-height:1.55;font-size:.95rem;color:var(--tx)}
.op.ok{background:var(--ok2);border-color:var(--ok)}
.op.no{background:var(--bad2);border-color:var(--bad)}
.op.dim{opacity:.7}
.op.sel{background:var(--pri2);border-color:var(--pri);font-weight:600}
.ex{margin-top:8px;background:var(--warn2);border-radius:10px;padding:9px 12px;font-size:.9rem}
.ex p{margin:4px 0}
.rsl{font-weight:700;margin-bottom:2px}.rsl.g{color:var(--ok)}.rsl.r{color:var(--bad)}
/* 案例 / 论文 */
.cbg{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:.93rem}
.cbg p{margin:4px 0}
.cq{padding-left:1.3em;margin:10px 0}.cq li{margin:6px 0;font-weight:600}
.ta{width:100%;min-height:120px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);margin:6px 0 10px;font-size:16px;resize:vertical}
.ans{margin-top:10px}.ai,.key{background:var(--ok2);border-radius:10px;padding:9px 12px;margin:8px 0;font-size:.92rem}
.key{background:var(--warn2)}.ai p,.key p{margin:4px 0}
details.es>summary{cursor:pointer;color:var(--pri);font-weight:600;min-height:40px;display:flex;align-items:center}
details.es h4{font-size:.92rem;margin:12px 0 4px;color:var(--pri)}
details.es p,details.es ul{margin:4px 0}
/* 底部操作栏 */
.acts{display:flex;gap:8px;margin:12px 0}.acts .btn{flex:1;padding:0 8px}
.src{font-size:.82rem;color:var(--sub);margin:-4px 2px 6px}
/* 刷题 / 考试 */
.rh .rt2{font-weight:600}
.rinfo{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.84rem;color:var(--sub);align-items:center}
.sw{display:inline-flex;align-items:center;gap:4px;margin-left:auto}
.sw input{width:18px;height:18px}
.tm b{color:var(--bad);font-variant-numeric:tabular-nums}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin-bottom:6px}
.sc{height:38px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:.82rem;cursor:pointer}
.sc.a{background:var(--pri2);border-color:var(--pri);color:var(--pri)}.sc.c{outline:2px solid var(--warn)}
.sc.g{background:var(--ok2);border-color:var(--ok)}.sc.r{background:var(--bad2);border-color:var(--bad)}
.score{text-align:center;padding:10px 0}.score b{font-size:2.4rem;display:block}
/* 表单 */
.fg{margin:6px 0 14px}.fg>label.t{display:block;font-weight:600;font-size:.9rem;margin-bottom:6px}
.cks{display:flex;flex-wrap:wrap;gap:6px}
.ck{display:inline-flex;align-items:center}
.ck input{position:absolute;opacity:0;pointer-events:none}
.ck span{border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:.82rem;cursor:pointer;background:var(--bg)}
.ck input:checked+span{background:var(--pri2);border-color:var(--pri);color:var(--pri);font-weight:600}
select,input[type=search],input[type=text]{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 10px;font-size:16px}
.flt{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.wi .wq{font-weight:600;font-size:.93rem}
.wi .wm{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:.78rem;color:var(--sub);margin:6px 0;align-items:center}
.wi .wb{display:flex;gap:8px}
.bars .br{margin:8px 0}.bars .bl{display:flex;justify-content:space-between;font-size:.82rem}
.bars .pb{margin:3px 0}.bars .pb.a i{background:var(--ok)}
.seg{display:flex;gap:6px;margin-bottom:12px}.seg a{flex:1;text-align:center;padding:8px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--sub);background:var(--card)}
.seg a.on{color:var(--pri);border-color:var(--pri);background:var(--pri2);font-weight:600}
button,a,[data-fq],[data-redo],[data-rmw],summary,.ck span{cursor:pointer;touch-action:manipulation}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:var(--card);border-radius:14px;padding:16px;max-width:360px;width:100%}.dlg p{margin:0 0 4px}
.anim figcaption{display:flex;align-items:center;gap:8px}
.adyn{font-size:.68rem;font-weight:700;color:var(--on);background:var(--pri);border-radius:6px;padding:0 6px;line-height:1.6}
.apb{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin:8px 0 6px}.apb i{display:block;height:100%;width:0;background:var(--pri);transition:width .4s}
.acap{font-size:.86rem;min-height:3.2em;background:var(--card);border-radius:9px;padding:7px 10px;line-height:1.6}
.acap b{color:var(--pri)}
.actl{display:flex;gap:6px;margin-top:8px}.actl .btn{flex:1;padding:0 4px}
.anim [data-k]{transition:opacity .35s}
.anim .a-off{opacity:.1}
.anim g.a-hl rect{stroke:var(--pri);stroke-width:2.6}
.anim g.a-hl .s-ln{stroke:var(--pri);stroke-width:2.3;stroke-dasharray:7 4;animation:adash .7s linear infinite}
.anim g.a-hl .s-ts{fill:var(--tx);font-weight:600}
.anim tr.a-hl td,.anim td.a-hl{background:var(--mk);font-weight:700}
@keyframes adash{to{stroke-dashoffset:-22}}
@media (prefers-reduced-motion:reduce){.anim g.a-hl .s-ln{animation:none}}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:.86rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:86vw;text-align:center}
#toast.on{opacity:.94}
</style>

<!-- ===================== 2. SA 核心：数据注册与扩展接口 ===================== -->
<script id="core">
/*
 * 【扩展接口说明】
 * SA.register(module)            注册一个模块：{id:'m14', t:'模块名称', points:[知识点...]}
 *                                若 id 已存在，则把 points 追加到该模块
 * SA.addPoint(moduleId, point)   向已有模块追加一个知识点
 * SA.addQuestions(pointId, [...])向已有知识点追加选择题
 *
 * 知识点 point 结构：
 * { id:'m1-9', g:'二级主题（可选，目录中分组显示）', t:'标题', f:'高'|'中'|'低', sub:'三级要点1、三级要点2',
 *   core:`正文（轻量标记：每行一段；"- "开头为列表；"## "小标题；"!! "易错点；**粗体**；==高亮==）`,
 *   fig:[ 图解对象... ],
 *   mcq:[ [题型, 题干, [A,B,C,D], 正确选项下标0-3, 解析] ... ],
 *        题型取值：'识'概念识记 '辨'原理辨析 '算'数值计算 '景'场景应用 '比'易混对比 '真'真题变形
 *   cs:{bg:'背景', qs:[['问题','参考答案'],...], key:'得分要点'},
 *   es:{dir:'出题方向', frame:'写作框架', pts:'核心论点', scene:'项目场景'} }
 *
 * 图解对象 fig（全部渲染为内嵌 SVG / 表格）：
 *  {k:'layers',t,items:[[名称,说明],...]}          分层图
 *  {k:'flow',t,items:['标题|说明',...],loop:bool}  纵向流程图（可回环）
 *  {k:'seq',t,a:[参与者...],m:[[从,到,'消息'],...]} 时序图
 *  {k:'hub',t,c:'中心',items:[...]}                 中心辐射拓扑

{id:'m1-1',g:'计算机组成与体系结构',t:'计算机基本组成与CPU结构',f:'高',sub:'冯·诺依曼结构、哈佛结构、运算器、控制器、专用寄存器、指令执行周期',
core:`## 冯·诺依曼结构与哈佛结构
- 冯·诺依曼结构三个要点：**存储程序**（程序和数据以二进制形式同存于存储器）、**程序控制**（按地址顺序取指执行）、**五大部件**（运算器、控制器、存储器、输入设备、输出设备）。
- 程序与数据共用一个存储器、一条总线，取指和取数不能同时进行，这就是"**冯·诺依曼瓶颈**"。
- **哈佛结构**：程序存储器与数据存储器**独立编址、独立总线**，一个周期内可同时取指令和读写数据，DSP、多数 MCU（如 Cortex-M 内部的 I-Bus/D-Bus）采用。现代通用 CPU 常是"**改进型哈佛结构**"：主存统一，L1 Cache 分为指令 Cache 与数据 Cache。
## CPU 的组成
- **运算器**（执行部件）：
- **ALU 算术逻辑单元**：完成算术运算与逻辑运算。
- **AC 累加寄存器**：暂存一个操作数或运算结果，是通用寄存器。
- **DR 数据缓冲寄存器**：暂存从主存读出或要写入主存的数据（也称 MDR）。
- **PSW 状态条件寄存器**：保存运算结果的状态（进位 C、溢出 V、零 Z、负 N）和控制标志（中断允许等）。
- **控制器**（指挥部件）：
- **PC 程序计数器**：存放**下一条**指令的地址；顺序执行时自动加 1（或加指令长度），遇转移指令则装入转移地址。
- **IR 指令寄存器**：存放**当前正在执行**的指令，对程序员**透明**。
- **ID 指令译码器**：分析 IR 中的操作码。
- **AR 地址寄存器**：存放 CPU 当前访问的主存单元地址（也称 MAR）。
- **时序部件**：产生时钟节拍和时序控制信号。
- 控制器还负责**中断与异常处理**。
## 指令执行周期
- 一条指令的执行分为：**取指令 → 分析（译码）→ 取操作数 → 执行 → 写回**，执行完一条指令后检查是否有中断请求。
- 取指阶段：PC → AR → 读主存 → DR → IR，同时 PC 自增。这一过程称为"取指周期"，对所有指令都相同。
## 对程序员的可见性
- 对汇编程序员**可见**：PC、通用寄存器（含 AC）、PSW。
- 对程序员**透明**（不可见）：IR、AR、DR、ID。
!! PC 存"下一条指令的地址"而不是当前指令；IR 存"指令本身"而不是地址。DR 与 AR 一个存"数据"一个存"地址"，极易互换。
!! 现代 CPU 中的 Cache 分指令/数据两部分，并不意味着整机是哈佛结构；考题问"同时取指令和数据"时选哈佛结构。`,

{id:'m1-2',g:'计算机组成与体系结构',t:'指令系统、CISC/RISC与寻址方式',f:'高',sub:'指令格式、三/二/一/零地址指令、CISC与RISC、七种寻址方式与访存次数',
core:`## 指令格式
- 指令 = **操作码**（做什么）+ **地址码**（对谁做）。按地址码个数分为三地址、二地址、一地址、零地址指令（零地址如堆栈运算、空操作）。
- 操作码位数决定指令条数：n 位操作码最多 2^n 条指令；**扩展操作码**技术让短操作码的指令拥有更多地址位。
## CISC 与 RISC
- **CISC（复杂指令集）**：指令数量多、功能复杂、**变长格式**、寻址方式多、多数采用**微程序控制**、多种指令可访存、通用寄存器少。
- **RISC（精简指令集）**：指令少且使用频率高、**定长格式**、寻址方式少、以**硬布线逻辑控制**为主、**只有 Load/Store 访存**、**通用寄存器多**、适合流水线、强调**优化编译**、大多数指令单周期完成。
- 现代处理器两者融合：x86 内部把 CISC 指令译码为类 RISC 微操作执行。
## 寻址方式（求操作数的方法）
- **立即寻址**：操作数就在指令中，**访存 0 次**，速度最快，但范围受地址码位数限制。
- **寄存器寻址**：操作数在寄存器中，访存 0 次。
- **直接寻址**：地址码是操作数的主存地址，访存 **1 次**。
- **寄存器间接寻址**：寄存器中存操作数地址，访存 1 次。
- **间接寻址**：地址码给出"操作数地址的地址"，一次间接需访存 **2 次**。
- **相对寻址**：有效地址 = **PC + 偏移量**，用于转移指令、浮动程序。
- **变址寻址**：EA = **变址寄存器 + 形式地址**，适合数组按下标访问。
- **基址寻址**：EA = **基址寄存器 + 形式地址**，用于程序重定位、扩大寻址空间。
- 速度：立即 > 寄存器 > 直接/寄存器间接 > 间接。
!! RISC 用硬布线控制、CISC 用微程序控制，题目常把两者互换设陷阱。
!! "形式地址"是指令中写的地址码，"有效地址EA"是计算后的真实地址，相对寻址用的是PC。`,

{id:'m1-3',g:'计算机组成与体系结构',t:'Flynn分类与并行体系结构',f:'中',sub:'SISD/SIMD/MISD/MIMD、多处理机SMP/NUMA/MPP、超标量、超流水线、VLIW、多核',
core:`## Flynn 分类（按指令流和数据流的多倍性）
- **SISD 单指令流单数据流**：传统单处理器。
- **SIMD 单指令流多数据流**：一条指令同时处理多个数据，如**阵列处理机、向量处理机**、GPU 的 SIMT、CPU 的 SSE/AVX/NEON 指令。
- **MISD 多指令流单数据流**：理论模型，实际很少（有教材将其与流水线、容错表决系统联系，考试按"很少见/不实际"理解）。
- **MIMD 多指令流多数据流**：**多处理机、多计算机系统**（含多核处理器、集群）。
## 多处理机与存储组织
- **SMP 对称多处理**：多个 CPU 共享一个主存与总线，**UMA**（一致存储访问），扩展性受总线限制。
- **NUMA 非一致存储访问**：每个处理器有本地内存，访问本地快、远程慢，扩展性比 SMP 好。
- **MPP 大规模并行处理**：节点各有独立内存（分布式存储），通过高速互联网络传递消息。
- 多核处理器：一个芯片集成多个核，共享 L2/L3 Cache，需解决 **Cache 一致性**（如 MESI 协议）。
## 指令级并行技术
- **超标量**：CPU 内有**多条流水线**，每个时钟周期可**发射多条指令**。
- **超流水线**：把流水段**划分得更细**（段数更多），提高主频，每个更短的周期发射一条指令。
- **VLIW 超长指令字**：由**编译器**在编译时把多条可并行操作打包成一条长指令，硬件简单。
- 超线程（SMT）：一个物理核同时运行多个硬件线程，共享执行单元。
!! SIMD 的典型代表是阵列处理机/向量机；多处理机、多核属于 MIMD。
!! 超标量靠"硬件多发射"，VLIW 靠"编译器静态调度"，超流水线靠"细分段提高主频"。`,

{id:'m1-4',g:'计算机组成与体系结构',t:'数据表示：码制、浮点数与进制',f:'中',sub:'原码/反码/补码/移码、表示范围、浮点数格式与规格化、IEEE 754、进制转换',
core:`## 机器数的四种码制（以 8 位、最高位为符号位为例）
- **原码**：符号位 + 绝对值。+5 = 0000 0101，−5 = 1000 0101。
- **反码**：正数同原码；负数符号位不变、数值位按位取反。−5 = 1111 1010。
- **补码**：正数同原码；负数 = 反码 + 1。−5 = 1111 1011。补码使**减法可以用加法实现**，0 的表示唯一。
- **移码**：补码的符号位取反（等于真值 + 2^(n−1)）。−5 = 0111 1011。常用于表示**浮点数的阶码**，便于比较大小。
- 表示范围（n 位整数）：
- 原码、反码：−(2^(n−1) − 1) ~ +(2^(n−1) − 1)，**0 有两种表示**。
- 补码、移码：**−2^(n−1)** ~ +(2^(n−1) − 1)，0 表示唯一，8 位补码范围 **−128 ~ +127**。
## 浮点数
- N = **M × R^E**：M 尾数（决定**精度**），E 阶码（决定**表示范围**），R 基数（一般为 2）。
- **规格化**：使尾数最高有效位为 1（二进制尾数绝对值在 [1/2, 1)），以充分利用尾数位数、提高精度。
- 浮点加减运算步骤：**对阶（小阶向大阶看齐，尾数右移）→ 尾数加减 → 结果规格化 → 舍入 → 溢出判断**。
- **IEEE 754 单精度**：1 位符号 + 8 位阶码（偏置 127）+ 23 位尾数，隐含最高位 1；双精度为 1 + 11（偏置 1023）+ 52。
## 进制转换
- 二进制 ↔ 八进制：每 3 位一组；二进制 ↔ 十六进制：每 4 位一组。
- 十进制整数转二进制：除 2 取余、逆序排列；小数转二进制：乘 2 取整、顺序排列。
!! 对阶时是"小阶向大阶对齐"，若大阶向小阶对齐需左移尾数，会丢失高位导致错误。
!! 阶码位数增加 → 范围变大；尾数位数增加 → 精度提高。`,

/* ---------- 流水线 ---------- */
{id:'m1-5',g:'流水线技术',t:'流水线的计算：周期、执行时间、吞吐率、加速比、效率',f:'高',sub:'流水线周期、理论公式与实践公式、实际与最大吞吐率、加速比、效率、时空图',
core:`## 基本概念
- 流水线把一条指令（任务）分成 k 个子过程（段），各段由独立部件处理，多条指令**重叠执行**。
- **流水线周期 Δt = 各段执行时间中的最大值**（瓶颈段）。
## 执行时间
- **理论公式**：T = (t1 + t2 + … + tk) + (n − 1) × Δt —— 第一条指令完整走完所有段，之后每隔 Δt 完成一条。
- **实践公式**：T = (k + n − 1) × Δt —— 认为每段都占用一个 Δt（各段等长或题目指明时使用）。
- 软考真题多用理论公式；若选项只有实践公式的结果，就按实践公式。
## 性能指标
- **吞吐率 TP = n / T**（单位时间完成的指令数）；**最大吞吐率 TPmax = 1 / Δt**（n → ∞ 时）。
- **加速比 S = 顺序执行时间 / 流水线执行时间** = n × Σti / T；各段等长、n 很大时 S → k。
- **效率 E = n 个任务占用的时空区面积 / (k × T)**，即各段设备的平均利用率；各段等长时 E = n / (k + n − 1)。
## 例题思路（3 段 2ns、2ns、1ns，执行 100 条）
- Δt = 2ns；理论 T = 5 + 99 × 2 = 203ns；实践 T = (3 + 99) × 2 = 204ns。
- TP = 100 / 203ns ≈ 4.93×10⁸ 条/秒；TPmax = 1/2ns = 5×10⁸ 条/秒。
- S = 500 / 203 ≈ 2.46；E = 100 × 5 / (3 × 203) ≈ 82%。
!! 流水线提高的是吞吐率，**不缩短**单条指令的执行时间。
!! 求实际吞吐率用 n/T；只有问"最大吞吐率"才用 1/Δt。`,

{id:'m1-6',g:'流水线技术',t:'流水线相关（冒险）与解决方法',f:'中',sub:'结构相关、数据相关（RAW/WAR/WAW）、控制相关、数据旁路、分支预测、乱序执行',
core:`## 三类相关（冒险）
- **结构相关**：多条指令同时争用同一硬件资源（如同时访存）。解决：资源重复设置（指令 Cache 与数据 Cache 分离、多端口寄存器堆）、插入停顿。
- **数据相关**：后续指令依赖前面指令的结果。
- **RAW 写后读**（真相关）：后一条要读前一条尚未写回的结果，最常见。
- **WAR 读后写**、**WAW 写后写**：名相关，可通过**寄存器重命名**消除，主要在乱序执行中出现。
- 解决：**数据旁路（转发 Forwarding）**——把运算结果直接送给后续指令；插入气泡（停顿）；编译器调整指令顺序。
- **控制相关**：转移（分支）指令改变程序执行顺序，已进入流水线的后续指令可能作废。
- 解决：**分支预测**（静态预测、动态预测如 2 位饱和计数器）、**延迟转移**（编译器在分支后填入有用指令）、提前计算分支条件。
## 相关对流水线的影响
- 相关导致流水线**断流**、插入停顿，使实际吞吐率低于 1/Δt。
- 流水线越深（段数越多），分支预测失败的代价越大。
## 乱序执行
- 指令按程序顺序发射，但可按操作数就绪情况**乱序执行**，再按序提交（重排序缓冲 ROB），提高流水线利用率。
!! "后一条指令用到前一条指令的结果"是数据相关，不是控制相关；"转移指令导致流水线清空"是控制相关。`,

{id:'m1-7',g:'存储系统',t:'存储层次、局部性与主存编址计算',f:'高',sub:'多级存储体系、局部性原理、存储器分类、主存编址、地址范围与容量计算、芯片扩展',
core:`## 多级存储体系
- 寄存器 → Cache → 主存 → 辅存（磁盘/SSD）→ 离线存储：**速度递减、容量递增、单位价格递减**。
- **Cache—主存**层次：由**硬件**自动管理，解决**速度**问题，对程序员透明。
- **主存—辅存**层次：由**硬件 + 操作系统**管理（虚拟存储），解决**容量**问题。
- 理论依据：**局部性原理**。
- **时间局部性**：刚被访问的内容不久会再被访问（循环、热点变量）。
- **空间局部性**：被访问单元附近的单元不久会被访问（顺序执行、数组遍历）。
- 工作集理论：进程在一段时间内频繁访问的页面集合，工作集驻留内存可减少缺页。
## 存储器分类
- 按存取方式：**随机存取 RAM**（主存）、**顺序存取 SAM**（磁带）、**直接存取 DAM**（磁盘：先定位区域再顺序）、**相联存储器**（按内容访问，用于 Cache 标记比较、TLB）。
- 半导体存储：**SRAM**（触发器，快、贵，用于 Cache）、**DRAM**（电容，需刷新，用于主存）、ROM/PROM/EPROM/**EEPROM/Flash**（非易失）。
## 主存编址计算（高频计算题）
- 地址单元数 = **末地址 − 首地址 + 1**（十六进制计算）。
- 容量 = 单元数 × 编址单位（按字节编址则单位为 B）。
- 所需芯片数 = **总容量 / 单片容量**（位数、字数都要折算）。
- 例：按字节编址，地址 A0000H ~ DFFFFH：DFFFF − A0000 + 1 = 40000H = 2¹⁸ = **256K** 个单元 → 256KB；用 32K×8bit 芯片需 256K×8 / (32K×8) = **8 片**。
!! 计算单元数一定要"+1"；若存储芯片是 ×4 位，则需要"字扩展 × 位扩展"两个方向的芯片数相乘。`,

{id:'m1-8',g:'存储系统',t:'Cache：映射方式、命中率、替换算法与写策略',f:'高',sub:'Cache工作原理、平均访问时间、直接/全相联/组相联映射、地址划分、LRU/FIFO/LFU、写直达与写回',
core:`## 工作原理
- Cache 与主存都按**块（行）**划分，CPU 访存时先查 Cache：命中则直接读取，未命中则从主存调入该块（同时把数据送 CPU）。
- 命中率 h = 命中次数 / 访问总次数。
## 平均访问时间
- **同时访问**（Cache 与主存并行启动）：t = h × t1 + (1 − h) × t2。
- **先访问 Cache，未命中再访问主存**：t = h × t1 + (1 − h) × (t1 + t2)。
- 题目没说明时按第一个公式；选项中只有第二个公式的结果时按题意选择。
## 地址映射方式
- **直接映射**：主存块号 j 只能放到 Cache 的第 j mod m 行。地址 = 区号（标记）+ 行号 + 块内地址。硬件最简单，**冲突率最高**。
- **全相联映射**：主存块可放入 Cache 任意行，地址 = 标记 + 块内地址。**冲突率最低**，但需对所有行**并行比较**标记，电路最复杂。
- **组相联映射**：Cache 分为若干组，**组间直接映射、组内全相联**。地址 = 标记 + 组号 + 块内地址。折中方案，最常用（如 4 路、8 路组相联）。
## 替换算法（全相联和组相联才需要）
- 随机、**FIFO** 先进先出、**LRU 近期最少使用**（命中率高，最常用）、LFU 最不经常使用。
## 写策略
- **写直达（Write-Through）**：写 Cache 的同时写主存，一致性好，写操作慢。
- **写回（Write-Back）**：只写 Cache，块被替换时若"**脏位**"为 1 才写回主存，效率高。
- 标记法：写主存时把 Cache 中对应块标记为无效。
## 多级 Cache 与一致性
- L1（分指令/数据）、L2、L3；多核共享 Cache 用 **MESI** 等协议保证一致性。
!! Cache 对程序员透明；Cache 容量越大命中率越高，但增幅递减，且容量增大会增加访问时间与成本。
!! 组相联是"组间直接、组内全相联"，与题干设置相反的说法是错误选项。`,

{id:'m1-9',g:'存储系统',t:'磁盘结构、存取时间与磁盘调度',f:'中',sub:'磁盘结构与容量、存取时间组成、FCFS/SSTF/SCAN/C-SCAN、单缓冲区记录处理与优化分布',
core:`## 磁盘结构
- 盘片 → 盘面 → **磁道**（同心圆）→ **扇区**；所有盘面上同一半径的磁道组成**柱面**。
- 非格式化容量 = 位密度 × 最内圈周长 × 每面磁道数 × 面数；**格式化容量 = 每道扇区数 × 扇区容量 × 每面磁道数 × 面数**。
## 存取时间
- **存取时间 = 寻道时间 + 旋转延迟（等待时间）+ 数据传输时间**。
- 平均旋转延迟 = 旋转**半周**的时间；传输一个扇区时间 = 旋转一周时间 / 每道扇区数。
- 寻道是机械运动，通常耗时最多，是**移臂调度**优化的对象；同柱面多个请求按扇区先后服务是**旋转调度**。
## 移臂调度算法
- **FCFS**：按请求到达顺序服务，公平但寻道长。
- **SSTF 最短寻道时间优先**：总选离磁头最近的请求，平均寻道短，但可能**饥饿**。
- **SCAN 扫描（电梯）**：沿一个方向依次服务直到端点（LOOK 变体到最远请求即折返），再反向。
- **C-SCAN 循环扫描**：只在一个方向服务，到端点后快速返回起点再继续，各位置等待时间更均匀。
## 单缓冲区处理记录（经典真题）
- 某磁道有 10 个记录 R0~R9，旋转一周 20ms（读一个记录 2ms），单缓冲区每个记录处理 4ms，记录顺序存放：
- 读 R0（2ms）+ 处理（4ms）= 6ms，此时磁头已转到 R3 开始处，要等 R1 转回来需 16ms，所以之后每个记录 22ms。总时间 = 6 + 9 × 22 = **204ms**。
- **优化分布**：让下一个逻辑记录恰好在处理结束时转到磁头下（R0、R7、R4、R1、R8……交错存放），每个记录 2 + 4 = 6ms，总时间 **60ms**。
!! 平均旋转延迟按"半周"计算；SSTF 可能饥饿，SCAN/C-SCAN 不会。`,

{id:'m1-10',g:'存储系统',t:'RAID与存储可靠性',f:'中',sub:'RAID0/1/3/5/6/10、可用容量计算、容错能力、写惩罚、热备盘、RAID与备份的区别',
core:`- **RAID0 条带化**：数据分块并行写入多盘，无冗余，读写性能最好，利用率 100%，**任一盘坏数据全丢**。
- **RAID1 镜像**：两盘互为镜像，利用率 50%，读性能好、可靠性高。
- **RAID3**：位/字节级条带 + **专用校验盘**，适合大文件顺序读写。
- **RAID5**：块级条带 + **分布式奇偶校验**（校验块分散在各盘），**允许坏 1 块**，可用容量 (n−1) × 单盘；写操作需"读旧数据、读旧校验、写新数据、写新校验"，存在**写惩罚（4 次 I/O）**。
- **RAID6**：双重分布式校验，**允许同时坏 2 块**，可用容量 (n−2) × 单盘，写惩罚更大（6 次 I/O）。
- **RAID10（1+0）**：先镜像再条带，兼顾性能与可靠，利用率 50%，每个镜像组可坏 1 块。
- **热备盘**：故障盘被自动替换并重建，缩短降级运行时间。
- 大容量盘做 RAID5 时重建时间很长，重建期间再坏一块即丢数据，因此大容量阵列推荐 RAID6。
!! RAID 只防磁盘硬件故障，**不能替代备份**：误删除、勒索病毒、逻辑错误会同步到所有盘。`,

{id:'m1-11',g:'总线、校验码与输入输出',t:'总线与总线带宽计算',f:'中',sub:'总线分类、地址/数据/控制总线、总线带宽、串行与并行总线、总线仲裁、常见总线标准',
core:`## 总线分类
- 按传送信息：**数据总线**（双向，宽度决定一次传输位数）、**地址总线**（单向，宽度决定**可寻址空间**，n 根地址线可寻址 2^n 个单元）、**控制总线**（读写、中断、时钟等信号）。
- 按位置：**片内总线**（芯片内部）、**系统总线**（CPU、主存、I/O 之间，又称内总线）、**外部总线**（计算机与外设或其他计算机之间，又称通信总线）。
- 总线是**分时共享**的：同一时刻只能有一个设备发送，多个设备可以接收。
## 总线性能
- **总线带宽 = 总线宽度（字节）× 总线时钟频率 ÷ 每次传输所需时钟周期数**。
- 例：32 位总线、100MHz、每 4 个时钟周期传送一次：4B × 100M ÷ 4 = **100MB/s**。
- 并行总线：多位同时传送，线间干扰（串扰、时钟偏移）限制频率；**串行总线**：如 PCIe、USB、SATA，采用差分信号与高频率，带宽反而更高。
## 总线仲裁
- 集中式仲裁：**链式查询**（优先级固定、对故障敏感）、**计数器定时查询**、**独立请求**（响应最快，线多）。
- 分布式仲裁：各设备自带仲裁逻辑。
## 常见标准
- 系统/扩展：PCI、**PCIe**；外设：USB、SATA、SCSI；嵌入式板级：I²C、SPI、UART；工业与车载：**CAN**、RS-485。
!! 地址总线决定可寻址范围，数据总线决定一次传输的位数，两者容易混淆。`,

{id:'m1-12',g:'总线、校验码与输入输出',t:'校验码：奇偶校验、CRC与海明码',f:'高',sub:'码距、奇偶校验、CRC模2除法与校验位、海明码校验位数与位置、检错纠错能力',
core:`## 码距
- 码距：一个编码系统中任意两个合法码字之间**最少的不同位数**。码距 ≥ d+1 可检测 d 位错；码距 ≥ 2t+1 可纠正 t 位错。
## 奇偶校验
- 增加 1 位校验位，使"1"的个数为奇数（奇校验）或偶数（偶校验）。码距为 2，**只能检测奇数个位错，不能纠错**。
## CRC 循环冗余校验
- 发送方：信息位后补 **r 个 0**（r 为生成多项式最高次幂），用**模 2 除法**除以生成多项式对应的二进制数，**余数就是校验码**，附在信息位后发送。
- 接收方：用收到的整个码字除以同一生成多项式，余数为 0 则认为无错。
- 模 2 运算：加减都是**异或**，不进位、不借位。
- 特点：检错能力强（能检出所有奇数位错、长度 ≤ r 的突发错），**只检错不纠错**，广泛用于网络帧、存储。
## 海明码
- 在数据位中按 **2^i 的位置**（第 1、2、4、8……位）插入校验位，每个校验位负责若干数据位的偶校验。
- 校验位个数 k 满足：**2^k ≥ n + k + 1**（n 为信息位数）。例：n = 4 → k = 3（7,4 码）；n = 8 → k = 4；n = 16 → k = 5；n = 32 → k = 6。
- 接收时重新计算各校验组，得到的"指误字"就是出错位的位置，可**纠正 1 位错**（加一位总校验可检测 2 位错）。
!! CRC 校验位数 = 生成多项式最高次幂，不是多项式二进制的位数（x⁴+x+1 → 10011 是 5 位，但校验码是 4 位）。`,

{id:'m1-13',g:'总线、校验码与输入输出',t:'I/O控制方式：程序查询、中断、DMA与通道',f:'高',sub:'程序查询、程序中断、中断向量与中断响应过程、DMA工作过程、通道与I/O处理机、各方式对比',
core:`## 四种数据传输控制方式（CPU 参与程度由高到低）
- **程序控制（查询）方式**：CPU 循环查询外设状态，就绪后传送。CPU 与外设**串行**工作，效率最低，但实现简单。
- **程序中断方式**：外设就绪时发中断请求，CPU 暂停当前程序执行**中断服务程序**完成传送。CPU 与外设可**并行**工作，适合**低速、随机**的外设（键盘、串口）。
- **DMA 方式**：由 **DMA 控制器**接管总线，在**主存与外设之间直接成块传送**数据，CPU 只在**传送开始（初始化）和结束（中断处理）时介入**，适合**高速、大批量**数据（磁盘、网卡、ADC）。
- **通道 / I/O 处理机**：具有自己指令系统的专用处理器，执行通道程序控制多台外设，进一步解放 CPU。
## 中断
- **中断向量**：中断服务程序的入口地址，存放在中断向量表中。
- **中断响应时间**：从发出中断请求到开始执行中断服务程序第一条指令的时间。
- 响应时机：CPU 在**一条指令执行结束**时检查并响应中断。
- 中断处理过程：关中断 → **保存断点和现场** → 识别中断源、转中断服务程序 → （开中断允许嵌套）→ 执行服务 → 恢复现场 → 开中断 → 返回断点。
- 多级中断：高优先级可打断低优先级中断服务程序（中断嵌套）。
## DMA 的响应
- DMA 请求在**一个总线周期结束**时即可响应（不必等整条指令结束），通过**周期挪用**或停止 CPU 访存的方式占用总线。
!! 中断在"指令结束"时响应，DMA 在"总线周期结束"时响应。
!! DMA 传送过程中不需要 CPU 执行指令搬运数据，但开始和结束仍需要 CPU 参与，并非"完全不需要 CPU"。`,

core:`## 操作系统的作用与功能
- 作用：管理计算机的软硬件资源、为用户提供方便的接口、提高系统资源利用率。
- 五大管理功能：**进程（处理机）管理、存储管理、文件管理、设备管理、作业管理（用户接口）**。
- 用户接口：**命令接口**（命令行、图形界面）与**程序接口**（系统调用）。
## 操作系统类型
- **批处理操作系统**：作业成批提交、自动处理，无交互；多道批处理提高资源利用率。
- **分时操作系统**：时间片轮转为多个终端用户服务，特点：**多路性、独立性、交互性、及时性**。
- **实时操作系统**：在严格时限内响应外部事件，强调**及时性与高可靠性**；分硬实时与软实时。
- **网络操作系统**：管理网络资源、提供网络通信与共享。
- **分布式操作系统**：多台计算机协同、对用户呈现为单一系统，强调**透明性**。
- **嵌入式操作系统**：可裁剪、可移植、实时、占用资源少、固化在 ROM/Flash 中（如 FreeRTOS、VxWorks、μC/OS、RT-Thread）。
## 内核结构
- **宏内核（单内核）**：进程、内存、文件、驱动等都运行在内核态，模块间直接函数调用，**性能高**，但可靠性与可扩展性较差（Linux、传统 UNIX）。
- **微内核**：内核只保留最基本功能（进程/线程调度、进程间通信、中断、基本内存管理），文件系统、驱动、网络协议等作为**用户态服务**运行。优点：**可靠性高、易扩展、易移植、适合分布式**；缺点：频繁 IPC 和态切换带来**性能开销**（QNX、seL4、鸿蒙内核）。
- **用户态与内核态**：特权指令只能在内核态执行；应用通过**系统调用**陷入内核。
!! 微内核把驱动和文件系统移出内核，"可靠性高、效率低"是常考的对比结论。
!! 实时系统追求的是"可预测、按时"，并不等于"平均速度最快"。`,

/* ---------- 进程管理 ---------- */
{id:'m2-2',g:'进程管理',t:'进程与线程、PCB与进程控制',f:'中',sub:'程序与进程区别、进程的特征、PCB内容、线程的概念、用户级与内核级线程、进程通信方式',
core:`## 进程
- **进程**是具有独立功能的程序关于某个数据集合的一次运行活动，是系统进行**资源分配和调度的独立单位**。
- 进程实体 = 程序段 + 数据段 + **PCB**。PCB 是进程存在的**唯一标志**，包含：进程标识符、处理机状态（寄存器现场）、进程调度信息（状态、优先级）、进程控制信息（程序与数据地址、资源清单、同步机制）。
- 程序与进程的区别：程序是**静态**的指令集合，进程是**动态**的执行过程；进程有生命周期，程序可长期保存；一个程序可对应多个进程。
- 进程特征：**动态性、并发性、独立性、异步性、结构性**。
- 进程控制原语：创建、撤销、阻塞、唤醒、挂起、激活；**原语执行过程不可中断**。
## 线程
- 引入线程后，**线程是独立调度和分派的基本单位**，进程仍是**资源分配的基本单位**。
- 同一进程内的线程**共享**：代码段、数据段（全局变量）、堆、打开的文件、信号处理等进程资源。
- 每个线程**私有**：线程 ID、**程序计数器、寄存器组、栈**、线程状态。
- 线程切换无需切换地址空间，开销远小于进程切换。
- **用户级线程**：由用户态线程库管理，内核不知道其存在，切换快，但一个线程阻塞会导致整个进程阻塞。**内核级线程**：由内核管理，可在多核上真正并行。
## 进程通信（IPC）
- 低级通信：信号量。高级通信：**共享存储**（最快，需同步）、**消息传递**（消息队列、信箱）、**管道**（半双工字节流，匿名管道用于亲缘进程）、信号、套接字。
!! 线程"不能共享"的是栈、寄存器和程序计数器；"能共享"的是进程级资源。`,

{id:'m2-3',g:'进程管理',t:'进程状态转换：三态、五态模型',f:'高',sub:'就绪/运行/阻塞、状态转换条件、新建与终止、挂起状态、活跃/静止就绪与阻塞',
core:`## 三态模型
- **运行**：占有 CPU 正在执行（单 CPU 时最多一个）。
- **就绪**：除 CPU 外已具备运行条件，在就绪队列中等待调度。
- **阻塞（等待）**：因等待 I/O 或某事件而暂停，即使给它 CPU 也无法运行。
- 四种转换：
- 就绪 → 运行：被**调度程序选中**。
- 运行 → 就绪：**时间片用完**或被更高优先级进程**抢占**。
- 运行 → 阻塞：请求 I/O、申请资源未满足、等待事件（**主动**行为）。
- 阻塞 → 就绪：等待的事件发生（**被动**，由其他进程或中断唤醒）。
- 不可能的转换：**阻塞 → 运行**（必须先就绪再被调度）、**就绪 → 阻塞**（就绪进程没有运行，无法提出请求）。
## 五态模型
- 在三态基础上增加**新建**（PCB 已建立、尚未进入就绪队列）和**终止**（运行结束或被撤销、等待回收）。
## 挂起（静止）状态
- 为缓解内存紧张、便于调试或用户请求，把暂时不运行的进程**换出到外存**，称为挂起。
- 状态分为：**活跃就绪、静止就绪、活跃阻塞、静止阻塞**。
- 静止阻塞 → 静止就绪：等待的事件发生；静止就绪 → 活跃就绪：被激活（调入内存）。
!! 运行→阻塞是进程"自己"发起的，阻塞→就绪是"别人"唤醒的。
!! 挂起不等于阻塞：挂起关注是否在内存，阻塞关注是否在等待事件。`,

{id:'m2-4',g:'进程管理',t:'进程调度算法与计算',f:'中',sub:'抢占与非抢占、FCFS、SJF、优先级、时间片轮转、多级反馈队列、周转时间与带权周转时间',
core:`## 调度方式
- **非抢占式**：进程运行直到完成或阻塞才让出 CPU。
- **抢占式**：高优先级进程到达或时间片用完时，可剥夺当前进程的 CPU，实时系统多用抢占式。
## 常用调度算法
- **FCFS 先来先服务**：按到达顺序，对长作业有利，对短作业不利。
- **SJF 短作业优先**：平均周转时间最短，但可能使长作业**饥饿**，且需预知运行时间。
- **优先级调度**：静态或动态优先级；可能饥饿，用"**老化**"（等待越久优先级越高）解决。
- **高响应比优先**：响应比 = (等待时间 + 要求服务时间) / 要求服务时间，兼顾短作业与长作业。
- **时间片轮转 RR**：分时系统常用，时间片过大退化为 FCFS，过小则切换开销大。
- **多级反馈队列**：设置多个优先级不同、时间片不同的队列，新进程进入最高优先级队列，用完时间片未完成则降级。兼顾交互、短作业和长作业，UNIX 类系统使用。
## 性能指标
- **周转时间 = 完成时间 − 到达时间**；**带权周转时间 = 周转时间 / 运行时间**。
- 等待时间 = 周转时间 − 运行时间。
## 例题（P1/0/8、P2/1/4、P3/2/9、P4/3/5：进程/到达/运行）
- FCFS：完成时刻 8、12、21、26，周转 8、11、19、23，平均 **15.25**。
- 非抢占 SJF：P1(0~8) → P2(8~12) → P4(12~17) → P3(17~26)，周转 8、11、14、24，平均 **14.25**。
!! 周转时间从"到达"开始算，不是从"开始运行"算。`,

{id:'m2-5',g:'进程管理',t:'同步与互斥、信号量与PV操作',f:'高',sub:'临界资源与临界区、同步与互斥、信号量物理意义、P/V操作定义、取值范围计算、生产者消费者',
core:`## 基本概念
- **临界资源**：一次只允许一个进程使用的资源（打印机、共享变量、缓冲区）；访问临界资源的那段代码是**临界区**。
- **互斥**：进程间因**竞争**同一临界资源而形成的**间接制约**关系。
- **同步**：进程间为**协作**完成任务，需要按一定先后次序执行的**直接制约**关系。
- 临界区访问原则：**空闲让进、忙则等待、有限等待、让权等待**。
## 信号量与 PV 操作
- 信号量 S 是一个整型变量，只能通过 P、V 原语操作。
- **P(S)**：S = S − 1；若 S < 0，调用进程**阻塞**，进入 S 的等待队列。（申请资源）
- **V(S)**：S = S + 1；若 S ≤ 0，从 S 的等待队列中**唤醒**一个进程。（释放资源）
- 物理意义：**S ≥ 0 时表示可用资源数；S < 0 时 |S| 表示在该信号量上等待的进程数**。
- 互斥信号量初值通常为 **1**；同步信号量初值通常为 **0** 或可用资源数。
## 取值范围计算
- n 个进程共享 m 个同类资源（m < n）：信号量初值 m，取值范围 **m − n ~ m**。
## 生产者—消费者（n 个缓冲区）
- 信号量：**empty = n**（空缓冲区数）、**full = 0**（满缓冲区数）、**mutex = 1**（互斥访问缓冲区）。
- 生产者：P(empty) → P(mutex) → 放入产品 → V(mutex) → V(full)。
- 消费者：P(full) → P(mutex) → 取出产品 → V(mutex) → V(empty)。
!! 同步的 P 必须在互斥的 P **之前**，颠倒可能导致死锁；两个 V 的顺序可以交换。
!! V 操作永远不会使调用进程阻塞，只可能唤醒别的进程。`,

{id:'m2-6',g:'进程管理',t:'前趋图与PV操作填空',f:'高',sub:'前趋图、并发执行、信号量与边的对应、P/V位置判断、真题填空方法',
core:`## 前趋图
- 前趋图是**有向无环图**，结点表示进程（或语句），有向边 Pi → Pj 表示 Pi 必须在 Pj 开始前完成。
- 没有前趋关系的进程可以**并发执行**。
## 用 PV 实现前趋关系
- **每条边对应一个同步信号量**，初值为 0；所需信号量个数 = 边数。
- **边的起点进程在执行结束后执行 V**（发信号）；**边的终点进程在开始执行前执行 P**（等信号）。
- 一个进程有几条入边就在开头做几个 P，有几条出边就在结尾做几个 V。
## 填空题解题步骤
- ① 把题目给出的信号量 S1、S2……按顺序标到前趋图的边上（一般按从左到右、从上到下编号）。
- ② 对每个进程：入边 → 开头 P(对应信号量)；出边 → 结尾 V(对应信号量)。
- ③ 对照代码框中的空格逐一填写。
!! P 在"开始前"、V 在"结束后"；起点做 V、终点做 P，方向不能颠倒。`,

{id:'m2-7',g:'进程管理',t:'死锁：必要条件、处理策略与资源数计算',f:'高',sub:'死锁定义、四个必要条件、预防、避免、检测与解除、资源分配图、不死锁的最少资源数',
core:`## 定义与必要条件
- **死锁**：两个或以上进程因竞争资源或推进顺序不当而相互等待，若无外力作用都无法继续推进。
- 四个**必要条件**（同时满足才可能死锁）：**互斥、请求与保持（占有并等待）、不可剥夺、循环等待**。
## 处理策略
- **死锁预防**（破坏必要条件，静态）：
- 破坏"请求与保持"：**一次性分配**所需全部资源（资源利用率低）。
- 破坏"不可剥夺"：申请不到时释放已占有资源。
- 破坏"循环等待"：**资源有序分配**，按编号递增申请。
- 破坏"互斥"：通常不可行（很多资源天然互斥）。
- **死锁避免**（动态）：每次分配前判断系统是否仍处于**安全状态**，典型为**银行家算法**。
- **死锁检测与解除**：允许死锁发生，通过**资源分配图化简**检测；解除方法：**撤销进程、剥夺资源、进程回退**。
- **鸵鸟策略**：忽略死锁（通用操作系统常用）。
## 资源数计算（高频）
- m 个进程，每个最多需要 k 个同类资源，系统**不会发生死锁的最少资源数 = m × (k − 1) + 1**。
- 思路：最坏情况每个进程都拿到 k − 1 个、都还差 1 个，此时再多 1 个资源就能让一个进程完成并释放资源。
- 反求：已知资源数 R，保证不死锁的最大进程数 m 满足 m(k − 1) + 1 ≤ R。
!! 不安全状态**不一定**会死锁；安全状态一定不会死锁。
!! 银行家算法属于"避免"而不是"预防"。`,

{id:'m2-8',g:'进程管理',t:'银行家算法与安全性检查',f:'高',sub:'Max/Allocation/Need/Available、安全状态与安全序列、安全性算法步骤、资源请求算法',
core:`## 数据结构
- **Max**：每个进程对各类资源的最大需求。
- **Allocation**：已分配给每个进程的资源数。
- **Need = Max − Allocation**：每个进程还需要的资源数。
- **Available**：系统当前可用资源数 = 资源总数 − 各进程 Allocation 之和。
## 安全性算法
- ① 令 Work = Available。
- ② 找一个尚未完成且 **Need ≤ Work**（每类资源都满足）的进程。
- ③ 假设它获得资源并运行完毕，释放资源：**Work = Work + Allocation**，标记为完成。
- ④ 重复 ②③；若所有进程都能完成，则该顺序为**安全序列**，系统处于**安全状态**。
## 资源请求算法
- 进程 Pi 提出请求 Request：
- 若 Request > Need，出错（超过声明的最大需求）。
- 若 Request > Available，资源不足，Pi 等待。
- 否则**试探性分配**（Available −= Request，Allocation += Request，Need −= Request），再执行安全性算法：安全则正式分配，不安全则撤销试探、Pi 等待。
## 解题技巧
- 先求 Available 与 Need 两张表，再从 Need 最小的进程开始尝试；判断选项中的序列时，逐个代入，一旦某一步 Need > Work 即可排除。
!! Available 要用"资源总数减去全部 Allocation"计算，题目给的往往是总数；比较 Need ≤ Work 时每类资源都要满足。`,

{id:'m2-9',g:'存储管理',t:'分区存储管理与页式存储地址转换',f:'高',sub:'固定分区与可变分区、首次/最佳/最差/循环首次适应、内外碎片、页式存储、逻辑地址划分、页表与地址变换',
core:`## 分区存储管理
- **固定分区**：预先划分大小固定的分区，存在**内部碎片**。
- **可变分区**：按作业大小动态划分，会产生**外部碎片**，可通过"**紧凑**"消除。
- 分配算法：
- **首次适应**：从低地址起找第一个能满足的空闲区，低地址碎片多。
- **最佳适应**：找能满足的**最小**空闲区，会产生大量难以利用的小碎片。
- **最差适应**：找**最大**空闲区，大空闲区很快被用完。
- **循环首次适应**：从上次找到的位置继续查找。
## 页式存储
- 把进程逻辑地址空间和物理内存都划分为等大的**页/页框（块）**；进程的页可离散存放在不连续的块中。
- 逻辑地址 = **页号 P + 页内地址 W**。页面大小为 2^n 字节时，**低 n 位为页内地址**，其余高位为页号。
- 通过**页表**（页号 → 物理块号）完成地址变换：**物理地址 = 块号 × 页大小 + 页内地址**，即**页内地址不变、页号替换为块号**。
- 十六进制快速方法：4KB = 2¹²，低 12 位即低 **3 位十六进制**数为页内地址；1KB = 2¹⁰，低 10 位（不是整数个十六进制位，需按二进制拆分）。
- 优点：无外部碎片，只有最后一页的**页内碎片**，内存利用率高；缺点：页表占用内存，不便于按逻辑模块共享与保护。
## 快表 TLB
- 页表放在内存中时，一次取数要访存两次（查页表 + 取数）；**快表**是存放常用页表项的**相联存储器**，命中时只需一次访存。
!! 若页号超出页表长度，产生**越界中断**；若页表项"状态位"为 0，产生**缺页中断**。`,

{id:'m2-10',g:'存储管理',t:'段式、段页式存储与虚拟存储',f:'中',sub:'段式存储与段表、段的共享与保护、段页式地址结构、访存次数、虚拟存储原理与特征、请求分页、抖动',
core:`## 段式存储
- 按程序的**逻辑结构**（主程序、子程序、数据段、栈段）分段，**段长可变**，每段从 0 开始编址。
- 逻辑地址 = **段号 + 段内偏移**；段表项含**段基址、段长**。地址变换：检查**段内偏移 < 段长**（否则越界中断），物理地址 = 段基址 + 段内偏移。
- 优点：**便于共享和保护**（按逻辑模块）、便于动态链接；缺点：会产生**外部碎片**。
## 段页式存储
- 先分段、段内再分页；逻辑地址 = **段号 + 段内页号 + 页内地址**。
- 每个进程一张段表，每段一张页表。一次取数需访问 **段表 → 页表 → 数据，共 3 次内存**（无快表时），因此必须配合 TLB。
- 兼具段式（共享保护）与页式（无外部碎片）的优点，缺点是表格多、地址变换开销大。
## 虚拟存储
- 基于**局部性原理**：程序运行时只把部分页装入内存，需要时再调入（请求调页），内存不足时把暂时不用的页换出（页面置换）。
- 特征：**多次性、对换性、虚拟性**；虚拟存储的容量受**地址结构（地址位数）和外存容量**限制。
- 请求分页的页表项：页号、物理块号、**状态位（是否在内存）、访问位 A、修改位 M、外存地址**。
- **缺页中断**：在指令执行**期间**产生和处理（与普通中断在指令结束时响应不同），一条指令执行中可能产生多次缺页。
- **抖动（颠簸）**：分配给进程的物理块太少，页面频繁换入换出，系统大部分时间用于换页。解决：增加分配块数、采用工作集模型、减少并发进程数。
!! 页是物理单位、段是逻辑单位；页长固定由系统决定，段长可变由程序决定。`,

{id:'m2-11',g:'存储管理',t:'页面置换算法',f:'高',sub:'OPT、FIFO、LRU、CLOCK与改进型CLOCK、Belady异常、缺页次数与缺页率计算',
core:`## 常用页面置换算法
- **OPT 最佳置换**：淘汰**将来最长时间不再被访问**的页，缺页率最低，但需预知未来，**无法实现**，用作评价标准。
- **FIFO 先进先出**：淘汰最早调入的页，实现简单，但可能淘汰常用页，会出现 **Belady 异常**（分配的物理块增加，缺页次数反而增加）。
- **LRU 最近最久未使用**：淘汰**过去最长时间未被访问**的页，性能接近 OPT，需要硬件支持（计数器或栈），开销较大。
- **CLOCK（NRU 最近未用）**：页面组成循环队列，访问位 A=1 的页给"第二次机会"（清零后跳过），淘汰遇到的第一个 A=0 的页。
- **改进型 CLOCK**：同时考虑访问位 A 与修改位 M，淘汰优先级：**(A=0,M=0) > (A=0,M=1) > (A=1,M=0) > (A=1,M=1)**——未访问且未修改的页淘汰代价最小。
## 计算方法
- 缺页次数包括最初装入时的缺页（除非题目说明内存已预装页面）。
- **缺页率 = 缺页次数 / 访问总次数**。
- 例：引用串 7 0 1 2 0 3 0 4 2 3，3 个物理块：FIFO 缺页 **9** 次，LRU 缺页 **8** 次。
- 例：1 2 3 4 1 2 5 1 2 3 4 5，FIFO 3 块缺页 9 次、4 块缺页 10 次（Belady 异常）。
!! OPT 和 LRU 都属于"栈算法"，不会出现 Belady 异常。
!! LRU 看"过去"、OPT 看"未来"，不要混淆。`,

{id:'m2-12',g:'文件与设备管理',t:'文件的结构与多级索引计算',f:'高',sub:'逻辑结构与物理结构、连续/链接/索引结构、UNIX混合索引、直接/一级/二级/三级间接、文件最大长度计算',
core:`## 文件结构
- **逻辑结构**（用户视角）：**有结构的记录式文件**（顺序文件、索引文件、索引顺序文件、散列文件）和**无结构的流式文件**。
- **物理结构**（存储视角）：
- **连续结构**：文件占用连续的物理块，顺序访问快、支持随机访问；但有外部碎片、不便扩展。
- **链接结构**：物理块用指针链接（显式链接即 FAT 表），便于扩展、无外部碎片；只能顺序访问，指针占空间，可靠性差。
- **索引结构**：为文件建立**索引表**，记录各逻辑块对应的物理块号，**支持随机访问、便于增长**；索引表占用额外空间。
## UNIX 混合索引（高频计算）
- 索引结点 inode 中有若干地址项：若干个**直接地址**、1 个**一级间接**、1 个**二级间接**、1 个**三级间接**。
- 设盘块大小为 B，地址项（块号）占 a 字节，每个索引块可存 **N = B / a** 个地址。
- 可寻址块数：直接索引 = 直接地址项数；一级间接 = N；二级间接 = N²；三级间接 = N³。
- 文件最大长度 = (直接项数 + N + N² + N³) × B。
- 判断逻辑块号所在级别：**从 0 开始累加**。例：5 个直接地址项、块 1KB、地址 4B（N = 256）：直接覆盖 0~4，一级间接覆盖 5~260，二级间接覆盖 261~65796。
- 访问数据所需的磁盘访问次数（inode 已在内存）：直接 1 次，一级间接 2 次，二级间接 3 次，三级间接 4 次。
!! 逻辑块号从 0 开始，边界值最容易错：一级间接的最后一个块号是"直接项数 + N − 1"。`,

{id:'m2-13',g:'文件与设备管理',t:'文件目录与空闲空间管理（位示图）',f:'高',sub:'FCB与目录、树形目录、绝对路径与相对路径、空闲区表、空闲链表、成组链接、位示图字号位号计算',
core:`## 文件目录
- **文件控制块 FCB**：描述和控制文件的数据结构，包含文件名、类型、物理位置、大小、权限、时间等；FCB 的有序集合就是**文件目录**。
- 目录结构：一级目录（重名问题）、二级目录、**树形（多级）目录**（最常用）、无环图目录（支持共享）。
- **绝对路径**：从根目录开始的完整路径，如 /usr/local/bin/app。
- **相对路径**：从**当前工作目录**开始的路径，如当前在 /usr 时为 local/bin/app。
- 索引结点：把 FCB 中除文件名外的信息放入 inode，目录项只保留"文件名 + inode 号"，加快目录检索。
## 空闲空间管理
- **空闲区表法**：记录每个连续空闲区的起始块与长度，适合连续分配。
- **空闲链表法**：空闲块链接成链，分配回收简单，但效率低。
- **成组链接法**：把空闲块分组，每组第一块记录下一组的块号与块数，兼顾表与链的优点（**UNIX 采用**）。
- **位示图法**：用一个二进制位表示一个物理块，1 表示占用、0 表示空闲（以题目约定为准）。
## 位示图计算（高频）
- 所需字数 = ⌈物理块总数 / 字长⌉。
- 块号、字号、位号**都从 0 开始**时：**字号 = ⌊块号 / 字长⌋**，**位号 = 块号 mod 字长**。
- 若都从 1 开始：先把块号减 1 换算成从 0 开始，再把字号、位号各加 1。
- 例：字长 32 位，块号 4195（均从 0 编号）：4195 = 131 × 32 + 3 → **字号 131、位号 3**。
- 反求块号 = 字号 × 字长 + 位号。
!! 位示图大小只与"物理块数"有关，与文件个数无关。
!! 务必看清题目中"从0开始"还是"从1开始"编号。`,

{id:'m2-14',g:'文件与设备管理',t:'设备管理：I/O软件层次、缓冲与SPOOLing',f:'中',sub:'设备分类、I/O软件四层、设备独立性、单缓冲/双缓冲/循环缓冲/缓冲池、缓冲时间计算、SPOOLing、虚设备',
core:`## 设备分类
- 按数据组织：**块设备**（磁盘，可随机寻址）与**字符设备**（键盘、打印机，不可寻址）。
- 按资源分配：**独占设备**、**共享设备**、**虚拟设备**（通过 SPOOLing 把独占设备变为共享）。
## I/O 软件层次（自顶向下）
- **用户级 I/O 软件**：库函数、SPOOLing 守护进程。
- **与设备无关的 I/O 软件**：设备命名、保护、**缓冲**、分配与释放、错误报告，实现**设备独立性**（用户用逻辑设备名，系统映射到物理设备）。
- **设备驱动程序**：把抽象请求转换为具体的设备控制命令，与硬件密切相关。
- **中断处理程序**：I/O 完成后唤醒被阻塞的驱动或进程。
- 硬件：设备控制器与设备。
## 缓冲技术
- 目的：缓和 CPU 与 I/O 设备速度不匹配、减少中断次数、提高并行性。
- 设 T 为把一块数据从设备输入到缓冲区的时间，M 为从缓冲区送到用户区的时间，C 为 CPU 处理时间：
- **单缓冲**：每块平均处理时间 = **max(C, T) + M**。
- **双缓冲**：每块平均处理时间 = **max(C + M, T)**（一般 M 很小，近似 max(C, T)）。
- 无缓冲：T + C。
- 循环缓冲、**缓冲池**（多个进程共享的公用缓冲区）。
## SPOOLing（假脱机）
- 利用磁盘模拟脱机输入输出，组成：**输入井、输出井**（磁盘上的区域）、输入缓冲区、输出缓冲区、输入进程、输出进程。
- 作用：**把独占设备改造为共享设备**，提高 I/O 速度，实现**虚拟设备**（如共享打印机）。
!! 单缓冲公式是 max(C,T)+M，双缓冲是 max(C+M,T)，注意 M 的位置不同。`,

{id:'m2-15',g:'文件与设备管理',t:'系统性能指标与性能评价方法',f:'中',sub:'CPI与MIPS、MFLOPS、响应时间与吞吐量、性能评价方法、基准程序分类、Amdahl定律、性能测试类型',
core:`## 常用性能指标
- **主频**：CPU 时钟频率；**CPI**：每条指令平均时钟周期数；**IPC** = 1/CPI。
- **MIPS** = 主频（MHz）/ CPI（每秒百万条指令）；**MFLOPS**：每秒百万次浮点运算。
- CPU 执行时间 = 指令条数 × CPI × 时钟周期。
- 系统指标：**响应时间**（平均、P95、P99）、**吞吐量**（TPS/QPS）、并发用户数、资源利用率。
## 性能评价方法
- **时钟频率法**：以主频衡量，粗略。
- **指令执行速度法**：以 MIPS 衡量。
- **等效指令速度法（吉普森混合法）**：按各类指令使用比例加权计算。
- **数据处理速率法 PDR**：综合考虑 CPU 与存储，采用平均指令与数据的位数。
- **综合理论性能法 CTP**：用 MTOPS（每秒百万次理论运算）表示。
- **基准程序法**：运行一组标准程序衡量性能，最常用。
## 基准程序（逼真度由低到高）
- **核心程序**（从程序中抽取的关键代码）< **小型基准程序** < **合成基准程序**（Dhrystone 整数、Whetstone 浮点）< **真实的程序**。
- 常用基准：SPEC（CPU）、**TPC-C**（联机事务处理，指标 tpmC）、TPC-H（决策支持）、TPC-E。
## Amdahl 定律
- 系统加速比 = 1 / [(1 − f) + f / k]，f 为可改进部分所占比例，k 为该部分的加速倍数。
- 例：程序 40% 可提速 4 倍，总加速比 = 1 / (0.6 + 0.1) ≈ 1.43。结论：优化**占比大的部分**才有明显效果。
## 性能测试
- **负载测试**（逐步加压到预期峰值）、**压力测试**（超过峰值直至失效）、**稳定性测试**（长时间运行）、**基准测试**、**容量测试**。
!! 基准程序中"真实的程序"评测最准确；Amdahl 定律说明改进比例小的部分收益有限。`,

{id:'m3-1',g:'网络体系结构与协议',t:'OSI七层模型与TCP/IP模型',f:'高',sub:'七层功能与数据单元、TCP/IP四层、各层协议与设备、封装与解封装',
core:`## OSI 七层（自下而上）
- **物理层**：在介质上透明传输**比特流**，定义接口的机械、电气、功能、过程特性。设备：中继器、集线器。
- **数据链路层**：把比特组成**帧**，负责相邻结点间的可靠传输：成帧、**MAC 地址**寻址、差错检测（CRC）、流量控制。设备：网桥、**交换机**。
- **网络层**：传输**分组（数据包）**，负责**路由选择**与逻辑寻址（IP 地址）、拥塞控制。设备：**路由器**、三层交换机。
- **传输层**：提供**端到端（进程到进程）**的可靠或不可靠传输，**报文段/用户数据报**，端口号区分进程，分段与重组、差错与流量控制。
- **会话层**：建立、管理、终止会话，同步点。
- **表示层**：数据格式转换、**加密解密、压缩解压**。
- **应用层**：为应用程序提供网络服务（HTTP、FTP、SMTP、DNS 等）。设备：网关（应用层协议转换）。
## TCP/IP 四层
- **网络接口层**（对应物理层+数据链路层）、**网际层 IP**（IP、ICMP、ARP、IGMP）、**传输层**（TCP、UDP）、**应用层**（对应会话、表示、应用三层）。
- 教学中常用"五层模型"：物理、数据链路、网络、传输、应用。
## 封装与解封装
- 发送方自上而下逐层添加首部（数据链路层还加尾部 FCS）：数据 → 段 → 包 → 帧 → 比特；接收方自下而上逐层剥离。
!! "端到端"是传输层，"点到点（相邻结点）"是数据链路层，"主机到主机的路由"是网络层。
!! ARP 在 TCP/IP 中归网际层，但它工作于网络层与数据链路层之间，选择题常按"网络层"作答。`,

{id:'m3-2',g:'网络体系结构与协议',t:'TCP与UDP：连接管理、可靠传输与拥塞控制',f:'高',sub:'TCP与UDP对比、三次握手、四次挥手与TIME_WAIT、滑动窗口流量控制、慢开始/拥塞避免/快重传/快恢复',
core:`## TCP 与 UDP
- **TCP**：面向连接、可靠（序号、确认、超时重传）、面向字节流、**流量控制**（滑动窗口）、**拥塞控制**、全双工、首部最小 **20 字节**。
- **UDP**：无连接、不可靠、面向报文、无拥塞控制、首部 **8 字节**、开销小、实时性好，支持广播和多播。
## 三次握手（建立连接）
- ① 客户端 → **SYN=1, seq=x**（客户端进入 SYN_SENT）。
- ② 服务器 → **SYN=1, ACK=1, seq=y, ack=x+1**（服务器进入 SYN_RCVD）。
- ③ 客户端 → **ACK=1, seq=x+1, ack=y+1**，双方进入 ESTABLISHED。
- 为什么是三次：确认双方的发送和接收能力都正常，并防止**已失效的连接请求**被服务器误认为新连接。
## 四次挥手（释放连接）
- 主动方 FIN → 被动方 ACK（半关闭，被动方还可发数据）→ 被动方 FIN → 主动方 ACK。
- 主动关闭方进入 **TIME_WAIT**，等待 **2MSL** 后才真正关闭：确保最后一个 ACK 能到达、让旧连接的报文在网络中消失。
## 流量控制与拥塞控制
- **流量控制**：接收方通过**窗口字段 rwnd** 告诉发送方自己还能接收多少，防止**接收方**被淹没。
- **拥塞控制**：发送窗口 = min(rwnd, cwnd)，防止**网络**过载。
- **慢开始**：cwnd 从 1 开始，每个 RTT **翻倍**（指数增长）直到门限 ssthresh。
- **拥塞避免**：cwnd ≥ ssthresh 后每个 RTT **加 1**（线性增长）。
- **超时**：ssthresh = cwnd/2，cwnd 置为 1，重新慢开始。
- **快重传**：收到 **3 个重复 ACK** 立即重传丢失报文，不必等超时。
- **快恢复**：ssthresh = cwnd/2，cwnd = ssthresh（Reno），直接进入拥塞避免。
!! 流量控制针对"接收方"，拥塞控制针对"网络"。
!! 三次握手第二个报文同时置 SYN 和 ACK；ack 值是对方 seq + 1。`,

{id:'m3-3',g:'网络体系结构与协议',t:'应用层协议、端口与DNS解析',f:'高',sub:'HTTP/HTTPS、FTP主动与被动、SMTP/POP3/IMAP、DNS递归与迭代查询、DHCP、SNMP、Telnet/SSH、常用端口号',
core:`## 常用应用层协议与端口
- **HTTP 80 / HTTPS 443**（TCP）：HTTP/1.1 持久连接，HTTP/2 多路复用、头部压缩，HTTP/3 基于 **QUIC（UDP）**。
- **FTP**（TCP）：**控制连接 21、数据连接 20**（主动模式）；被动模式下数据端口由服务器随机指定。
- **SMTP 25**（发送邮件）、**POP3 110**（下载邮件）、**IMAP 143**（在服务器管理邮件）。
- **DNS 53**：查询一般用 **UDP**，区域传送用 TCP。
- **DHCP 67（服务器）/ 68（客户端）**：UDP。
- **SNMP 161（代理）/ 162（Trap）**：UDP，网络管理。
- **Telnet 23**（明文）、**SSH 22**（加密远程登录）、TFTP 69（UDP）、RDP 3389。
## DNS 域名解析
- 域名空间为树形：根 → 顶级域（.com、.cn）→ 二级域 → 主机。
- **递归查询**：主机向**本地域名服务器**发出，本地服务器负责给出最终结果。
- **迭代查询**：本地域名服务器依次询问**根域名服务器 → 顶级域名服务器 → 权限（权威）域名服务器**，每次得到的是"下一步该问谁"。
- 解析顺序：浏览器缓存 → 本机 hosts 与系统缓存 → 本地 DNS 服务器（缓存）→ 迭代查询。
- 记录类型：A（IPv4）、AAAA（IPv6）、CNAME（别名）、MX（邮件）、NS（域名服务器）、PTR（反向解析）。
## 网络管理 SNMP
- 组成：**管理站（NMS）、代理（Agent）、管理信息库 MIB**；操作：Get、GetNext、Set、**Trap**（代理主动上报告警）。
!! 基于 UDP 的应用协议：DNS 查询、DHCP、SNMP、TFTP、RIP；容易误选为 TCP。
!! 主机到本地DNS一般是递归，本地DNS到根/顶级/权威一般是迭代。`,

{id:'m3-4',g:'网络体系结构与协议',t:'IP、ARP、ICMP、NAT与DHCP',f:'中',sub:'IPv4首部与TTL、分片、ARP工作过程与ARP欺骗、ICMP与ping/traceroute、NAT类型、DHCP四步过程',
core:`## IP 协议
- 无连接、尽力而为。IPv4 首部最小 **20 字节**，重要字段：版本、首部长度、总长度、标识/标志/片偏移（**分片**）、**TTL**（每经过一个路由器减 1，为 0 时丢弃并发 ICMP 超时）、协议（6=TCP，17=UDP）、首部校验和、源/目的 IP。
- 以太网 **MTU 为 1500 字节**，超过 MTU 的 IP 分组需分片，在**目的主机**重组。
## ARP
- 把 **IP 地址解析为 MAC 地址**。主机先查 ARP 缓存，没有则**广播** ARP 请求，目标主机**单播**应答。
- 跨网段通信时，主机解析的是**默认网关**的 MAC 地址。
- **ARP 欺骗**：攻击者伪造 ARP 应答，篡改 IP 与 MAC 的对应关系，实现中间人攻击。防范：静态 ARP 绑定、交换机 DAI（动态 ARP 检测）。
- RARP：MAC → IP（已基本被 DHCP 取代）。
## ICMP
- 网际控制报文协议，封装在 IP 中，用于**差错报告与查询**：目的不可达、超时、重定向、回送请求/应答。
- **ping** 使用回送请求/应答；**traceroute（tracert）** 利用 TTL 逐跳递增与超时报文探测路径。
## NAT
- 在私有地址与公网地址之间转换，节约公网地址、隐藏内网结构。
- **静态 NAT**（一对一固定）、**动态 NAT**（地址池动态分配）、**NAPT/PAT**（多个私网地址共享一个公网 IP，用端口区分，最常用）。
## DHCP（UDP 67/68）
- **Discover（广播）→ Offer → Request（广播）→ ACK**。
- 获取失败时 Windows 会自动配置 **169.254.x.x**（APIPA）地址。
- 租约到期 50% 时尝试续约。跨网段时需在路由器上配置 **DHCP 中继**。
!! ARP 请求是广播、应答是单播；DHCP 的 Discover 和 Request 都是广播。
!! IP 分片在目的主机重组，中间路由器不重组。`,

{id:'m3-5',g:'IP地址与子网',t:'IPv4地址分类与子网划分',f:'高',sub:'A/B/C/D/E类、特殊地址、私有地址、子网掩码、网络地址与广播地址、可用主机数、子网数计算',
core:`## IPv4 地址分类
- **A 类**：首位 0，**1~126**，默认掩码 /8；**B 类**：首位 10，**128~191**，/16；**C 类**：首位 110，**192~223**，/24。
- D 类：224~239，**组播**；E 类：240~255，保留。
- 特殊地址：**127.0.0.0/8 环回**；0.0.0.0 本网/默认路由；255.255.255.255 受限广播；主机位全 0 为**网络地址**，主机位全 1 为**直接广播地址**。
- **私有地址**：**10.0.0.0/8、172.16.0.0~172.31.255.255（/12）、192.168.0.0/16**；169.254.0.0/16 为链路本地地址。
## 子网划分计算
- 子网掩码中 1 对应网络位，0 对应主机位。前缀 /n 表示掩码有 n 个 1。
- **可用主机数 = 2^(32−n) − 2**（去掉网络地址和广播地址）。
- 从主机位借 m 位可划分 **2^m 个子网**。
- **块大小 = 256 − 掩码中非 255 的那个字节值**：/25 → 128，/26 → 64，/27 → 32，/28 → 16，/29 → 8，/30 → 4。
- 求所在网络：IP 与掩码按位与；简便法：在相应字节找"块大小的整数倍"。
- 例：192.168.5.130/26：块大小 64，130 落在 128~191 → 网络地址 .128，广播 .191，可用 .129~.190。
## 常见题型
- 已知主机数求掩码：取最小的 h 使 2^h − 2 ≥ 主机数，前缀 = 32 − h。
- 已知子网数求掩码：取最小的 m 使 2^m ≥ 子网数。
!! 求可用主机数要减 2；/31 一般用于点对点链路（特殊），/32 表示单个主机路由。`,

{id:'m3-6',g:'IP地址与子网',t:'CIDR路由汇聚与VLSM',f:'高',sub:'无类域间路由、超网、最长公共前缀、汇聚陷阱、最长前缀匹配转发、VLSM分配步骤',
core:`## CIDR 无类域间路由
- 取消 A/B/C 分类，使用"**网络前缀/前缀长度**"表示，可灵活划分子网，也可把多个连续网络合并为一个**超网**（路由汇聚），减少路由表项。
## 路由汇聚方法
- ① 把各网络地址中**不同的那个字节**写成二进制；② 找**最长公共前缀**；③ 前缀长度 = 前面相同字节的位数 + 该字节公共位数；④ 其余位置 0 得到汇聚地址。
- 例 1：172.16.8.0/24 ~ 172.16.11.0/24：8~11 = 000010**00**~000010**11**，公共 6 位，汇聚为 **172.16.8.0/22**。
- 例 2（陷阱）：192.168.1.0/24 与 192.168.2.0/24：1 = 00000001，2 = 00000010，公共前 6 位，汇聚为 **192.168.0.0/22**，而不是 192.168.1.0/23（/23 只能覆盖 0、1 两个网段）。
- 汇聚后的地址必须是块大小的整数倍；汇聚可能包含不存在的网段，需注意路由黑洞。
## 最长前缀匹配
- 路由器转发时，若多条路由都匹配目的地址，选择**前缀最长（最具体）**的那一条；默认路由 0.0.0.0/0 匹配一切但优先级最低。
## VLSM 可变长子网掩码
- 在同一个地址块中为不同子网使用不同长度的掩码，按需分配，提高利用率。
- 步骤：**按主机数从大到小排序** → 为最大的子网分配满足需求的最小块 → 依次在剩余空间中对齐分配 → 点对点链路用 /30。
!! 汇聚时一定要把"不同的字节"转成二进制求公共前缀，不能只看十进制数是否连续。`,

{id:'m3-7',g:'IP地址与子网',t:'IPv6',f:'中',sub:'IPv6地址长度与表示、压缩规则、地址类型、特殊地址、首部特点、IPv4到IPv6过渡技术',
core:`## 地址表示
- 长度 **128 位**，写成 8 组 16 位十六进制数，以冒号分隔（冒分十六进制）。
- 压缩规则：每组的**前导 0 可省略**；连续的全 0 组可用"**::**"代替，但**一个地址中只能使用一次**。例：2001:0DB8:0000:0000:0000:0000:1428:57AB → 2001:DB8::1428:57AB。
## 地址类型
- **单播**（全球单播 2000::/3、**链路本地 FE80::/10**、唯一本地 FC00::/7）、**组播**（FF00::/8）、**任播**（发给一组接口中"最近"的一个）。
- **没有广播地址**，由组播替代。
- 特殊地址：**::1 环回**，:: 未指定地址。
## 首部与特性
- 基本首部**固定 40 字节**，取消了首部校验和，选项放在**扩展首部**中；**只有源主机分片**，路由器不分片（依靠路径 MTU 发现）。
- 支持**无状态地址自动配置（SLAAC）**，内置对 IPsec 的支持，流标签用于 QoS。
## 过渡技术
- **双协议栈**：主机/路由器同时运行 IPv4 与 IPv6。
- **隧道技术**：把 IPv6 分组封装在 IPv4 中穿越 IPv4 网络（6to4、ISATAP 等）。
- **协议翻译**：NAT64/DNS64，使 IPv6 主机访问 IPv4 资源。
!! "::"只能出现一次；IPv6 取消了广播；路由器不再对 IPv6 分组分片。`,

cs:{bg:'某政务云平台按要求推进IPv6规模部署，现有大量仅支持IPv4的后端系统，同时要求公众可通过IPv6访问门户网站。',

{id:'m3-8',g:'局域网与网络设备',t:'网络设备、冲突域与广播域',f:'中',sub:'中继器与集线器、网桥与交换机、路由器、三层交换机、网关、冲突域与广播域计算、交换机转发方式',
core:`## 各层设备
- **物理层**：**中继器**（信号再生放大）、**集线器 Hub**（多端口中继器）。所有端口在**同一冲突域、同一广播域**。
- **数据链路层**：**网桥**、**交换机**。根据 **MAC 地址表**转发，**每个端口是独立冲突域**；默认所有端口在**同一广播域**（可用 VLAN 分割）。
- MAC 地址表通过**自学习**建立：记录帧的源 MAC 与入端口；目的 MAC 未知时**泛洪**。
- 交换方式：**直通式**（读到目的 MAC 即转发，延迟最小，不检错）、**存储转发**（完整接收并 CRC 校验后转发，可靠，最常用）、**无碎片**（读前 64 字节后转发）。
- **网络层**：**路由器**，根据 IP 地址与路由表转发，**每个接口是独立广播域**，隔离广播。**三层交换机**：硬件实现 VLAN 间路由，"一次路由、多次交换"，转发速度快。
- **应用层**：**网关**，实现不同协议体系之间的转换。
## 冲突域与广播域计算
- 集线器：整个集线器 = 1 个冲突域。
- 交换机：冲突域个数 = 端口数（连接的段数）；广播域 = VLAN 个数（未划分时为 1）。
- 路由器：广播域个数 = 接口数（连接的网段数）。
!! 交换机隔离冲突域、路由器隔离广播域；VLAN 在二层分割广播域。`,

cs:{bg:'某老旧办公楼仍使用若干集线器级联组网，用户抱怨网速慢、经常卡顿；网络管理员计划改造。',

  ['给出改造方案。','用交换机替换集线器，每端口独享带宽、冲突域隔离；按部门划分VLAN缩小广播域；用三层交换机实现VLAN间路由；核心与接入层采用层次化设计。']],

{id:'m3-9',g:'局域网与网络设备',t:'以太网、VLAN、STP与无线局域网',f:'中',sub:'CSMA/CD与最小帧长、VLAN划分方式与802.1Q、Access/Trunk、STP根桥选举与端口角色、链路聚合、802.11与CSMA/CA',
core:`## 以太网
- 介质访问控制：**CSMA/CD**（载波监听多路访问/冲突检测）："先听后发、边发边听、冲突停发、随机延迟后重发（二进制指数退避）"，用于**半双工**共享介质；全双工交换网络中已不需要。
- 以太网最小帧长 **64 字节**（保证冲突能被检测到），最大帧长 1518 字节（数据部分最大 1500，即 MTU）。
- 标准：快速以太网 100BASE-T、千兆 1000BASE-T、万兆 10GBASE。双绞线最大传输距离 **100 米**。
## VLAN
- 在交换机上把一个物理局域网**逻辑划分为多个广播域**，与物理位置无关。
- 划分方式：**基于端口**（静态，最常用）、基于 MAC 地址、基于协议、基于 IP 子网（动态）。
- **IEEE 802.1Q**：在以太网帧中插入 **4 字节标签**，其中 **12 位 VID**（可用 1~4094）、3 位优先级（802.1p）。
- 端口类型：**Access**（属于一个 VLAN，连接终端，收发不带标签）、**Trunk**（承载多个 VLAN，连接交换机，帧带标签）、Hybrid。
- **VLAN 间通信必须经过三层设备**（三层交换机 SVI 或路由器单臂路由）。
## STP 生成树协议（802.1D）
- 目的：在有冗余链路的交换网络中**阻塞部分端口，消除二层环路与广播风暴**；链路故障时自动恢复备份链路。
- 过程：选举**根桥**（**桥 ID 最小**：优先级 + MAC）→ 每个非根桥选**根端口**（到根桥开销最小）→ 每个网段选**指定端口** → 其余端口**阻塞**。
- RSTP（802.1w）收敛更快；MSTP（802.1s）支持多实例、按 VLAN 负载分担。
- **链路聚合**（802.3ad/LACP）：把多条物理链路捆绑为一条逻辑链路，增加带宽并提供冗余。
## 无线局域网
- IEEE **802.11** 系列，介质访问控制采用 **CSMA/CA**（冲突避免，含 RTS/CTS 机制），因为无线无法边发边检测冲突。
- 802.11n（Wi-Fi 4）、802.11ac（Wi-Fi 5）、**802.11ax（Wi-Fi 6）**；安全：WPA2/**WPA3**。
!! 有线以太网用 CSMA/CD，无线局域网用 CSMA/CA。
!! STP 根桥选"桥 ID 最小"的，不是性能最好的。`,
fig:[{k:'graph',t:'STP 消除环路演示：三台交换机构成环路',w:340,h:220,bw:96,bh:36,n:[['SW1 根桥',170,36,0],['SW2',60,180,2],['SW3',280,180,2]],e:[[0,1,'',0],[0,2,'',0],[1,2,'',0]],noarrow:true,
  steps:[{hl:['e0','e1','e2'],cap:'三台交换机两两相连形成环路，广播帧会在环中无限循环，造成广播风暴。'},
   {hl:['n0'],cap:'选举根桥：比较桥 ID（优先级 + MAC），最小的 SW1 成为根桥，根桥所有端口都是指定端口。'},

{id:'m3-10',g:'局域网与网络设备',t:'路由协议：静态路由、RIP、OSPF与BGP',f:'中',sub:'静态与默认路由、距离矢量与链路状态、RIP特点与计数到无穷、OSPF区域与Dijkstra、BGP路径矢量、管理距离、VRRP',
core:`## 静态路由与动态路由
- **静态路由**：管理员手工配置，开销小、安全，但不能自动适应拓扑变化，适合小型或末端网络。**默认路由** 0.0.0.0/0 匹配所有目的地址。
- **动态路由**按作用范围分为：**内部网关协议 IGP**（RIP、OSPF、IS-IS）和**外部网关协议 EGP**（BGP）。
## RIP（距离矢量）
- 以**跳数**为度量，**最大 15 跳，16 表示不可达**；每 **30 秒**向邻居广播整张路由表；基于 **UDP 520**。
- 问题：收敛慢、"**计数到无穷**"；解决：**水平分割、毒性逆转、触发更新、抑制计时器**。
- 适用于小型网络。RIPv2 支持 VLSM 与认证、组播更新。
## OSPF（链路状态）
- 各路由器通过 Hello 发现邻居、泛洪 **LSA** 建立相同的**链路状态数据库**，再用 **Dijkstra（SPF）算法**计算最短路径树。
- 度量为**开销 cost**（与带宽成反比）；支持 **VLSM、区域划分**（**骨干区域 Area 0**，其他区域必须与 Area 0 相连）；收敛快、无环路；直接封装在 **IP（协议号 89）**。
- 适用于大中型网络。
## BGP（路径矢量）
- **自治系统 AS 之间**交换路由的 EGP，基于 **TCP 179**，交换的是到达目的网络的 **AS 路径**，便于策略控制与防环。
## 管理距离与网关冗余
- 多种路由来源时比较**管理距离**（可信度，越小越优先）：直连 0、静态 1、OSPF 110、RIP 120。
- **VRRP**：多台路由器组成虚拟路由器，共享一个虚拟 IP 作为网关，主设备故障时备份设备接管。
!! RIP 的"16"表示不可达；OSPF 的非骨干区域必须连接到 Area 0。`,

{id:'m3-11',g:'网络规划与存储',t:'网络规划设计与层次化网络结构',f:'中',sub:'网络生命周期五阶段、需求分析内容、逻辑网络设计与物理网络设计、核心/汇聚/接入层职责、可靠性设计、网络测试',
core:`## 网络生命周期（五阶段迭代模型）
- **需求规范**：业务需求、用户需求、应用需求、计算机平台需求、网络需求（带宽、时延、可靠性、安全），输出需求说明书。
- **通信规范**：分析网络通信模式（客户端/服务器、对等）、流量特征与边界，估算流量，输出通信规范说明书。
- **逻辑网络设计**：网络结构设计、物理层技术选择、局域网与广域网技术选择、**地址设计与命名模型**、路由协议选择、**网络管理与安全设计**，输出逻辑网络设计文档。
- **物理网络设计**：**设备选型**、结构化布线设计、机房环境设计，输出物理设计文档及软硬件清单与费用估算。
- **实施阶段**：设备安装调试、测试、试运行、用户培训、验收。
## 层次化网络设计
- **核心层**：高速转发、冗余互联、快速收敛；**不做**包过滤、复杂 QoS 等耗时策略。
- **汇聚层**：网络流量汇聚、**路由汇聚、VLAN 间路由、访问控制（ACL）、策略与 QoS**，是策略执行点。
- **接入层**：终端接入、端口安全、带宽控制、**PoE 供电**、用户认证（802.1X）。
- 优点：结构清晰、易扩展、易定位故障、便于实施策略。
## 可靠性与可用性设计
- 设备冗余（双核心、堆叠、双电源）、链路冗余（双上联、链路聚合）、**网关冗余（VRRP）**、出口多运营商、STP 防环、UPS 与机房环境冗余。
- 负载均衡：链路负载均衡、服务器负载均衡（四层 LVS、七层 Nginx）。
## 网络测试
- 连通性、性能（吞吐量、时延、丢包率）、可靠性、安全性测试；常用工具：ping、traceroute、iperf、抓包分析。
!! 访问控制与策略放在**汇聚层**，核心层只做高速交换。
!! 设备选型属于"物理网络设计"，地址规划与安全设计属于"逻辑网络设计"。`,

{id:'m3-12',g:'网络规划与存储',t:'网络存储技术与综合布线',f:'中',sub:'DAS、NAS、SAN（FC-SAN与IP-SAN/iSCSI）、对象存储、综合布线六个子系统',
core:`## 网络存储
- **DAS 直连存储**：存储设备直接连接服务器（SCSI、SAS），简单、成本低，但难以共享和扩展。
- **NAS 网络附加存储**：通过以太网提供**文件级**访问，协议 **NFS（UNIX/Linux）、CIFS/SMB（Windows）**；易于共享，适合文件服务。
- **SAN 存储区域网络**：独立的存储网络，向服务器提供**块级**访问（服务器看到的是"磁盘"）。
- **FC-SAN**：光纤通道，高性能、高成本。
- **IP-SAN**：基于以太网的 **iSCSI**（在 TCP/IP 上传输 SCSI 命令），成本低、部署灵活。
- 适合数据库、虚拟化等对性能要求高的场景。
- **对象存储**：以对象（数据 + 元数据 + ID）为单位，通过 HTTP RESTful API（如 S3）访问，扁平命名空间，易于海量扩展，适合图片、视频、备份等非结构化数据。
## 综合布线系统（六个子系统）
- **工作区子系统**：终端设备到信息插座（跳线、插座）。
- **水平子系统**：从信息插座到楼层配线间（双绞线，**≤ 90 米**，加跳线共 100 米）。
- **管理子系统**：楼层配线间的配线架与交叉连接。
- **垂直干线子系统**：楼层配线间到设备间（光纤或大对数电缆）。
- **设备间子系统**：放置主要网络设备与主配线架的机房。
- **建筑群子系统**：多栋建筑之间的连接（室外光缆）。
!! NAS 是文件级、SAN 是块级；iSCSI 属于 IP-SAN 而不是 NAS。`,

{id:'m3-13',g:'新型网络技术',t:'物联网体系结构与通信技术',f:'中',sub:'物联网三层/四层架构、感知层技术、RFID、近距离通信、LPWAN（NB-IoT/LoRa）、MQTT与CoAP',
core:`## 体系结构
- **感知层**：识别物体、采集信息——**RFID、传感器、二维码、摄像头、GPS**；以及执行器。
- **网络层**：传输信息——接入网（ZigBee、蓝牙、Wi-Fi、NB-IoT、LoRa、4G/5G）、核心网、互联网、**物联网网关**（协议转换）。
- **应用层**：应用支撑平台（设备管理、数据处理、云计算）与行业应用。
- 四层划分在网络层与应用层之间增加**平台层**（设备接入、物模型、规则引擎、数据存储与分析）。
## 感知与近距离通信
- **RFID**：由**标签、阅读器、天线**组成；无源标签靠阅读器能量工作；按频率分低频、高频（13.56MHz，NFC 属于此类）、超高频（远距离、仓储物流）。
- **ZigBee**：低功耗、低速率、自组网（网状网），适合传感网络；**蓝牙 BLE** 低功耗短距离；**NFC** 极近距离（约 10cm），用于支付门禁。
## 低功耗广域网 LPWAN
- **NB-IoT**：运营商授权频谱，覆盖广、穿透强、功耗低、海量连接，适合表计、停车。
- **LoRa**：非授权频谱，可自建网络，距离远、功耗低。
- 共同特点：**低功耗、广覆盖、低速率、海量连接、低成本**。
## 应用层协议
- **MQTT**：基于 **TCP** 的**发布/订阅**协议，由 **Broker** 转发；报文头小（最小 2 字节）；**QoS 0（至多一次）、1（至少一次）、2（恰好一次）**；支持遗嘱消息、保留消息、心跳保活。
- **CoAP**：基于 **UDP** 的 RESTful 协议（GET/POST/PUT/DELETE），适合资源极受限设备。
- HTTP：通用但开销大。
!! MQTT 基于 TCP、CoAP 基于 UDP；MQTT 是发布/订阅，CoAP 是请求/响应。`,

{id:'m3-14',g:'新型网络技术',t:'5G移动通信与SDN/NFV',f:'中',sub:'移动通信演进、5G三大场景与关键指标、网络切片、MEC、大规模MIMO、SDN三层架构与南北向接口、NFV',
core:`## 5G 三大应用场景
- **eMBB 增强移动宽带**：超高速率，4K/8K 视频、VR/AR。
- **uRLLC 超高可靠低时延通信**：**毫秒级时延**、高可靠，自动驾驶、工业控制、远程手术。
- **mMTC 海量机器类通信**：每平方公里百万级连接、低功耗，智能表计、环境监测。
- 关键指标：峰值速率约 20Gbps、用户体验速率 100Mbps、空口时延约 1ms、连接密度 10⁶/km²。
## 5G 关键技术
- **大规模 MIMO**（大量天线、波束赋形）、**毫米波**、超密集组网、新型多址。
- **网络切片**：基于 SDN/NFV，在同一物理网络上划分多个**逻辑隔离的端到端虚拟网络**，按业务定制带宽、时延、可靠性。
- **MEC 多接入边缘计算**：把计算与存储下沉到靠近基站的边缘，降低时延、减少回传带宽。
- **服务化架构 SBA**：核心网功能以服务形式提供，控制面与用户面分离（CUPS）。
## SDN 软件定义网络
- 核心思想：**控制平面与数据平面分离**、集中控制、网络可编程。
- 三层：**应用层**（网络应用）— **控制层**（SDN 控制器，集中管理全网视图）— **基础设施层**（转发设备）。
- **南向接口**：控制器与转发设备之间（如 **OpenFlow**）；**北向接口**：控制器向上层应用开放（REST API）。
## NFV 网络功能虚拟化
- 把防火墙、负载均衡、路由器等网络功能从专用硬件**迁移到通用服务器上的虚拟机/容器**中运行，降低成本、快速部署。
- SDN 关注"控制与转发分离"，NFV 关注"网络功能软件化"，二者互补。
!! 自动驾驶、工业控制对应 uRLLC；SDN 的南向接口是 OpenFlow，北向接口面向应用。`,

{id:'m4-1',g:'数据库基础',t:'数据库系统结构：三级模式与两级映像',f:'高',sub:'DB/DBMS/DBS、外模式/模式/内模式、两级映像、逻辑独立性与物理独立性、视图与基本表',
core:`## 基本概念
- **数据库 DB**：长期存储、有组织、可共享的数据集合；**DBMS**：管理数据库的系统软件（定义、操纵、控制、维护）；**DBS** = DB + DBMS + 应用 + DBA + 用户。
- 数据库管理阶段的特点：数据**结构化**、**共享性高、冗余度低**、**独立性高**、由 DBMS 统一管理控制（安全性、完整性、并发控制、恢复）。
## 三级模式
- **外模式**（子模式、用户模式）：某个用户/应用看到的局部逻辑结构，对应**视图**；一个数据库可以有**多个**外模式。
- **概念模式**（模式、逻辑模式）：全体数据的全局逻辑结构与特征，对应**基本表**；**只有一个**。
- **内模式**（存储模式）：数据的物理存储结构与存取方式（索引、存储文件、压缩）；**只有一个**。
## 两级映像与数据独立性
- **外模式/模式映像**：模式改变（如增加列、拆分表）时，DBA 修改该映像使外模式不变 → 应用程序不变 → **逻辑独立性**。
- **模式/内模式映像**：存储结构改变（如换存储设备、改索引、分区）时，修改该映像使模式不变 → **物理独立性**。
## 视图
- 视图是从基本表导出的**虚表**，数据库中只存储视图的定义；作用：简化查询、提供**安全保护**（只暴露部分行列）、提供逻辑独立性。
- 可更新视图：一般要求来自单表、不含聚集函数、DISTINCT、GROUP BY；WITH CHECK OPTION 保证通过视图插入/修改的数据满足视图条件。
!! "存储结构变了而应用不改"是物理独立性；"表结构变了而应用不改"是逻辑独立性，两者对应不同的映像。`,
fig:[{k:'layers',t:'三级模式与两级映像（动态演示一次存储迁移）',anim:true,items:[['外模式','用户视图（可以有多个），面向应用'],['外模式/模式映像','保证逻辑独立性'],['概念模式','全局逻辑结构（只有一个），对应基本表'],['模式/内模式映像','保证物理独立性'],['内模式','存储结构与存取方式（只有一个）']],caps:['应用程序只通过视图或 SQL 访问数据。','若 DBA 把一张表拆成两张，只需修改视图定义（外模式/模式映像），应用看到的视图不变。','全局逻辑结构是数据库的核心。','若把表迁移到 SSD 分区表、调整索引，只需修改模式/内模式映像。','存储层的变化被两级映像屏蔽，应用程序无需修改。']},

{id:'m4-2',g:'数据库基础',t:'数据模型、关系模型与完整性约束',f:'中',sub:'概念模型与逻辑模型、层次/网状/关系模型、关系术语、候选键/主键/外键、实体完整性、参照完整性、用户定义完整性',
core:`## 数据模型
- 三要素：**数据结构、数据操作、数据的完整性约束**。
- 分类：**概念模型**（E-R 模型，面向用户）；**逻辑模型**（层次模型——树、网状模型——图、**关系模型**——二维表、面向对象模型）；**物理模型**。
## 关系模型术语
- **关系**：一张二维表；**元组**：一行；**属性**：一列；**域**：属性的取值范围；**关系模式**：R(A1, A2, …, An)。
- **候选键（码）**：能唯一标识元组且**不含多余属性**的属性组；**主键**：从候选键中选定一个；**主属性**：包含在任一候选键中的属性；**外键**：本关系中引用另一关系主键的属性。
- **全码**：所有属性共同组成候选键。
- 关系的性质：列同质、列顺序无关、行顺序无关、**任意两个元组不能完全相同**、分量必须是原子值（1NF）。
## 完整性约束
- **实体完整性**：主键的属性**不能为空**且唯一。
- **参照完整性**：外键的值**要么为空，要么等于被参照关系中某个元组的主键值**。违约处理：拒绝、级联删除/更新、置空。
- **用户定义完整性**：针对具体业务的约束，如年龄 0~150、性别只能是男/女（CHECK、NOT NULL、UNIQUE）。
- 触发器可实现更复杂的完整性规则。
!! 外键可以为空（表示暂无关联），但主键不能为空。`,

{id:'m4-3',g:'数据库基础',t:'关系代数运算',f:'高',sub:'并差交笛卡尔积、选择与投影、θ连接与等值连接、自然连接、外连接、除法、与SQL的对应、表达式优化',
core:`## 传统集合运算（要求关系结构相同）
- **并 R∪S**、**差 R−S**、**交 R∩S**（交可由差导出：R∩S = R − (R − S)）。
- **笛卡尔积 R×S**：属性数相加，元组数相乘。
## 专门的关系运算
- **选择 σ**：按条件选取**行**（元组），对应 SQL 的 WHERE。
- **投影 π**：选取**列**（属性），并去掉重复元组，对应 SELECT 列（DISTINCT）。
- **θ 连接**：从 R×S 中选取满足条件的元组；**等值连接**：θ 为"="。
- **自然连接 R⋈S**：在**所有同名属性**上做等值连接，并**去掉重复的同名列**。属性数 = R 属性数 + S 属性数 − 同名属性数。
- **外连接**：左外连接保留左表所有元组，右外连接保留右表所有元组，全外连接两边都保留，不匹配处填 NULL。
- **除 R÷S**：找出 R 中与 S 的**全部**元组都有联系的那些值，用于"选修了全部课程的学生"类查询。
## 基本运算
- **五种基本运算：并、差、笛卡尔积、选择、投影**；交、连接、除都可由它们导出。
## 查询优化原则
- **尽早执行选择**（减少中间结果）、投影与选择同时进行、把选择与其前面的笛卡尔积结合成连接。
!! 先投影再选择时，若条件属性被投影掉就无法选择；表达式中"列号"写法如 π1,3 表示第1、3列。`,

{id:'m4-4',g:'数据库基础',t:'SQL语言：查询、视图与权限',f:'中',sub:'DDL/DML/DCL、SELECT执行顺序、GROUP BY与HAVING、聚集函数、子查询、索引、GRANT与REVOKE、触发器与存储过程',
core:`## SQL 分类
- **DDL 数据定义**：CREATE、ALTER、DROP（表、视图、索引）。
- **DML 数据操纵**：SELECT、INSERT、UPDATE、DELETE。
- **DCL 数据控制**：GRANT、REVOKE；事务控制：COMMIT、ROLLBACK。
## SELECT 的书写顺序与执行顺序
- 书写：SELECT → FROM → WHERE → GROUP BY → HAVING → ORDER BY。
- 执行：**FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY**。
- **WHERE** 在分组前过滤**行**，不能使用聚集函数；**HAVING** 在分组后过滤**组**，可以使用聚集函数。
- 聚集函数：COUNT、SUM、AVG、MAX、MIN；COUNT(*) 统计行数，COUNT(列) 不统计 NULL。
- 子查询：IN、EXISTS、ANY/ALL；相关子查询每行执行一次。
## 索引
- 加快查询，但降低插入/更新速度、占用空间；适合**经常出现在 WHERE、JOIN、ORDER BY 中且选择性高**的列。
- B+ 树索引适合范围查询；哈希索引适合等值查询；聚簇索引决定数据的物理存放顺序（一张表只能有一个）。
- 索引失效常见情况：对索引列使用函数或运算、隐式类型转换、前导模糊查询（LIKE '%abc'）、复合索引不满足最左前缀。
## 权限
- GRANT 权限 ON 对象 TO 用户 [**WITH GRANT OPTION**]（允许被授权者再授权给他人）。
- REVOKE 权限 ON 对象 FROM 用户 [CASCADE]（级联收回其转授的权限）。
## 触发器与存储过程
- **触发器**：在 INSERT/UPDATE/DELETE 事件发生时自动执行，用于完整性检查、审计日志。
- **存储过程**：预编译的 SQL 程序，减少网络传输、提高性能，但可移植性差、业务逻辑分散。
!! WHERE 不能直接使用聚集函数，分组后的条件要写在 HAVING 中。`,

{id:'m4-5',g:'规范化理论',t:'函数依赖、Armstrong公理与候选键求解',f:'高',sub:'函数依赖、完全/部分/传递依赖、Armstrong公理及推论、属性闭包、候选键求解方法、最小函数依赖集',
core:`## 函数依赖
- X → Y：X 的值确定时 Y 的值唯一确定。
- **完全函数依赖**：Y 依赖于整个 X，不依赖 X 的任何真子集。
- **部分函数依赖**：Y 只依赖于 X 的一部分（如 (学号,课程号) → 姓名，而 学号 → 姓名）。
- **传递函数依赖**：X → Y、Y → Z，且 Y ↛ X，则 Z 传递依赖于 X。
## Armstrong 公理
- **自反律**：若 Y ⊆ X，则 X → Y。
- **增广律**：若 X → Y，则 XZ → YZ。
- **传递律**：若 X → Y、Y → Z，则 X → Z。
- 推论：**合并规则**（X→Y、X→Z ⇒ X→YZ）、**分解规则**（X→YZ ⇒ X→Y、X→Z）、**伪传递规则**（X→Y、WY→Z ⇒ WX→Z）。
## 属性闭包 X⁺
- 从 X 出发，反复应用 F 中的依赖，能推出的所有属性的集合。若 X⁺ 包含全部属性，X 是超键。
## 候选键求解（图示法）
- 把属性分为四类：**只出现在左边（L 类）**、只出现在右边（R 类）、左右都出现（LR 类）、都不出现（N 类）。
- **L 类和 N 类属性必定在每个候选键中；R 类属性必定不在候选键中**。
- 求 (L ∪ N)⁺：若已是全部属性，它就是唯一候选键；否则逐个加入 LR 类属性再求闭包。
- 例：R(A,B,C,D,E)，F = {A→B, BC→D, D→E}：A、C 只在左边 → (AC)⁺ = ABCDE，候选键 **AC**。
- 例：R(A,B,C,D)，F = {A→B, B→C, C→D, D→A}：全是 LR 类，A⁺ = ABCD，同理 B、C、D 都是候选键，共 **4 个**。
## 最小函数依赖集
- 右部都是单属性；没有多余的函数依赖；左部没有多余属性。
!! 只出现在依赖右边的属性一定不是候选键的组成部分，可以快速排除选项。`,

{id:'m4-6',g:'规范化理论',t:'范式判断与模式分解',f:'高',sub:'1NF/2NF/3NF/BCNF/4NF、范式判断步骤、插入删除更新异常、无损连接判定、保持函数依赖、3NF与BCNF分解',
core:`## 范式定义
- **1NF**：所有属性都是**不可再分**的原子值。
- **2NF**：满足 1NF，且**非主属性完全函数依赖于候选键**（消除非主属性对候选键的**部分**依赖）。
- **3NF**：满足 2NF，且**非主属性不传递依赖于候选键**（消除非主属性对候选键的**传递**依赖）。
- **BCNF**：满足 1NF，且**每个函数依赖 X→Y（Y⊄X）的决定因素 X 都包含候选键**（消除主属性对候选键的部分与传递依赖）。
- **4NF**：消除非平凡且非函数依赖的**多值依赖**。
- 关系：BCNF ⊂ 3NF ⊂ 2NF ⊂ 1NF。
## 范式判断步骤
- ① 求候选键，分出主属性与非主属性；② 看非主属性有无部分依赖（判 2NF）；③ 有无传递依赖（判 3NF）；④ 所有决定因素是否都含候选键（判 BCNF）。
- 结论技巧：候选键是**单属性**的 1NF 关系一定是 2NF；**全部属性都是主属性**的关系至少是 3NF；全码的关系是 BCNF。
- 例：R(S, T, J)（学生、教师、课程），F = {SJ→T, T→J}：候选键 SJ、ST，全部属性都是主属性 → 3NF；但 T→J 中 T 不含候选键 → 不是 BCNF。
## 规范化不足的问题
- **数据冗余、更新异常、插入异常、删除异常**。
## 模式分解
- **无损连接**（分解为 R1、R2）：(R1∩R2) → (R1−R2) 或 (R1∩R2) → (R2−R1) 成立。多个子模式用**表格法（Chase）**判定。
- **保持函数依赖**：分解后各子模式上的依赖之并的闭包等于原 F⁺。
- 分解到 **3NF**：一定能做到**既无损连接又保持函数依赖**；分解到 **BCNF**：能保证无损连接，但**不一定**保持函数依赖。
!! 判断 2NF、3NF 只看"非主属性"；BCNF 要看"所有"决定因素。`,

{id:'m4-7',g:'数据库设计',t:'数据库设计流程与E-R模型',f:'中',sub:'六个设计阶段与产出、E-R图要素、联系类型与基数、弱实体、局部E-R图集成冲突',
core:`## 数据库设计六阶段
- **需求分析**：调研业务，用**数据流图 DFD**、**数据字典 DD** 描述，输出需求说明书。
- **概念结构设计**：建立**E-R 模型**，**独立于任何 DBMS**；方法：自顶向下、自底向上（先局部 E-R 图再集成，最常用）、逐步扩张、混合策略。
- **逻辑结构设计**：把 E-R 图转换为**关系模式**，进行规范化与优化，设计外模式（视图）。
- **物理结构设计**：确定存储结构与存取方法——**索引、聚簇、分区**、存储位置、参数配置。
- **数据库实施**：建库、编写与调试应用、**数据载入**、试运行。
- **运行与维护**：备份恢复、安全与完整性控制、性能监控与调优、**重组与重构**。
## E-R 模型
- **实体**（矩形）、**属性**（椭圆，主键加下划线）、**联系**（菱形，联系也可以有属性）。
- 联系类型：**1:1、1:n、m:n**；还有多元联系（三个及以上实体）和自身联系（如员工—领导）。
- **弱实体**：依赖于其他实体才能存在（如"家属"依赖"职工"），用双线矩形表示。
## 局部 E-R 图集成时的冲突
- **属性冲突**：属性**域**冲突（类型、取值范围不同）、属性**取值单位**冲突（千克与斤）。
- **命名冲突**：**同名异义**（同一名字表示不同对象）、**异名同义**（不同名字表示同一对象）。
- **结构冲突**：同一对象在一个局部图中是实体、在另一个中是属性；同一实体在不同局部图中属性个数或排列次序不同；实体间联系在不同局部图中类型不同。
- 集成后还要**消除冗余**（冗余数据与冗余联系）。
!! 概念设计与具体 DBMS 无关；"建立索引"属于物理设计。`,

{id:'m4-8',g:'数据库设计',t:'E-R图转换为关系模式与反规范化',f:'中',sub:'实体转换、1:1/1:n/m:n联系转换、多元联系与自身联系、关系模式个数、反规范化技术与一致性维护',
core:`## E-R 图转换规则
- 每个**实体**转换为一个关系模式，实体的码就是关系的码。
- **1:1 联系**：可并入任意一端（加入另一端的主键作外键及联系属性），也可单独成关系。
- **1:n 联系**：一般**并入 n 端**，在 n 端加入 1 端的主键作外键及联系属性；也可单独成关系（码为 n 端的码）。
- **m:n 联系**：**必须单独**转换为一个关系，码由**两端实体的码组合**而成，联系的属性放入该关系。
- **三个及以上实体的多元联系**：单独转换为一个关系，码一般为各实体码的组合。
- **自身联系**（如员工—经理）：1:n 时在同一关系中加入"经理号"外键。
- 关系模式个数（最少）= 实体数 + m:n 联系数 + 多元联系数。
## 反规范化
- 目的：减少连接、提高查询性能（以空间和一致性维护为代价）。
- 技术：**增加冗余列**、**增加派生列**（如订单总金额）、**重新组表**（合并经常一起查询的表）、**分割表**（水平分割——按行，如按年份；垂直分割——按列，冷热字段分离）、建立汇总表/物化视图。
- 一致性维护：**触发器**、应用程序同步更新、批处理定期校验。
!! m:n 联系一定要单独成表；1:n 联系一般并入 n 端，不要并入 1 端（会出现多值）。`,

/* ---------- 事务与并发控制 ---------- */
{id:'m4-9',g:'事务与并发控制',t:'事务ACID与并发操作带来的问题',f:'高',sub:'事务概念、原子性/一致性/隔离性/持久性、丢失修改、不可重复读、读脏数据、幻读、调度与可串行化',
core:`## 事务
- 事务是用户定义的一个**数据库操作序列**，这些操作**要么全做、要么全不做**，是一个不可分割的工作单位（BEGIN TRANSACTION … COMMIT / ROLLBACK）。
## ACID 特性
- **原子性 A**：要么全部执行，要么全部不执行（依靠**回滚/UNDO 日志**）。
- **一致性 C**：事务执行使数据库从一个一致状态转变到另一个一致状态（如转账前后总额不变）。
- **隔离性 I**：并发执行的事务互不干扰（依靠**并发控制**）。
- **持久性 D**：事务一旦提交，其结果永久保存（依靠**日志与恢复**机制、REDO）。
## 并发操作带来的问题
- **丢失修改**：两个事务读同一数据并各自修改，后提交的覆盖了先提交的结果。
- **不可重复读**：事务 T1 读数据后，T2 修改并提交，T1 再读时结果不同（或数据被删除）。
- **读"脏"数据**：T1 修改数据后未提交，T2 读取了该数据，随后 T1 回滚，T2 读到的是无效数据。
- **幻读**：T1 按条件查询，T2 插入了满足条件的新行，T1 再查时行数变多（可看作不可重复读的一种，侧重于插入/删除）。
## 可串行化
- 多个事务并发执行的结果与按某一次序**串行**执行的结果相同，称该调度是**可串行化**的，这是并发调度**正确性的准则**。
!! 一致性是目标，原子性、隔离性、持久性是保证一致性的手段。
!! 读脏数据的关键是"读到了未提交的数据"；不可重复读是"读到了已提交的修改"。`,

{id:'m4-10',g:'事务与并发控制',t:'封锁协议、两段锁与隔离级别',f:'高',sub:'X锁与S锁相容矩阵、一二三级封锁协议、两段锁协议、活锁与死锁、乐观锁与悲观锁、SQL四种隔离级别、MVCC',
core:`## 锁
- **排他锁 X（写锁）**：加 X 锁后，其他事务**不能再加任何锁**。
- **共享锁 S（读锁）**：加 S 锁后，其他事务**可以加 S 锁、不能加 X 锁**。
- 相容性：S 与 S 相容；S 与 X、X 与 X 都不相容。
## 三级封锁协议
- **一级**：事务在**修改**数据前加 X 锁，**直到事务结束**才释放 → 防止**丢失修改**。
- **二级**：一级 + **读**数据前加 S 锁，**读完即释放** → 还防止**读脏数据**。
- **三级**：一级 + 读数据前加 S 锁，**直到事务结束**才释放 → 还防止**不可重复读**。
## 两段锁协议（2PL）
- 事务分为**扩展阶段**（只能加锁不能解锁）和**收缩阶段**（只能解锁不能加锁）。
- 遵守 2PL 是可串行化的**充分条件**（不是必要条件）；2PL **可能发生死锁**。严格两段锁：X 锁保持到事务提交。
## 活锁与死锁
- **活锁**：某事务长期等待锁（总被其他事务抢先），用**先来先服务**排队解决。
- **死锁**：事务相互等待，用超时、等待图检测并回滚代价小的事务解决。
## 乐观锁与悲观锁
- **悲观锁**：先加锁再操作（SELECT … FOR UPDATE），适合**冲突频繁**的场景。
- **乐观锁**：不加锁，提交时用**版本号或时间戳**检测冲突，失败则重试，适合**读多写少、冲突少**的场景。
## SQL 隔离级别
- **读未提交**：可能脏读、不可重复读、幻读。
- **读已提交**（Oracle、SQL Server 默认）：避免脏读。
- **可重复读**（MySQL InnoDB 默认）：避免脏读、不可重复读；InnoDB 借助 MVCC 与间隙锁很大程度上避免幻读。
- **可串行化**：避免全部问题，并发度最低。
- **MVCC 多版本并发控制**：读操作读取快照版本，读写不阻塞。
!! 2PL 保证可串行化但不能防止死锁；隔离级别越高并发度越低。`,

{id:'m4-11',g:'事务与并发控制',t:'数据库备份与故障恢复',f:'高',sub:'冷备与热备、完全/增量/差异备份、日志文件与先写日志、检查点、事务故障/系统故障/介质故障的恢复、RPO与RTO',
core:`## 备份方式
- **冷备份（静态）**：停止数据库服务后备份，简单一致，但影响业务。
- **热备份（动态）**：数据库运行中备份，需配合日志保证一致性。
- **完全备份**：备份全部数据，恢复最简单，耗时最长。
- **增量备份**：备份**自上一次任何备份**以来变化的数据，备份最快、空间最小，恢复时需要"完全备份 + 其后**所有**增量备份"。
- **差异备份**：备份**自上一次完全备份**以来变化的数据，恢复时只需"完全备份 + **最近一次**差异备份"。
## 日志
- 日志文件记录每个事务的开始、结束及每次更新的前像（旧值）与后像（新值）。
- **先写日志原则（WAL）**：必须先把日志写入磁盘，再把数据写入数据库。
- **检查点**：定期把缓冲区数据写盘并记录检查点，恢复时只需从最近检查点开始扫描日志，缩短恢复时间。
## 故障类型与恢复
- **事务故障**（逻辑错误、违反约束、死锁被回滚）：由 DBMS 自动对该事务执行 **UNDO**。
- **系统故障**（掉电、操作系统崩溃，内存数据丢失，磁盘完好）：重启后**对未提交事务 UNDO、对已提交事务 REDO**。
- **介质故障**（磁盘损坏）：**装入最近的后备副本，再利用日志 REDO** 已提交事务，需要 DBA 介入。
## 容灾指标
- **RPO（恢复点目标）**：允许丢失多长时间的数据；**RTO（恢复时间目标）**：业务中断后多长时间内恢复。
- 主从复制、异地容灾、两地三中心用于缩短 RPO 和 RTO。
!! 增量备份恢复要用"全部"增量，差异备份只需"最近一次"差异。
!! 系统故障：已提交 REDO、未提交 UNDO，顺序不要记反。`,

{id:'m4-12',g:'分布式数据库与数据管理',t:'分布式数据库：透明性、分片、复制与读写分离',f:'中',sub:'分布式数据库特点、分片透明/位置透明/局部数据模型透明、水平/垂直/导出/混合分片、主从复制、读写分离、分库分表',
core:`## 分布式数据库
- 数据在物理上分布在多个场地，逻辑上是一个整体；特点：**数据独立性、集中与自治结合、适当冗余、全局一致性与可恢复性**。
- 体系结构：全局外模式 → 全局概念模式 → **分片模式** → **分配模式** → 局部概念模式 → 局部内模式。
## 透明性（由高到低）
- **分片透明**：用户不必关心数据如何分片。
- **位置透明**：用户不必关心各分片存放在哪个场地。
- **局部数据模型透明**：用户不必关心局部 DBMS 支持的数据模型与 SQL 方言。
## 数据分片
- **水平分片**：按**行**（元组）划分，如按地区、按用户 ID 哈希。
- **垂直分片**：按**列**（属性）划分，每个分片需包含主键以便重构。
- **导出分片**：按另一关系的分片条件划分（如订单随客户分片）。
- **混合分片**：先水平再垂直或相反。
- 分片原则：**完备性**（数据不丢）、**可重构性**（能恢复原关系）、**不相交性**（垂直分片除主键外不重叠）。
## 复制与读写分离
- **主从复制**：主库写，从库通过日志（binlog）同步；**异步复制**性能好但可能丢数据、存在**复制延迟**；**半同步**至少一个从库确认；**同步复制**一致性最好、性能最差。
- **读写分离**：写走主库、读走从库，提高读并发；需处理"写后立即读"读不到的问题（关键读走主库）。
- **分库分表**：解决单库容量与性能瓶颈；带来跨库查询、分页排序、分布式事务、**全局唯一 ID**、扩容迁移等问题。
!! 分片透明是最高层次的透明性；读写分离解决"读多"问题，分库分表解决"数据量大、写多"问题。`,
fig:[{k:'graph',t:'读写分离与复制延迟演示',w:340,h:220,bw:92,bh:36,n:[['应用',170,30,4],['主库（写）',80,170,0],['从库1（读）',220,140,2],['从库2（读）',260,200,2]],e:[[0,1,'写订单',0,-10,0],[1,2,'binlog复制',0,0,-4],[1,3,'',0],[0,2,'读订单',0,14,0]],

{id:'m4-13',g:'分布式数据库与数据管理',t:'数据仓库、OLAP与数据挖掘',f:'中',sub:'数据仓库四特征、ETL、数据集市、星型与雪花模型、OLTP与OLAP、切片切块钻取旋转、ROLAP/MOLAP、数据挖掘方法',
core:`## 数据仓库
- 定义：一个**面向主题的、集成的、相对稳定的（非易失）、反映历史变化的**数据集合，用于支持管理决策。
- 体系结构：**数据源** → **ETL**（**抽取 Extract、转换 Transform、加载 Load**，含清洗、去重、口径统一）→ **数据仓库**（及**数据集市**，面向部门的子集）→ **OLAP 服务器** → 前端工具（报表、多维分析、数据挖掘）。
- 元数据：描述数据仓库中数据的数据（来源、口径、转换规则）。
## 多维模型
- **事实表**：存放度量值（销售额、数量）与各维度外键。
- **维度表**：描述分析角度（时间、地区、产品、客户）。
- **星型模型**：一个事实表 + 多个**非规范化**维度表，查询快；**雪花模型**：维度表进一步规范化，冗余少但连接多。
## OLTP 与 OLAP
- **OLTP**：日常业务处理，操作简单频繁、增删改为主、当前数据、面向应用。
- **OLAP**：分析决策，复杂查询、以读为主、历史与汇总数据、面向主题。
- OLAP 操作：**切片**（固定一个维度的值）、**切块**（多个维度取范围）、**钻取**（上卷：汇总到更高层次；下钻：细化到更低层次）、**旋转**（变换维度的观察方向）。
- 实现：**ROLAP**（基于关系数据库）、**MOLAP**（基于多维数组，查询快）、HOLAP（混合）。
## 数据挖掘
- **关联分析**（购物篮，"支持度、置信度"）、**分类**（决策树、神经网络，有监督）、**聚类**（K-means，无监督）、**预测**、**时序模式**、**偏差（异常）检测**。
!! 数据仓库数据"相对稳定"，以批量加载和查询为主；"钻取"有上卷和下钻两个方向。`,
fig:[{k:'flow',t:'数据仓库体系结构（动态演示数据流）',anim:true,items:['数据源|业务数据库、日志、外部数据','ETL|抽取、清洗转换、加载','数据仓库|面向主题、集成、历史数据','数据集市|面向部门的子集','OLAP 与前端|多维分析、报表、数据挖掘'],caps:['来自 ERP、CRM、POS 等多个异构系统的数据。','统一编码、口径和格式，清洗脏数据，这一步通常最耗工作量。','按主题（销售、客户）组织，保存历史快照，不做日常增删改。','为销售部、财务部等提供更聚焦的数据子集。','管理者通过切片、钻取等操作分析数据，支持决策。']},

 qs:[['设计数据仓库的多维模型。','事实表：销售事实(日期键,门店键,商品键,会员键,销售数量,销售额,折扣)；维度表：时间维(日/月/季/年)、门店维(门店/城市/大区)、商品维(商品/品类/品牌)、会员维(会员/等级/年龄段)，采用星型模型。'],
  ['说明ETL过程中的关键工作。','抽取：增量抽取POS与ERP数据；转换：统一商品编码和门店编码、清洗异常交易、处理退货冲减、计算派生指标；加载：按日分区增量加载，维度采用缓慢变化维处理历史变化。'],

{id:'m4-14',g:'分布式数据库与数据管理',t:'NoSQL、NewSQL与数据库选型',f:'中',sub:'NoSQL四种类型、键值/列族/文档/图数据库、BASE、NewSQL与HTAP、时序数据库、选型原则',
core:`## NoSQL 四类
- **键值数据库**（Redis、Memcached）：Key-Value 存储，读写极快，适合**缓存、会话、计数器、排行榜**。Redis 支持字符串、哈希、列表、集合、有序集合等数据结构，并有 RDB/AOF 持久化。
- **列族数据库**（HBase、Cassandra）：按列族存储，**海量写入**、稀疏宽表、水平扩展，适合日志、监控、用户行为数据。
- **文档数据库**（MongoDB）：存储 JSON/BSON 文档，**模式灵活**，适合结构多变的业务数据、内容管理。
- **图数据库**（Neo4j）：以节点与边存储关系，适合**社交关系、知识图谱、风控关联分析**，多跳查询性能远高于关系库。
- NoSQL 一般放松强一致性，遵循 **BASE**（基本可用、软状态、最终一致），易于水平扩展。
## NewSQL
- 兼具关系数据库的 **SQL 与 ACID 事务**和 NoSQL 的**水平扩展**能力，如 **TiDB、OceanBase、CockroachDB、Spanner**。
- **HTAP**：同一系统同时支持联机事务（OLTP）与实时分析（OLAP）。
## 时序数据库
- 面向带时间戳的数据（物联网传感器、监控指标），高写入吞吐、按时间范围查询、压缩率高、自动降采样与过期，如 InfluxDB、TDengine、IoTDB。
## 选型原则
- 强一致事务、复杂关联查询 → 关系型 / NewSQL；高并发简单读写 → 键值；海量写入 → 列族；结构多变 → 文档；关系网络 → 图；传感器数据 → 时序。
- 实际系统常采用**多模存储**（Polyglot Persistence）：不同数据用最合适的存储。
!! 多跳关系查询选图数据库；Redis 是键值数据库而不是列族数据库。`,

{id:'m5-1',g:'系统工程',t:'系统工程概念与经典方法',f:'中',sub:'系统与系统工程、霍尔三维结构、切克兰德软系统方法、并行工程、综合集成法、WSR方法论',
core:`## 系统与系统工程
- **系统**：由相互联系、相互作用的若干要素组成，具有特定功能的有机整体。特性：**整体性、关联性、层次性、目的性、环境适应性**、涌现性（整体具有部分所没有的性质）。
- **系统工程**：从整体出发，合理开发、设计、实施和运用系统的工程技术，以**整体最优**为目标，是一种跨学科的方法论。
## 霍尔三维结构（硬系统方法）
- **时间维**（7 个阶段）：规划、拟定方案、研制、生产、安装、运行、更新。
- **逻辑维**（7 个步骤）：明确问题、确定目标、系统综合、系统分析、优化、决策、实施。
- **知识维**：完成上述工作所需的工程、医学、建筑、商业、法律、管理等知识。
- 适用于**目标明确、结构化**的工程技术问题，核心是**最优化**。
## 切克兰德方法（软系统方法）
- 适用于社会、经济、管理等**非结构化**"软"问题，目标需要在过程中探寻。
- 核心是"**比较**"与"**探寻**"（学习）：认识问题 → 根底定义 → 建立概念模型 → **比较概念模型与现实** → 实施改善。
## 其他方法
- **并行工程**：对产品及其相关过程（制造、支持）进行**并行、集成化设计**，从一开始就考虑全生命周期因素，目标是**缩短周期、提高质量、降低成本**。
- **综合集成法**（钱学森）：面向**开放的复杂巨系统**，"从定性到定量"，把专家体系、数据与信息体系、计算机体系结合（综合集成研讨厅）。
- **WSR 系统方法论**（顾基发）：**物理（W）—事理（S）—人理（R）**，"懂物理、明事理、通人理"。
!! 霍尔三维没有"空间维"；霍尔核心是最优化，切克兰德核心是比较与学习。`,

{id:'m5-2',g:'系统工程',t:'MBSE与系统工程生命周期',f:'中',sub:'MBSE定义与三大支柱、SysML九种图、MBSE方法论、系统工程生命周期阶段、生命周期方法（计划驱动/渐进迭代/精益/敏捷）',
core:`## MBSE 基于模型的系统工程
- 定义（INCOSE）：形式化地应用建模手段，支持系统**需求、设计、分析、验证与确认**活动，从概念设计阶段开始，持续贯穿到开发和后续的生命周期阶段。
- 与传统"以文档为中心"相比：以**模型为单一可信源**，需求—设计—验证可**追溯**，可自动检查**一致性**、支持**早期仿真验证**、变更影响分析更容易。
- **三大支柱**：**建模语言**（SysML）、**建模方法**（Harmony-SE、OOSEM、RFLP、Arcadia）、**建模工具**（Cameo/MagicDraw、Capella、Rhapsody）。
## SysML 九种图
- **需求图**（需求及追溯关系，SysML 新增）；
- 结构图：**块定义图**（对应类图）、**内部块图**（块内部结构与接口）、**包图**、**参数图**（工程约束与性能分析，SysML 新增）；
- 行为图：**活动图**、**序列图**、**状态机图**、**用例图**。
## 系统工程生命周期阶段
- **概念阶段**（识别需求、探索概念、可行性）→ **开发阶段**（细化需求、设计、集成、验证）→ **生产阶段** → **使用阶段** → **保障阶段**（维护、升级）→ **退役阶段**。
## 生命周期方法
- **计划驱动方法**：需求预先确定、严格按阶段推进，适合需求稳定、高安全要求的项目。
- **渐进迭代式开发**：分阶段交付能力，逐步完善。
- **精益方法**：消除浪费、价值流。
- **敏捷方法**：快速响应变化、持续交付。
!! 需求图和参数图是 SysML 相对 UML 新增的图；MBSE 的核心是"模型代替文档"。`,

/* ---------- 信息系统基础 ---------- */
{id:'m5-3',g:'信息系统基础',t:'信息系统的概念、生命周期与分类',f:'中',sub:'信息系统组成、生命周期五阶段、TPS/MIS/DSS/ES/OAS/EIS、DSS组成、信息系统发展阶段（诺兰模型）',
core:`## 信息系统
- 由**计算机硬件、软件、数据库、网络、存储设备、规章制度和人员**组成，对信息进行采集、处理、存储、管理、检索和传输的人机系统。
## 生命周期
- **系统规划**：初步调查、可行性研究、总体规划，输出**可行性研究报告、系统设计任务书**。
- **系统分析**：调查现行系统、建立新系统**逻辑模型**，回答"**做什么**"，输出**系统说明书**（需求规格）。
- **系统设计**：总体设计（模块结构）与详细设计（代码、数据库、输入输出、处理过程），建立**物理模型**，回答"**怎么做**"。
- **系统实施**：编程、测试、人员培训、**数据准备与转换**、试运行。
- **系统运行与维护**：运行管理、维护、评价。
## 信息系统分类
- **业务处理系统 TPS**：处理日常业务事务，是最基础的信息系统，为其他系统提供数据。
- **管理信息系统 MIS**：面向中层管理，提供例行报表、控制与计划支持（处理**结构化**问题）。
- **决策支持系统 DSS**：辅助解决**半结构化和非结构化**决策问题，由**数据库、模型库、方法库、知识库**及**人机交互（对话）**部分组成。
- **专家系统 ES**：由**知识库、推理机**、解释器、知识获取模块组成，模拟专家求解问题。
- **办公自动化系统 OAS**：文字处理、公文流转、日程、协同办公。
- **主管信息系统 EIS**：服务于高层管理者，提供综合性、汇总的信息。
## 诺兰模型（信息系统发展阶段）
- **初始、普及（扩展）、控制、集成、数据管理、成熟**六个阶段；控制阶段到集成阶段是从以计算机管理为主到以数据管理为主的转折。
!! 系统分析建立逻辑模型（做什么），系统设计建立物理模型（怎么做）。
!! DSS 处理半结构化与非结构化问题；MIS 主要处理结构化问题。`,

{id:'m5-4',g:'信息系统基础',t:'信息系统开发方法与系统规划方法',f:'中',sub:'结构化方法、原型法、面向对象方法、面向服务方法、形式化方法、可行性分析四个方面、BSP企业系统规划法、CSF、SST、U/C矩阵',
core:`## 开发方法
- **结构化方法**：**自顶向下、逐步求精**、用户至上、严格划分阶段、文档规范；工具：DFD、DD、结构图。适合**需求明确、规模大**的系统；缺点是周期长、难以适应需求变化。
- **原型法**：快速构建原型 → 用户评价 → 修改完善，适合**需求不明确**、交互多的系统。分为**抛弃型原型**（澄清需求后丢弃）与**演化型原型**（逐步演化为最终系统）。
- **面向对象方法**：以对象为中心，**封装、继承、多态**，分析（OOA）、设计（OOD）、编程（OOP）概念统一，复用性和可维护性好。
- **面向服务方法**：以**服务**为基本单元，松耦合、可组合，适合多系统集成与业务流程编排。
- **形式化方法**：用数学语言精确描述规格（Z、B 方法），适合安全关键系统。
## 可行性分析
- **经济可行性**（成本效益，最重要）、**技术可行性**、**法律（社会）可行性**、**执行（操作）可行性**（组织与人员能否接受和使用）。
## 系统规划方法
- **CSF 关键成功因素法**：识别对企业成功起关键作用的因素，据此确定信息需求。
- **SST 战略目标集转化法**：把组织的战略目标集转化为信息系统的战略目标集。
- **BSP 企业系统规划法**：自上而下识别**企业目标 → 企业过程 → 数据类**，再自下而上设计信息系统总体结构；用 **U/C 矩阵**（Use/Create，过程使用或产生数据类）划分子系统。
- 其他：企业信息分析与集成技术（EIAI）、投资回收法、价值链分析。
!! 需求不明确选原型法；需求明确、规模大选结构化；BSP 的核心工具是 U/C 矩阵。`,

{id:'m5-5',g:'企业信息化与电子政务',t:'企业信息化：ERP、CRM、SCM、BI与企业门户',f:'中',sub:'企业信息化内涵、MRP到MRPⅡ到ERP、ERP功能模块、CRM核心与功能、SCM、BI组成、企业门户类型、智能制造中的MES与PLM',
core:`## ERP 的发展
- **MRP（物料需求计划）**：根据主生产计划、物料清单 BOM、库存信息计算物料需求；**闭环 MRP** 加入能力需求计划与反馈。
- **MRPⅡ（制造资源计划）**：在闭环 MRP 基础上**集成财务管理**，实现物流与资金流统一，生产经营一体化。
- **ERP（企业资源计划）**：在 MRPⅡ 基础上扩展到全企业及**供应链**，整合**物流、资金流、信息流**；功能模块：生产控制（计划、制造）、物流管理（分销、采购、库存）、财务管理（会计核算、财务管理）、人力资源管理。
## CRM 客户关系管理
- 核心思想：**以客户为中心**，提高客户满意度与忠诚度；核心是**客户数据的管理与分析**。
- 功能：**营销自动化、销售自动化、客户服务与支持**、商业智能（客户分析）；与呼叫中心、电子商务集成。
## SCM 供应链管理
- 对**供应商—制造商—分销商—零售商—最终用户**之间的物流、信息流、资金流进行计划、协调与控制，降低库存、提高响应速度（牛鞭效应是需求信息逐级放大的现象）。
## BI 商业智能
- 由**数据仓库、OLAP、数据挖掘**等技术组成，把数据转化为知识，支持决策；过程：数据预处理（ETL）→ 建立数据仓库 → 数据分析 → 数据展现。
## 企业门户
- **企业网站**、**企业信息门户 EIP**（统一信息入口）、**企业知识门户 EKP**（知识管理）、**企业应用门户 EAP**（集成业务应用）、垂直门户。
## 智能制造相关系统
- **MES 制造执行系统**：车间层生产调度、过程控制、质量追溯；**PLM 产品生命周期管理**：研发设计数据、BOM 与图纸管理；三者关系：PLM（设计）→ ERP（计划）→ MES（执行）。
!! MRPⅡ 相对 MRP 的关键是"集成了财务"；ERP 相对 MRPⅡ 扩展到"供应链与全企业资源"。`,

{id:'m5-6',g:'企业信息化与电子政务',t:'电子政务与电子商务',f:'中',sub:'电子政务G2G/G2B/G2C/G2E、电子政务建设内容、电子商务B2B/B2C/C2C/O2O、电子商务三流、电子商务系统架构',
core:`## 电子政务
- 政府机构运用信息技术，将管理和服务通过网络实现，优化组织与流程，向社会提供优质、全方位的服务。
- 四种模式：
- **G2G**：政府与政府之间，如上下级公文流转、部门间信息共享、电子公文系统。
- **G2B**：政府对企业，如**网上报税、工商注册、电子采购与招投标**、企业年报。
- **G2C**：政府对公众，如**户籍、社保、公积金、居住证**办理与查询、个人所得税申报。
- **G2E**：政府对公务员，如内部管理、培训、考核、办公系统。
- 建设要点：统一身份认证、电子证照、电子签章、数据共享交换、"一网通办"。
## 电子商务
- 模式：**B2B**（企业之间，如阿里巴巴 1688、企业采购平台）、**B2C**（企业对消费者，如京东自营）、**C2C**（消费者之间，如闲鱼）、**O2O**（线上到线下，如外卖、到店服务）、C2B（消费者定制）。

{id:'m5-7',g:'企业信息化与电子政务',t:'企业应用集成EAI',f:'中',sub:'表示集成、数据集成、控制集成、业务流程集成、门户集成、B2B集成、点对点与总线式集成、ESB与iPaaS',
core:`## 集成层次（由浅入深）
- **表示集成（界面集成）**：把多个应用的用户界面集中到统一门户，**黑盒集成**，实现最简单，只集成了界面，后台系统未打通。
- **数据集成**：在数据层面集成，**白盒集成**（需了解数据结构）；方式：**数据复制、数据聚合、联邦数据库**（统一虚拟视图）、ETL、数据交换平台。
- **控制集成（功能集成、应用集成）**：在**业务逻辑层**通过 API、RPC、消息中间件、Web Service 调用其他应用的功能，**黑盒集成**。
- **业务流程集成（过程集成）**：跨多个应用对业务流程统一建模、协调与监控（工作流、BPM、BPEL 服务编排），实现端到端流程自动化。
- **企业间集成（B2B 集成）**：与供应商、客户系统对接（EDI、开放 API、供应链协同平台）。
## 集成方式
- **点对点集成**：系统两两直接对接，n 个系统最多 **n(n−1)/2** 条接口，耦合高、维护难。
- **总线式集成（ESB/EAI 平台）**：各系统通过适配器接入总线，由总线完成**协议转换、消息路由、数据格式转换、服务编排、监控**，接口数降为 n。
- **iPaaS 集成平台即服务**：云化的集成平台，适合 SaaS 与混合云集成。
- **主数据管理 MDM**：统一组织、客户、物料等核心数据的编码与口径，是集成的基础。
!! 数据集成是白盒集成，表示集成与控制集成是黑盒集成。
!! 集成深度：表示 < 数据 < 控制 < 业务流程。`,

{id:'m6-1',g:'软件过程与开发模型',t:'经典软件开发模型',f:'高',sub:'瀑布模型、V模型、原型模型、增量模型、螺旋模型、喷泉模型、演化模型、基于构件的模型、模型选择',
core:`## 瀑布模型
- 各阶段（需求、设计、编码、测试、运维）**线性顺序**进行，上一阶段的输出是下一阶段的输入，**文档驱动**、阶段评审。
- 适合**需求明确且稳定**、技术成熟的项目；缺点：难以适应需求变化、用户到后期才见到产品、**风险后置**。
## V 模型
- 瀑布模型的变种，强调**测试活动与开发阶段的对应**：
- 需求分析 ↔ **验收测试**（与系统测试）；概要设计 ↔ **集成测试**；详细设计 ↔ **单元测试**。
- 测试计划在对应的开发阶段就开始编写。
## 原型模型
- 先快速构建原型帮助用户明确需求，适合**需求不明确**的项目；分为抛弃型与演化型。
## 增量模型
- 把系统分批次开发与交付，**第一个增量通常实现核心功能**；用户较早获得可用产品，降低一次性投入风险；要求系统可分解、架构良好。
## 螺旋模型
- 结合**瀑布模型与原型**并加入**风险分析**，每一圈包括四个象限：**制定计划 → 风险分析 → 实施工程 → 客户评估**。
- **风险驱动**，适合**大型、复杂、高风险**项目；依赖风险评估经验，过程较复杂。
## 喷泉模型
- 以**用户需求为动力、对象为驱动**，主要用于**面向对象**开发；各阶段**无间隙**、相互重叠、多次迭代。
## 其他
- **演化模型**：迭代地开发逐步完善的版本；**基于构件的模型**：利用预先包装的构件构造系统，强调复用。
## 模型选择要点
- 需求稳定 → 瀑布/V；需求不明确 → 原型；可分批交付 → 增量；风险大 → 螺旋；面向对象 → 喷泉/RUP；变化快、小团队 → 敏捷。
!! 螺旋模型"风险驱动"；V 模型中"概要设计对应集成测试"；喷泉模型"无间隙、面向对象"。`,
fig:[{k:'flow',t:'螺旋模型的一圈（动态演示四个象限）',anim:true,loop:true,items:['制定计划|确定目标、备选方案与约束条件','风险分析|识别、评估并消除风险（必要时构建原型）','实施工程|开发与验证本轮产品','客户评估|评审本轮成果并规划下一圈'],caps:['每一圈开始都要重新确定本轮目标。','这是螺旋模型区别于其他模型的关键：每一圈都显式做风险分析，风险过大可以终止项目。','用本轮最合适的方式（可能是瀑布式）开发。','客户评审后进入下一圈，产品逐圈扩展完善。']},

{id:'m6-2',g:'软件过程与开发模型',t:'统一过程RUP',f:'高',sub:'RUP三大特点、四个阶段与里程碑、九个核心工作流、迭代与增量、4+1视图、RUP最佳实践',
core:`## 三大特点
- **用例驱动**：以用例描述需求，并驱动分析、设计、实现与测试。
- **以架构为中心**：早期建立稳定的架构基线，后续开发围绕架构展开。
- **迭代与增量**：每个阶段可包含多次迭代，每次迭代产生可执行的增量版本。
## 四个阶段与里程碑
- **初始阶段（Inception）**：确定项目边界、业务用例与可行性，识别关键风险 → 里程碑：**生命周期目标**。
- **细化阶段（Elaboration）**：分析问题领域，**建立架构基线**，淘汰最高风险元素，制订项目计划 → 里程碑：**生命周期架构**。
- **构建阶段（Construction）**：开发所有构件与功能并集成测试，是工作量最大的阶段 → 里程碑：**初始运作能力**（Beta 版）。
- **交付阶段（Transition）**：把产品交付给用户，Beta 测试、培训、部署 → 里程碑：**产品发布**。
## 九个核心工作流
- 六个**核心过程工作流**：业务建模、需求、分析与设计、实现、测试、部署。
- 三个**核心支持工作流**：配置与变更管理、项目管理、环境。
- 各工作流在各阶段中的工作量不同（如需求在初始/细化阶段多，实现在构建阶段多）。
## 4+1 视图
- RUP 采用 Kruchten 的 4+1 视图描述架构：逻辑视图、实现（开发）视图、进程视图、部署（物理）视图，加用例视图。
## 最佳实践
- 迭代开发、管理需求、使用基于构件的架构、可视化建模（UML）、持续验证质量、控制变更。
!! 架构基线在**细化**阶段建立；初始阶段的里程碑是"生命周期目标"，细化阶段是"生命周期架构"。`,

{id:'m6-3',g:'软件过程与开发模型',t:'敏捷开发方法：XP、Scrum等',f:'高',sub:'敏捷宣言四个价值观、XP四个价值观与十二个实践、Scrum角色/工件/事件、水晶法、ASD、FDD、DSDM、精益开发',
core:`## 敏捷宣言
- **个体和交互** 胜过 过程和工具；**可工作的软件** 胜过 详尽的文档；**客户合作** 胜过 合同谈判；**响应变化** 胜过 遵循计划。
- 适合**需求多变、小团队（一般少于 10 人）**、客户可频繁参与的项目。
## XP 极限编程
- 四个价值观：**沟通、简单、反馈、勇气**（后加入"尊重"）。
- 十二个实践：**计划游戏、小型发布、隐喻、简单设计、测试先行（TDD）、重构、结对编程、集体代码所有制、持续集成、每周工作 40 小时、现场客户、编码标准**。
## Scrum
- 角色：**产品负责人 PO**（维护产品待办列表并排序）、**Scrum Master**（保障过程、消除障碍）、**开发团队**（跨职能、自组织）。
- 工件：**产品待办列表**（Product Backlog）、**冲刺待办列表**（Sprint Backlog）、**增量**。
- 事件：**Sprint**（通常 2~4 周）、Sprint 计划会、**每日站会**（15 分钟）、Sprint 评审会（演示增量）、Sprint 回顾会（改进过程）。
## 其他敏捷方法
- **水晶法 Crystal**：每个不同项目需要一套不同的策略、约定和方法论。
- **自适应软件开发 ASD**：**猜测（推测）、合作、学习**三阶段循环。
- **特性驱动开发 FDD**：以特性（客户价值的小功能）为单位，五个过程（开发整体模型、构造特性列表、按特性计划、按特性设计、按特性构建）。
- **动态系统开发方法 DSDM**：时间盒、MoSCoW 优先级。
- **精益软件开发**：消除浪费、快速交付、延迟决策。
- **开放式源码**：程序开发人员在地域上分布。
!! XP 的价值观是"沟通、简单、反馈、勇气"，不是"计划、设计、编码、测试"。
!! 敏捷并不是"不要文档"，而是更重视可工作的软件。`,

{id:'m6-4',g:'软件过程与开发模型',t:'软件过程改进与CMMI',f:'中',sub:'CMMI阶段式与连续式、五个成熟度等级、过程域、能力等级、软件过程改进IDEAL模型',
core:`## CMMI 能力成熟度模型集成
- 两种表示方法：**阶段式**（按成熟度等级评估整个组织）与**连续式**（按过程域分别评估能力等级）。
## 阶段式五个成熟度等级
- **1 级 初始级**：过程无序、不可预测，成功依赖个人能力。
- **2 级 已管理级**：**项目级**的需求管理、项目计划、项目监控、配置管理、质量保证、供应商协议管理等基本管理过程。
- **3 级 已定义级**：**组织级**建立标准过程并在项目中**裁剪**使用；包含需求开发、技术解决方案、产品集成、验证、确认、组织过程定义、培训、风险管理、决策分析等。
- **4 级 量化管理级**：用**统计和量化技术**管理过程性能与质量（组织过程性能、定量项目管理）。
- **5 级 优化级**：**持续过程改进**与创新（因果分析与解决、组织创新与部署）。
## 连续式能力等级
- **0 级 未完成、1 级 已执行、2 级 已管理、3 级 已定义**（CMMI v1.3；早期版本还有 4 级量化管理、5 级优化）。
## 软件过程改进
- **IDEAL 模型**：**初始化（Initiating）→ 诊断（Diagnosing）→ 建立（Establishing）→ 行动（Acting）→ 学习（Learning）**。
!! "项目级"管理是 2 级，"组织级标准过程"是 3 级，"量化"是 4 级，"持续优化"是 5 级。`,

{id:'m6-5',g:'需求工程',t:'需求层次、分类与需求获取',f:'高',sub:'业务需求/用户需求/功能需求、非功能需求与设计约束、QFD三类需求、需求获取方法、需求获取难点',
core:`## 需求层次
- **业务需求**：组织或客户的高层目标，描述"为什么做"，记录在**项目视图与范围文档**中。
- **用户需求**：用户使用系统必须完成的任务，用**用例**、场景、用户故事描述，记录在用例文档中。
- **功能需求（系统需求）**：开发人员必须实现的软件功能，记录在**软件需求规格说明书 SRS** 中。
- **非功能需求**：系统的质量属性，如性能、可靠性、可用性、安全性、易用性、可维护性。
- **设计约束**：对解决方案的限制，如必须使用国产数据库、必须符合某行业标准、开发语言限制。
## QFD 质量功能部署的三类需求
- **常规需求**：用户明确提出、希望实现的功能，实现越多用户越满意。
- **期望需求**：用户认为理所当然、**不会明确提出**的需求，没实现会非常不满意。
- **意外需求（兴奋需求）**：超出用户预期，实现后用户会非常满意，不实现也不会不满。
## 需求获取方法
- **用户访谈**（结构化/非结构化，最基本）、**问卷调查**（覆盖面广、成本低）、**采样**（从现有文档与数据中抽样）、**情节串联板**（一系列图片描述场景，适合界面与交互）、**联合需求计划 JRP**（多方集中研讨、高度组织化，快速达成共识）、**需求记录技术**（任务卡片、场景说明、用户故事）、**观察/现场调研**、阅读现有文档、**原型**。
## 需求获取的难点
- 用户说不清需求、需求理解偏差、需求不断变化、干系人之间需求冲突、遗漏隐性需求。
!! "系统应在 2 秒内响应"是非功能需求；"必须使用 Java 开发"是设计约束。`,

{id:'m6-6',g:'需求工程',t:'需求分析、规格说明与需求验证',f:'中',sub:'结构化分析模型（DFD/DD/E-R/STD）、面向对象分析模型、需求优先级、SRS内容、需求评审、需求验证方法',
core:`## 需求分析
- 任务：对获取的需求进行**分类、细化、建模**，发现并解决需求之间的冲突，确定优先级。
## 结构化分析（SA）模型
- 核心是**数据字典 DD**；围绕数据字典建立三种模型：
- **功能模型**：**数据流图 DFD**（外部实体、加工、数据流、数据存储），分层细化，父图与子图保持平衡。
- **数据模型**：**E-R 图**。
- **行为模型**：**状态转换图 STD**。
- 加工逻辑描述：结构化语言、判定表、判定树。
## 面向对象分析（OOA）
- **用例模型**（用例图 + 用例描述）、**分析模型/领域模型**（类图、对象图）、动态模型（顺序图、状态图、活动图）。
- 用例描述包括：用例名、参与者、前置条件、后置条件、**基本事件流、备选事件流**、业务规则。
## 需求优先级
- **MoSCoW**：Must have、Should have、Could have、Won't have；也可按价值—成本—风险排序。
## 软件需求规格说明书 SRS
- 内容：范围、总体描述、**功能需求、非功能需求、外部接口**、约束、假设与依赖。
- 良好需求的特征：**完整、正确、可行、必要、无歧义、可验证、可跟踪、一致、可修改**、有优先级。
## 需求验证（确认）
- 目的：确认需求正确反映用户意图，发现缺陷。
- 方法：**需求评审**（正式评审、走查、检查清单）、**原型**、编写**测试用例**、用户手册草稿、模型检查。
- 需求验证通过后建立**需求基线**。
!! 结构化分析的核心是数据字典；需求必须"可验证"，"系统要好用"这类描述无法验证。`,

{id:'m6-7',g:'需求工程',t:'需求管理：基线、变更控制与需求跟踪',f:'高',sub:'需求管理活动、需求基线、变更控制流程与CCB、变更影响分析、需求跟踪矩阵、正向与逆向跟踪、需求状态',
core:`## 需求工程的组成
- 需求工程 = **需求开发**（获取、分析、定义/规格说明、验证）+ **需求管理**。
- 需求管理活动：**定义需求基线**、**处理需求变更**（变更控制）、**需求版本控制**、**需求跟踪**、**需求状态跟踪**。
## 需求基线
- 经过评审批准、作为后续开发基础的需求集合；基线之后的任何修改都必须走**变更控制**流程。
## 变更控制流程
- **问题分析与变更描述**（提出变更申请）→ **变更分析与成本计算**（影响分析：范围、进度、成本、质量、风险）→ **CCB 审批** → **变更实现** → 验证 → 修改基线、通知相关方、更新跟踪矩阵。
- **CCB（变更控制委员会）**：由项目相关方代表组成，**负责决策**是否接受变更，不负责具体实施。
- 变更的原因：外部环境变化、用户需求变化、需求获取不完整、技术变化等。
## 需求跟踪
- **正向跟踪**：从需求到下游工作产品（设计、代码、测试用例），检查每个需求是否都被实现和测试。
- **逆向跟踪**：从代码、测试用例回溯到需求，检查是否有**无需求依据的"镀金"**或遗漏。
- 工具：**需求跟踪矩阵**（需求 ID × 设计 × 代码 × 测试用例）。
- 需求状态：已建议、已批准、已实现、已验证、已删除等。
!! CCB 负责"决策"，不负责"实施"；从测试用例追溯到需求是"逆向跟踪"。`,

  ['提出改进措施。','需求评审后建立基线；成立CCB，变更走"申请—影响分析—审批—实施—验证"流程；需求管理工具做版本控制；建立跟踪矩阵；指定科室需求联络人统一入口；按影响调整合同范围、进度与费用。']],

{id:'m6-8',g:'软件设计',t:'结构化设计：模块独立性、内聚与耦合',f:'高',sub:'概要设计与详细设计、模块化与信息隐藏、七种内聚、七种耦合、扇入扇出、结构图与设计原则',
core:`## 结构化设计
- **概要设计**：把需求转化为软件的**模块结构**与接口，设计数据结构、确定模块之间的调用关系（**结构图 SC**）。
- **详细设计**：确定每个模块内部的算法与数据结构（程序流程图、N-S 图、PAD 图、伪代码）。
- 设计原则：**抽象、模块化、信息隐藏、模块独立**（高内聚、低耦合）。
## 内聚（模块内部联系紧密程度，由高到低）
- **功能内聚**：模块内所有元素共同完成**一个单一功能**（最好）。
- **顺序内聚**：各处理元素与同一功能密切相关且必须顺序执行，**前一个的输出是后一个的输入**。
- **通信内聚**：各部分使用**相同的输入数据**或产生**相同的输出数据**。
- **过程内聚**：处理元素相关，且必须按**特定次序**执行。
- **时间内聚（瞬时内聚）**：所含任务必须在**同一时间段**内执行（如初始化模块）。
- **逻辑内聚**：完成**逻辑上相似**的一组任务，通过参数选择执行哪一个。
- **偶然内聚（巧合内聚）**：各元素之间**没有联系**（最差）。
## 耦合（模块之间联系紧密程度，由低到高）
- **非直接耦合**：模块间没有直接联系。
- **数据耦合**：通过参数传递**简单数据**。
- **标记耦合**：通过参数传递**数据结构**（记录）。
- **控制耦合**：传递**控制信号**（标志、开关量），影响被调模块的内部逻辑。
- **外部耦合**：访问同一个**外部全局简单变量**（而非全局数据结构）。
- **公共耦合**：访问同一个**公共数据环境**（全局数据结构、共享内存区）。
- **内容耦合**：一个模块直接访问另一个模块的**内部数据**或转入其内部（最差）。
## 其他设计启发
- **扇入**：调用本模块的上级模块数，**高扇入**说明复用性好；**扇出**：本模块直接调用的下级模块数，一般 3~4 个为宜（不超过 7）。
- 深度、宽度适中；模块作用域应在控制域之内；降低接口复杂度。
!! 内聚"功顺通过时逻偶"由高到低；耦合"非数标控外公内"由低到高。`,
